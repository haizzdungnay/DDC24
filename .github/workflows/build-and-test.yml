# Build & Test Workflow — MK-DDC-24
#
# Compiles and tests the 4 main components of the DDC-24 controller:
#   1. C++ SOM Services (mkddc-core, mkddc-iobus) and runs GoogleTest
#   2. Go Web API
#   3. React Web UI
#   4. STM32 MCU Firmware
#
# References:
#   - docs/03_implementation/10_TASK_CHECKLIST.md (SKEL-004, ACT-022)

name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-layout:
    name: Kiến trúc repository
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Layout gate chạy generator registry C++/Go/TS và dùng gofmt để byte Go
      # sinh ra ổn định. Không dựa vào Go ambient của runner.
      - name: Setup Go cho generator contract
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/web-api/go.mod
          cache: false

      - name: Kiểm authority, dependency và build artifact
        run: scripts/verify-project.sh --component layout

  som-services:
    name: C++ SOM Services (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            profile: baseline
            extra_packages: ""
          - name: modbus
            profile: modbus
            extra_packages: libmodbus-dev
          - name: bacnet
            profile: bacnet
            extra_packages: ""
          - name: modbus+bacnet
            profile: modbus-bacnet
            extra_packages: libmodbus-dev
          # F-14: trước leg này, mkddc-hmi CHƯA BAO GIỜ được CI biên dịch và 28
          # test HMI chưa bao giờ chạy — vì MKDDC_ENABLE_HMI mặc định OFF và
          # không leg nào bật nó. Đó là lý do F-03 (annunciation an toàn bị nuốt
          # im lặng) tồn tại mà không có gate nào bắt được.
          # Leg này phủ tổ hợp đầy đủ nhất: modbus + bacnet + hmi.
          - name: modbus+bacnet+hmi
            profile: full
            extra_packages: libmodbus-dev libdrm-dev libfreetype-dev pkg-config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libgtest-dev \
            libgmock-dev \
            libsodium-dev \
            ninja-build \
            ${{ matrix.extra_packages }}

      - name: Build và test qua entrypoint chuẩn
        run: scripts/verify-project.sh --component cpp --profile '${{ matrix.profile }}'

      - name: Kiểm bất biến — watchdog chỉ kick sau khi hoàn tất scan
        run: |
          # PROGRAM_TASK_SCHEDULER_SPEC §9: kick giữa scan biến watchdog
          # thành liveness check vô nghĩa — một step() treo vẫn kick đều.
          # Kick hợp lệ CHỈ nằm trong main.cpp (hook after_scan).
          if grep -n 'WATCHDOG=1' apps/core/application/runtime/scan_loop.cpp; then
            echo 'LỖI: watchdog kick nằm trong scan loop'
            exit 1
          fi
          test "$(grep -c 'WATCHDOG=1' apps/core/bootstrap/main.cpp)" = "1" || {
            echo 'LỖI: số điểm kick trong main.cpp phải đúng bằng 1'
            exit 1
          }
          echo 'OK: watchdog chỉ kick tại một điểm, sau khi scan hoàn tất'

      - name: Kiểm bất biến — mkddc-core KHÔNG được chứa parser ST
        run: |
          # TYPED_IR_ARTIFACT_SPEC §10.3: runtime chỉ thực thi artifact đã
          # verify, không bao giờ parse source. Kiểm ở mức symbol để vi phạm
          # bị bắt ngay tại CI thay vì lộ ra khi đã chạy production.
          BIN=$(find build -name mkddc-core -type f | head -1)
          test -n "$BIN" || { echo 'không tìm thấy mkddc-core'; exit 1; }
          if nm -C "$BIN" | grep -E 'parse_st_program|typecheck_st_program|compile_st_to_ir'; then
            echo 'LỖI KIẾN TRÚC: compiler ST bị liên kết vào mkddc-core'
            exit 1
          fi
          echo 'OK: mkddc-core không chứa symbol compiler'

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: build/verify/cpp-${{ matrix.profile }}/Testing/
          retention-days: 7

  web-backend:
    name: Go Web Backend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/web-api/go.mod'

      - name: Vet và test race Go Web API
        run: scripts/verify-project.sh --component go --profile race

  web-frontend:
    name: React Web Frontend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web-ui/package-lock.json

      - name: Install dependencies
        working-directory: apps/web-ui
        run: npm ci

      # F-13: job này trước đây CHỈ chạy `npm run build` (tsc --noEmit && vite
      # build). 133 vitest test trên 25 file và `eslint --max-warnings=0` không
      # chặn được gì — chỉ lỗi type và lỗi bundle mới bị bắt, còn mọi regression
      # hành vi ở component/hook/AuthProvider/useWebSocket đều merge xanh.
      - name: Test, lint và build React Web UI
        run: scripts/verify-project.sh --component frontend

      # F-07: `npm test` chỉ quét src/, nên E2E cần cổng Playwright riêng. Cổng
      # mock hiện chạy động 8 spec/61 test; chỉ cách ly point-names đang đỏ sẵn
      # và programming-real do lane backend/Core thật sở hữu riêng.
      - name: Install Playwright browser
        working-directory: apps/web-ui
        run: npx playwright install --with-deps chrome

      - name: E2E mock — 8 spec / 61 test
        run: scripts/verify-project.sh --component e2e

  programming-real-e2e:
    name: Programming E2E backend/Core thật (host)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài toolchain C++ cho Core simulator và compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libsodium-dev \
            pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/web-api/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web-ui/package-lock.json

      - name: Cài phụ thuộc Web UI và Chrome
        working-directory: apps/web-ui
        run: |
          npm ci
          npx playwright install --with-deps chrome

      - name: Chặn mock lọt vào lane real-backend
        run: |
          if grep -nE '(page|context|browserContext)\.(route|routeFromHAR|routeWebSocket)\(' apps/web-ui/e2e/programming-real.spec.ts; then
            echo 'LỖI: Programming real-backend E2E không được dùng route/mock ở page hoặc browser context'
            exit 1
          fi

      - name: Project đến Restore qua backend, compiler và Core simulator thật
        run: scripts/verify-project.sh --component e2e-real

  mcu-firmware:
    name: MCU Firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arm-none-eabi-gcc & newlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build Firmware
        run: scripts/verify-project.sh --component firmware

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài phụ thuộc
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsodium-dev
      - name: ASan
        run: |
          # -Werror bắt lỗi compile-time; ASan bắt lỗi bộ nhớ lúc chạy. Loader IR
          # không kiểm biên sau khi load nên một lỗi ở đó là lỗi an toàn bộ nhớ.
          cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug -DMKDDC_SANITIZE=address
          cmake --build build/asan --parallel $(nproc)
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build/asan --output-on-failure --parallel 4
      - name: UBSan
        run: |
          # -fno-sanitize-recover: UB phải làm test FAIL, không được chỉ in cảnh
          # báo rồi chạy tiếp — UB im lặng lọt qua CI tệ hơn không chạy UBSan.
          cmake -S . -B build/ubsan -DCMAKE_BUILD_TYPE=Debug -DMKDDC_SANITIZE=undefined
          cmake --build build/ubsan --parallel $(nproc)
          ctest --test-dir build/ubsan --output-on-failure --parallel 4

  fuzz-smoke:
    name: Fuzz smoke (parser + loader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài phụ thuộc
        run: sudo apt-get update && sudo apt-get install -y cmake clang libsodium-dev
      - name: Build fuzz harness
        run: |
          CXX=clang++ CC=clang cmake -S . -B build/fuzz -DCMAKE_BUILD_TYPE=Debug \
            -DMKDDC_BUILD_FUZZ=ON -DMKDDC_SANITIZE=address \
            -DCORE_BUILD_TESTS=OFF -DIOBUS_BUILD_TESTS=OFF
          cmake --build build/fuzz --target fuzz_st_parser fuzz_st_loader --parallel $(nproc)
      - name: Fuzz smoke 60s mỗi harness
        run: |
          # PR chạy smoke ngắn để bắt hồi quy rõ ràng; chiến dịch fuzz dài chạy
          # nightly. Corpus seed lấy từ sample thật để bắt đầu từ input hợp lệ.
          mkdir -p /tmp/cp /tmp/cl
          cp apps/core/application/st/samples/*.st /tmp/cp/ || true
          cp apps/core/application/st/samples/*.mkir /tmp/cl/ || true
          ./build/fuzz/core/fuzz_st_parser /tmp/cp -max_total_time=60 -rss_limit_mb=2048
          ./build/fuzz/core/fuzz_st_loader /tmp/cl -max_total_time=60 -rss_limit_mb=2048
