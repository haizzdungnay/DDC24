# Build & Test Workflow — MK-DDC-24
#
# Compiles and tests the 4 main components of the DDC-24 controller:
#   1. C++ SOM Services (mkddc-core, mkddc-iobus) and runs GoogleTest
#   2. Go Web Backend (web/backend)
#   3. React Web Frontend (src/frontend)
#   4. STM32 MCU Firmware (fw)
#
# References:
#   - docs/03_implementation/10_TASK_CHECKLIST.md (SKEL-004, ACT-022)

name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  som-services:
    name: C++ SOM Services (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            bacnet: OFF
            modbus: OFF
            extra_packages: ""
          - name: modbus
            bacnet: OFF
            modbus: ON
            extra_packages: libmodbus-dev
          - name: bacnet
            bacnet: ON
            modbus: OFF
            extra_packages: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libgtest-dev \
            libgmock-dev \
            ninja-build \
            ${{ matrix.extra_packages }}

      - name: Configure (CMake)
        run: |
          cmake -S services -B build/services \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" \
            -DMKDDC_ENABLE_BACNET=${{ matrix.bacnet }} \
            -DMKDDC_ENABLE_MODBUS=${{ matrix.modbus }} \
            -G Ninja

      - name: Build
        run: cmake --build build/services --parallel

      - name: Cleanup stale shared memory
        run: rm -f /dev/shm/mkddc_io_shm /dev/shm/mkddc_plc_shm

      - name: Run tests
        run: ctest --test-dir build/services --output-on-failure --parallel 4

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: build/services/Testing/
          retention-days: 7

  web-backend:
    name: Go Web Backend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Build Go backend
        run: |
          cd web/backend
          go build -v ./...

  web-frontend:
    name: React Web Frontend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Build React frontend
        run: |
          cd src/frontend
          npm run build

  mcu-firmware:
    name: MCU Firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arm-none-eabi-gcc & newlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build Firmware
        run: |
          cd fw
          make
