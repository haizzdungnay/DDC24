  /me/preferences:
    get:
      summary: Đọc tuỳ chọn giao diện của chính người dùng (viewer+)
      description: >
        Thân bài là một object JSON tuỳ ý do FE định nghĩa; BE lưu nguyên văn
        theo từng username và KHÔNG diễn giải nội dung.
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    put:
      summary: Ghi tuỳ chọn giao diện của chính người dùng (viewer+)
      x-rbac: [viewer, operator, engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "204": { description: Đã lưu }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /history:
    get:
      summary: Unified historian query by point and explicit UTC range (viewer+)
      description: >
        Backend merges RAM tail, 48-hour hot SQLite and archive tiers. Bounds are half-open
        [from,to); frontend never merges tiers. Trends presets explicitly request the bounded
        24-hour RAM presentation cache, while Custom explicitly requests SQLite/archive database
        history. Omitting source preserves the unified compatibility query. Point IDs are canonical only.
      x-rbac: [viewer, operator, engineer, admin]
      parameters:
        - name: point
          in: query
          required: true
          description: One to eight comma-separated canonical point IDs.
          schema:
            type: string
            example: "UI-01,AO-01,DO-01,VP2"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time, example: "2026-07-14T00:00:00Z" }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time, example: "2026-07-15T00:00:00Z" }
        - name: resolution
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/HistorianInterval"
        - name: maxPoints
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 5000, default: 5000 }
        - name: source
          in: query
          required: false
          description: "`cache` is limited to 24 hours; `database` excludes RAM/cache tiers."
          schema: { type: string, enum: [cache, database] }
      responses:
        "200":
          description: Complete or partial merged history. Partial results set complete=false and include gaps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /history/export.csv:
    get:
      summary: Stream CSV from the same merged historian iterator (viewer+)
      x-rbac: [viewer, operator, engineer, admin]
      parameters:
        - { name: point, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: resolution, in: query, required: false, schema: { $ref: "#/components/schemas/HistorianInterval" } }
        - { name: maxPoints, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5000, default: 5000 } }
        - { name: source, in: query, required: false, schema: { type: string, enum: [cache, database] } }
      responses:
        "200":
          description: >
            Streamed merged history CSV. Comment header rows begin with `#` and carry
            from/to/complete/tiersUsed; gap rows use `# gap,...`. Data columns are
            pointId,generation,time,value,min,max,sum,count,quality,source,tier and use
            RFC 4180 escaping. Data, metadata and gaps come from the same iterator as JSON.
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /trends/config:
    get:
      summary: Read per-point historian policy, state, capacity and server time (viewer+)
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistorianConfig" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      summary: Atomically update per-point database historian policies (admin)
      description: >
        Validates the whole batch including base revision, point generation, namespace,
        interval, selected retentionDays (1..the interval maximum), future start, capacity and
        free-space. Failure leaves the prior revision active. Invalid retention returns the
        structured `historian_retention_invalid` error code.
      x-rbac: [engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HistorianConfigUpdate" }
      responses:
        "200":
          description: Updated policy snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistorianConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
  /schedules:
    get:
      summary: List Schedule Objects (viewer+)
      description: >
        Scheduler Engine v3.1 (ADR-023). Each item is a Schedule Object holding weekly schedule,
        exception schedule, schedule default, effective period and target list. The `runtime` block
        is read-only controller truth and is never accepted on write.
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 64
                items: { $ref: "#/components/schemas/ScheduleObject" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a Schedule Object (admin)
      description: Created in `DRAFT`. `revision` starts at 1. Does not reach the controller until published.
      x-rbac: [engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleObject" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleObject" }
        "400": { $ref: "#/components/responses/ScheduleValidationError" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      summary: Read one Schedule Object (viewer+)
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleObject" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Update a Schedule Object (admin)
      description: >
        Optimistic locking on `revision`. A stale `revision` is rejected with `SCH-VERSION-001`
        instead of silently overwriting a newer edit. Changing `priority_for_writing` additionally
        requires the `schedule.priority` permission.
      x-rbac: [engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleObject" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleObject" }
        "400": { $ref: "#/components/responses/ScheduleValidationError" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a Schedule Object (admin + schedule.delete)
      description: >
        Spec §9.3 order is mandatory: relinquish every target, confirm no command is still held at
        the schedule priority, store the final revision in the audit log, and only then remove the
        object. Requires the `schedule.delete` permission.
      x-rbac: [engineer, admin]
      x-permission: schedule.delete
      responses:
        "204": { description: Deleted and the controller reloaded. }
        "202":
          description: >
            Removed from the stored configuration, but the controller has not reloaded yet, so the
            old schedule is still running. 204 would claim completion that has not happened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [PENDING_CONTROLLER] }
                  scheduleId: { type: string }
                  message: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /schedules/{id}/validate:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      summary: Validate configuration (admin)
      description: >
        Returns every finding with a spec §11 error code and a JSON path, so the UI can jump
        straight to the offending field. On success the status moves `DRAFT` to `VALIDATED`.
      x-rbac: [engineer, admin]
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleValidationResult" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /schedules/{id}/simulate:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      summary: Simulate the schedule (viewer+)
      description: >
        Runs the CONTROLLER evaluation engine, not a reimplementation. Reimplementing the algorithm
        in the backend would be correct only until the two copies drift, and nobody would notice
        the day they did.
      x-rbac: [viewer, operator, engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleSimulateRequest" }
      responses:
        "200":
          description: Simulation timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleSimulateResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /schedules/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      summary: Publish to the controller (admin + schedule.publish)
      description: >
        Only a valid schedule may be published. The backend waits for an ACK/NACK with a timeout and
        a bounded retry, and the controller applies at most once per `(schedule_id, revision)`.
        A failed publish leaves the running revision untouched (spec §13.2).
        MQTT is out of scope for Rev A (ADR-023 QD-2); the same semantics run over the internal
        transport, so this contract does not change when MQTT is added.
      x-rbac: [engineer, admin]
      x-permission: schedule.publish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchedulePublishRequest" }
      responses:
        "200":
          description: Controller ACK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulePublishResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "504":
          description: ACK timeout; the running revision is unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulePublishResult" }
  /schedules/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      summary: Enable the schedule (operator+)
      x-rbac: [operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleObject" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /schedules/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      summary: Disable the schedule (operator+)
      description: >
        Disabling is not merely "stop evaluating". Spec §9.2 requires the runtime to relinquish at
        the priority in use and to NOT hold the last commanded value. The response reports the
        relinquish outcome per target.
      x-rbac: [operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleObject" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /schedules/{id}/revisions:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      summary: List revisions (viewer+)
      description: At least the 10 most recent revisions are retained (spec §13.3).
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduleRevision" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /schedules/{id}/rollback:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      summary: Roll back to an earlier revision (admin + schedule.rollback)
      description: >
        A rollback creates a NEW revision; it never rewrites history. A reason is mandatory and is
        recorded in the audit log.
      x-rbac: [engineer, admin]
      x-permission: schedule.rollback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleRollbackRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleObject" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /schedules/{id}/runtime:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      summary: Read runtime state (viewer+)
      description: >
        Controller truth only. Any field the controller has not reported is `null`, and the UI must
        render it as an em dash rather than substituting `0` or `OK`.
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleRuntimeState" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /schedules/{id}/audit:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      summary: Read the audit trail (viewer+)
      description: Append-only. No role may edit or delete audit entries (spec §20).
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduleAuditEntry" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /schedules/effective:
    get:
      summary: Giá trị lịch có hiệu lực theo thời gian cho một điểm (viewer+)
      description: >
        `scheduleId` rỗng trong một đoạn nghĩa là KHÔNG lịch nào ghi vào đoạn đó
        — đây là câu trả lời hợp lệ và phải phân biệt được với "chưa tính được".
      x-rbac: [viewer, operator, engineer, admin]
      parameters:
        - { name: pointId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEffective" }
        "400": { $ref: "#/components/responses/Error" }
  /alarm-settings:
    get:
      summary: Read alarm entity settings (viewer+)
      description: >
        Returns `alarm_settings.conf` as the ADR-013 entity-list model. Legacy per-point rows are
        migrated by the Phase 2 backend before being returned.
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 64
                items: { $ref: "#/components/schemas/AlarmSetting" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace alarm entity settings (admin)
      description: >
        Persist `alarm_settings.conf` using ADR-013 entity-list schema. Current web/backend stores
        the file; Phase 2/3 core work must add `alarm_settings.conf` boot/SIGHUP loading and
        per-source evaluation before this contract becomes runtime-active. At most 64 internal
        alarm entities are accepted, and at most 8 enabled entities may set `publishBacnet=true`
        because BACnet Event Enrollment capacity is 8.
      x-rbac: [engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 64
              items: { $ref: "#/components/schemas/AlarmSetting" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  # SRC-F-02 (2026-08-09): bảy path dưới đây — /ota/*, /logs/download,
  # /bacnet/objects, /graph/* — KHÔNG có handler nào trong apps/web-api. Đối
  # chiếu bảng route ở apps/web-api/internal/app/http.go. Spec này tự nhận là
  # "nguồn-chuẩn cho endpoint (D-4)", nên khai báo endpoint không tồn tại sẽ
  # sinh client gọi vào hư không và làm mọi phép đếm độ phủ API sai. Giữ lại
  # phần khai báo vì đây là phạm vi roadmap đã chốt, nhưng đánh dấu tường minh
  # bằng `x-implementation-status` để người và tool đều phân biệt được
  # "đã có" với "sẽ có".
  /alarm-settings/simulate:
    post:
      summary: Mô phỏng luật cảnh báo trên chuỗi mẫu cho trước (viewer+)
      description: >
        `T57-2.13` (`ADR-048`). Là VỎ gọi `mkddc-alarm-sim`; không chạm cấu hình
        đang lưu nên `viewer` là đủ. `engine` cho biết bản engine đã chạy.
      x-rbac: [viewer, operator, engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmSimulateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmSimulateResult" }
        "400": { $ref: "#/components/responses/Error" }
  /alarm-settings/estimate:
    post:
      summary: Ước lượng tần suất cảnh báo từ lịch sử thật của điểm (viewer+)
      description: >
        `T57-3.13`. Cùng engine với `/alarm-settings/simulate` nhưng lấy mẫu từ
        historian. `downsampled=true` nghĩa là chuỗi đã bị thưa hoá; khi đó
        `underestimateBelowS` cho biết ngưỡng thời lượng mà kết quả ĐẾM THIẾU.
      x-rbac: [viewer, operator, engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmEstimateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmEstimateResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /alarms:
    get:
      summary: Runtime alarm list
      description: >
        Runtime alarm rows derived from ADR-013 alarm entities and ADR-014 ack lifecycle.
        This is the visible current list, not full history: active unacked alarms,
        active acked alarms, cleared-but-unacknowledged latched alarms, and future shelved alarms.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmEvent" }
  /alarms/{id}/ack:
    post:
      summary: Acknowledge alarm
      description: >
        Acknowledge one alarm entity id. If the alarm is active, status becomes acked until
        clear. If the condition already cleared but is latched unack, ack removes it from
        the visible list. Optional duration payload makes ack expire later; no body keeps
        the legacy permanent ack behavior. Unknown or already-normal ids return 404.
