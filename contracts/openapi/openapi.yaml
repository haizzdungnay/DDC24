  /users/access:
    get:
      summary: Bảng truy cập người dùng và phiên đang mở (admin)
      description: >
        `lastLoginAt` là `null` khi KHÔNG tìm thấy vết trong kho Activity — có
        thể vì chưa từng đăng nhập, cũng có thể vì vết đã bị đẩy khỏi vòng nhớ.
