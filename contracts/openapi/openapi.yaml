openapi: 3.1.0
info:
  title: MK-DDC-24 REST API
  version: "1.33.0"
  description: >
    REST API HTTPS (TLS 1.3) cho MK-DDC-24. Cá»•ng 8443. Auth Bearer JWT (exp 1h).
    Nguá»“n-chuáº©n cho endpoint (D-4). Trace: SW-API-001..010, SRS Â§6.4.
    BE-B0 2026-06-17: bá»• sung commissioning test, graph validate/deploy; WebSocket
    monitor chuáº©n á»Ÿ /api/v1/ws/monitor Ä‘Æ°á»£c tham chiáº¿u báº±ng x-websocket.
    BE-B5 2026-06-18: Má»Ÿ contract chi tiáº¿t cho cáº¥u hÃ¬nh (/system/config/*) vÃ  users CRUD, password self-service.
    2026-06-18: thÃªm aggregate /network cho trang Network.
    2026-07-15: thÃªm per-point historian policy/start scheduling, unified UTC history query vÃ  global display-name uniqueness.
    2026-07-22: thÃªm explicit historian source routing cho Trends cache 24h vÃ  Custom database.
    2026-07-20: thÃªm retentionDays theo interval, maxRetentionDays vÃ  retentionMaxDaysByInterval cho historian policy.
    2026-07-24: thêm Web adapter authoritative cho giao dịch Ethernet validate/stage/apply/confirm/rollback.
    2026-07-25: legacy config endpoints no longer mutate Ethernet; candidate validation matches mkddc-netcfg.
    2026-07-25: protocol v1 reports administrative/carrier health separately and exposes the saved NetworkManager profile.
    2026-07-28: khóa strict netcfg v1 với DNS transaction, capability discovery, management
    hostname read-only và tách GET status viewer+ khỏi POST Admin-only.
x-revision:
  date: "2026-08-27"
  note: "v1.30.0 (T59-819) mở rộng ADDITIVE change manifest bằng stHunks[]/fbdChanges[] tất định, có bounded payload + truncated + cursor; diff không đi vào impactRef nên mọi acknowledgement Commission đã cấp vẫn còn hiệu lực."
servers:
  - url: https://{device_ip}:8443/api/v1
    variables:
      device_ip:
        default: 192.168.1.50
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: ÄÄƒng nháº­p, tráº£ JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [admin, operator, viewer] }
                  expires_in: { type: integer, example: 3600 }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: ÄÄƒng xuáº¥t, vÃ´ hiá»‡u token
      responses: { "200": { description: OK } }
  /overview:
    get:
      summary: Read model duy nhat cua Landing PA3 (role viewer)
      description: >
        PA3-D02. Mot snapshot tong hop tu cac authority dang co, thay cho viec
        frontend tu ghep /system/status + /points + /alarms.
        `schemaVersion` la hop dong: client thay version la phai FAIL CLOSED,
        khong duoc doan field con thieu roi ve mot Landing trong binh thuong.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Error" }
  /activity:
    get:
      summary: Nhat ky hoat dong da chuan hoa (role viewer)
      description: >
        PA3-D03. Kho ben vung co retention theo dung luong; moi vet audit deu di
        qua sanitize nen khong chua password/token. Sap xep moi nhat truoc.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: Con tro phan trang — chi tra su kien co id NHO HON gia tri nay.
          schema: { type: integer, minimum: 1 }
        - name: kind
          in: query
          schema: { type: string, enum: [user, system] }
        - name: action
          in: query
          description: Loc theo chuoi con cua ten hanh dong, vi du point_override.
          schema: { type: string }
        - name: objectId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /points:
    get:
      summary: Danh sÃ¡ch táº¥t cáº£ I/O point + giÃ¡ trá»‹
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Point" }
  /points/{id}:
    get:
      summary: Äá»c 1 point
      parameters: [ { $ref: "#/components/parameters/PointId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Point" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Ghi giÃ¡ trá»‹ point (role operator+; LUÃ”N vÃ o má»©c Local manual â€” client KHÃ”NG chá»n priority)
      description: >
        Contract Freeze 2026-06-11: REST khÃ´ng expose BACnet priority 1..16.
        Má»i lá»‡nh web Ä‘i vÃ o nguá»“n "Local manual" (má»©c 2 trong 6 má»©c cá»§a core â€”
        PRODUCT_DEFINITION Â§13). BACnet client dÃ¹ng priority array riÃªng qua BACnet/IP
        (káº¿t quáº£ vÃ o má»©c 3). Gá»­i release=true Ä‘á»ƒ nháº£ manual (relinquish má»©c 2).
      parameters: [ { $ref: "#/components/parameters/PointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  allOf:
                    - $ref: "#/components/schemas/PointCommandValue"
                  description: "Báº¯t buá»™c trá»« khi release=true"
                release: { type: boolean, default: false, description: "true = nháº£ manual override" }
                ttlS:
                  type: integer
                  minimum: 1
                  maximum: 86400
                  description: >
                    PA3-107. Thoi han override tinh bang giay, do CORE cuong che
                    (scan_loop giu manual_ao_expiry_ns_/manual_do_expiry_ns_ va tu
                    release khi het han). Khong duoc dat kem release=true. Bo trong
                    nghia la ep khong thoi han, KHONG phai het han ngay.
                    Web-api va frontend KHONG duoc tu hen gio: mot timer trong tab
                    trinh duyet hay gan voi mot WebSocket se bien mat khi dong tab
                    hoac restart dich vu, va output o lai trang thai ep tay.
      responses:
        "200":
          description: Káº¿t quáº£ Ã¡p lá»‡nh tá»« core (ghi audit log)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Point"
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /points/{id}/config:
    put:
      summary: Update point tag/display metadata by canonical point ID (admin)
      description: >
        Phase A accepts canonical point IDs only; tags are never path aliases. Validates
        the final controller-local UI/AO/DO/VP tag namespace before atomic file replace.
      x-rbac: [engineer, admin]
      parameters: [ { $ref: "#/components/parameters/PointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PointConfigPatch" }
      responses:
        "200":
          description: Updated point metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Point" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /virtual-points:
    get:
      summary: List Virtual Points (viewer+)
      description: >
        Returns created backend-owned VP points only. Raw/uncreated AV/BV/MSV
        core slots are hidden from /points, Monitoring, Trends, and history.
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VirtualPoint" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create Virtual Point (admin)
      description: Missing id is allocated as the first free VP1..VP464.
      x-rbac: [engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VirtualPoint" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VirtualPoint" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /virtual-points/{id}:
    put:
      summary: Update Virtual Point (admin)
      x-rbac: [engineer, admin]
      parameters: [ { $ref: "#/components/parameters/VirtualPointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VirtualPoint" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VirtualPoint" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete Virtual Point (admin)
      x-rbac: [engineer, admin]
      parameters: [ { $ref: "#/components/parameters/VirtualPointId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /virtual-points/{id}/usage:
    get:
      summary: Nơi một Virtual Point đang được tham chiếu (viewer+)
      description: >
        `incomplete=true` nghĩa là có nguồn không quét được; danh sách khi đó là
        CHƯA ĐỦ và không được dùng để kết luận "không ai dùng điểm này".
      x-rbac: [viewer, operator, engineer, admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VirtualPointUsage" }
        "404": { $ref: "#/components/responses/Error" }
  /health:
    get:
      summary: Health baseline công khai cho installer/systemd
      security: []
      responses:
        "200":
          description: Luôn trả snapshot health; status=degraded khi một check lỗi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEndpoint" }
  /modbus/devices:
    get:
      summary: Danh sách Modbus RTU Device (viewer+)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ModbusRTUDevice" } } } }
    post:
      summary: Tạo Modbus RTU Device và apply có rollback (admin)
      x-rbac: [engineer, admin]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModbusRTUDevice" } } }
      responses:
        "200": { description: Đã persist và restart iobus, content: { application/json: { schema: { $ref: "#/components/schemas/ModbusMutationResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /modbus/devices/{id}:
    put:
      summary: Cập nhật Device; device_id không được đổi (admin)
      x-rbac: [engineer, admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModbusRTUDevice" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModbusMutationResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Xoá Device không còn Point tham chiếu (admin)
      x-rbac: [engineer, admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModbusMutationResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /modbus/points:
    get:
      summary: Danh sách cấu hình Modbus RTU Point (viewer+)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ModbusRTUPoint" } } } }
    post:
      summary: Tạo Modbus RTU Point với Point ID ổn định và tag unique (admin)
      x-rbac: [engineer, admin]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModbusRTUPoint" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModbusMutationResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /modbus/points/{id}:
    put:
      summary: Cập nhật Point; point_id không đổi khi rename (admin)
      x-rbac: [engineer, admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModbusRTUPoint" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModbusMutationResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Xoá Modbus RTU Point (admin)
      x-rbac: [engineer, admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModbusMutationResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /modbus/diagnostics:
    get:
      summary: Diagnostics poll/timeout/retry/CRC per slave (viewer+)
      responses:
        "200":
          description: Telemetry thật do iobus publish qua SHM.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ModbusRTUDiagnostics" } } } }
        "503": { $ref: "#/components/responses/Error" }
  /modbus/ports:
    get:
      summary: Cổng RS-485 board thật sự có (viewer+) — MBR-B211
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ModbusPortCapability" } } } } }
  /modbus/buses:
    get:
      summary: Trạng thái và số đo thật của từng bus RS-485 (viewer+)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ModbusBusRuntime" } } } } }
  /modbus/buses/{bus_id}:
    put:
      summary: Cấu hình MỘT cổng RS-485 và áp riêng cho cổng đó (admin)
      description: >
        MBR-B213 — `OD-MBRTU-002` (CLOSED) đặt tham số serial ở Bus và cho Device
        kế thừa read-only, nhưng cho tới 2026-08-06 không có endpoint nào sửa
        được Bus: chỉ có `GET /modbus/buses`. Giao diện vì thế vẫn bắt người dùng
        nhập baud/parity/stop ở từng Thiết bị rồi từ chối sau khi lưu, mà không
        có chỗ nào sửa cho đúng.


        Body chỉ nhận các trường người dùng thật sự được quyết định. `bus_id`,
        `port`, `data_bits` và `direction` KHÔNG nhận từ client: chúng là sự thật
        phần cứng. Cho sửa `port` tự do nghĩa là cho phép trỏ hai bus vào cùng
        một device node — cấu hình nhìn hợp lệ mà chạy sai dây.


        Trường vắng mặt giữ nguyên giá trị cũ (dùng con trỏ để phân biệt "không
        gửi" với "gửi 0"). Áp dụng là **atomic toàn cấu hình** như mọi thay đổi
        Modbus khác; đổi tham số của một cổng sẽ đồng bộ xuống mọi Device trên
        cổng đó.
      parameters:
        - name: bus_id
          in: path
          required: true
          schema: { type: string, enum: [rs485-1, rs485-2] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModbusBusConfigInput" }
      responses:
        "200":
          description: Đã áp cấu hình cho cổng
          content:
            application/json:
              schema:
                type: object
                properties:
                  bus: { $ref: "#/components/schemas/ModbusBus" }
                  apply: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { description: Xung đột revision hoặc iobus từ chối áp }
  /modbus/overview:
    get:
      summary: Tổng quan thiết bị Modbus RTU (viewer+)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModbusOverview" } } } }
  /modbus/events:
    get:
      summary: Sự kiện chuyển trạng thái liên lạc đã QUAN SÁT được (viewer+)
      description: >
        Danh sách rỗng khi chưa quan sát được lần đổi trạng thái nào. Không có
        dữ liệu mẫu: bản trước trả về hai sự kiện viết cứng kể cả khi không có
        thiết bị nào được đấu.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp: { type: string, format: date-time }
                    bus_id: { type: string }
                    device_id: { type: string }
                    message: { type: string }
                    level: { type: string, enum: [info, warning] }
  /modbus/frames:
    get:
      summary: Vòng nhớ khung Modbus RTU gần nhất (viewer+)
      description: >
        `T57-3.9` (`ADR-046` bản sửa 2026-08-19). Đây là BẢN GHI GIAO DỊCH, không
        phải byte thô: `rawBytes=false` luôn đúng ở Rev A. `volatile=true` nhắc
        rằng vòng nhớ nằm trong tiến trình iobus và mất khi restart. Mảng rỗng
        nghĩa là "chưa có khung", khác hẳn với lỗi đọc — lỗi đọc trả 5xx.
      x-rbac: [viewer, operator, engineer, admin]
      parameters:
        - { name: bus, in: query, schema: { type: integer }, description: "Bus 1..N; mặc định 1" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModbusFrames" }
        "503": { $ref: "#/components/responses/Error" }
  /modbus/mapping:
    get:
      summary: Bảng ánh xạ Point → register kèm lỗi validate (viewer+)
      responses:
        "200": { description: OK }
  /modbus/templates:
    get:
      summary: Mẫu thiết bị Modbus RTU dựng sẵn (viewer+)
      description: >
        Chỉ đọc. `origin` phân biệt mẫu đóng gói theo firmware với mẫu do người
        dùng nạp thêm; `source` là đường dẫn hồ sơ gốc để truy nguyên.
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/ModbusTemplate" }
  /modbus/config/state:
    get:
      summary: Trạng thái vòng đời cấu hình (viewer+)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModbusConfigState" } } } }
  /modbus/config/candidate:
    get:
      summary: Bản nháp cấu hình đang soạn (viewer+)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModbusCandidate" } } } }
    put:
      summary: Lưu bản nháp — KHÔNG chạm tới thiết bị (admin)
      x-rbac: [engineer, admin]
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: "MBR-B205 — revision cấu hình đang chạy mà client tin là đúng. Lệch ⇒ 412."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base_revision: { type: integer, format: int64 }
                buses: { type: array, items: { $ref: "#/components/schemas/ModbusBus" } }
                devices: { type: array, items: { $ref: "#/components/schemas/ModbusRTUDevice" } }
                points: { type: array, items: { $ref: "#/components/schemas/ModbusRTUPoint" } }
                operation_id: { type: string }
      responses:
        "200": { description: Đã lưu nháp }
        "400": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
    delete:
      summary: Bỏ bản nháp (admin)
      x-rbac: [engineer, admin]
      responses:
        "200": { description: OK }
  /modbus/config/diff:
    get:
      summary: Khác biệt giữa cấu hình đang chạy và bản nháp (viewer+)
      responses:
        "200": { description: OK }
  /modbus/config/apply:
    post:
      summary: Áp bản nháp qua transaction stage→journal→ACK→commit (admin)
      x-rbac: [engineer, admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                base_revision: { type: integer, format: int64 }
                operation_id:
                  type: string
