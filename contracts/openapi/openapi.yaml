      description: >
        Validate graph.json, gá»­i core build plan vÃ  Ã¡p dá»¥ng atomically náº¿u pass. Náº¿u validate/build fail,
        giá»¯ graph cÅ© vÃ  tráº£ pass=false/deployed=false kÃ¨m errors.
      x-rbac: [admin]
