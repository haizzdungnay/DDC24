          # tên nhưng Project chưa từng ghi intent. Đặt 32 ở đây sẽ khai hẹp hơn
          # thứ backend có thể trả.
          maxItems: 64
          items: { $ref: "#/components/schemas/ProgrammingProgramListItem" }
