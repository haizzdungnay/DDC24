        until core restart. Used by the Alarm log Off action.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmActionRequest" }
      responses:
        "200":
          description: Current visible alarm list after suppress.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
