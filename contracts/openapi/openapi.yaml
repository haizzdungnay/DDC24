        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgrammingSimulationActionRequest" }
      responses:
        "200":
          description: Phiên sau đúng một lần chuyển trạng thái
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgrammingSimulationSession" }
        "400": { $ref: "#/components/responses/ProgrammingError" }
        "401": { $ref: "#/components/responses/ProgrammingError" }
        "403": { $ref: "#/components/responses/ProgrammingError" }
        "404": { $ref: "#/components/responses/ProgrammingError" }
        "409": { $ref: "#/components/responses/ProgrammingError" }
        "410": { $ref: "#/components/responses/ProgrammingError" }
        "412": { $ref: "#/components/responses/ProgrammingError" }
        "428": { $ref: "#/components/responses/ProgrammingError" }
        "429": { $ref: "#/components/responses/ProgrammingError" }
        "503": { $ref: "#/components/responses/ProgrammingUnavailable" }
  /programming/simulation/sessions/{sessionId}/inputs/{observationId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: observationId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    put:
      operationId: setProgrammingSimulationInput
      summary: Ghi một virtual input trong allowlist của manifest
