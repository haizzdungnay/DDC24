        outputs:
          type: array
          items: { $ref: "#/components/schemas/GraphPortRef" }
        params: { type: object, additionalProperties: true }
        config: { type: object, additionalProperties: true }
        limit:
          type: object
          additionalProperties: true
          properties:
            min: { type: number }
            max: { type: number }
            limit_lo: { type: number }
            limit_hi: { type: number }
        fallback: {}
        safeState: {}
        safe_state: {}
        power_on: { type: object, additionalProperties: true }
    GraphLink:
      type: object
      required: [from, to]
      properties:
        from: { type: string, example: "pid1.out" }
        to: { type: string, example: "ao1.in" }
    GraphIoPoint:
      type: object
      required: [node]
      additionalProperties: true
      properties:
        node: { type: string }
        channel: { type: integer }
        sensor: { type: string }
        unit: { type: string }
        mode: { type: string }
        limit_lo: { type: number }
        limit_hi: { type: number }
        fallback: {}
        safeState: {}
        safe_state: {}
    GraphModbusPoint:
      type: object
      required: [node]
      additionalProperties: true
      properties:
        node: { type: string }
        fc: { type: integer }
        addr: { type: integer }
        type: { type: string }
        scale: { type: number }
        fallback: {}
        safeState: {}
        safe_state: {}
    GraphModbusDevice:
      type: object
      additionalProperties: true
      properties:
        bus: { type: integer }
        baud: { type: integer }
        slave: { type: integer }
        host: { type: string }
        unit: { type: integer }
        poll_ms: { type: integer }
        points:
          type: array
          items: { $ref: "#/components/schemas/GraphModbusPoint" }
    Graph:
      type: object
      required: [schema_version, device, io_map, nodes, links]
      properties:
        schema_version: { type: string, example: "1.0" }
        device:
          type: object
          required: [bacnet_device_id, name, scan_ms]
          properties:
            bacnet_device_id:
              oneOf:
                - type: integer
                - type: string
            name: { type: string }
            scan_ms: { type: integer, minimum: 500 }
        io_map:
          type: object
          properties:
            ai:
              type: array
              items: { $ref: "#/components/schemas/GraphIoPoint" }
            ao:
              type: array
              items: { $ref: "#/components/schemas/GraphIoPoint" }
            di:
              type: array
              items: { $ref: "#/components/schemas/GraphIoPoint" }
            do:
              type: array
              items: { $ref: "#/components/schemas/GraphIoPoint" }
        modbus:
          type: object
          properties:
            rtu:
              type: array
              items: { $ref: "#/components/schemas/GraphModbusDevice" }
            tcp:
              type: array
              items: { $ref: "#/components/schemas/GraphModbusDevice" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/GraphNode" }
        links:
          type: array
          items: { $ref: "#/components/schemas/GraphLink" }
        meta: { type: object, additionalProperties: true }
    SystemConfig:
      type: object
      properties:
        device: { $ref: "#/components/schemas/ConfigDevice" }
        network: { $ref: "#/components/schemas/ConfigNetwork" }
        io: { $ref: "#/components/schemas/ConfigIO" }
        safe_state: { $ref: "#/components/schemas/ConfigSafeState" }
        virtual_points: { $ref: "#/components/schemas/ConfigVirtualPoints" }
        bacnet: { $ref: "#/components/schemas/ConfigBacnet" }
        fieldbus: { $ref: "#/components/schemas/ConfigFieldbus" }
        time: { $ref: "#/components/schemas/ConfigTime" }
    NetworkPageData:
      type: object
      required: [northbound, southbound]
      properties:
        northbound: { $ref: "#/components/schemas/NetworkPageConfig" }
        southbound:
          type: array
          items: { $ref: "#/components/schemas/NetworkSlave" }
    NetworkPageConfig:
      type: object
      required: [deviceName, ip, dhcp, wifiEnabled, subnet, gateway, bacnetDeviceId, bacnetDeviceName, bacnetPort, bmsLink]
      properties:
        deviceName: { type: string }
        ip: { type: string, format: ipv4, readOnly: true }
        dhcp: { type: boolean, readOnly: true }
        wifiEnabled: { type: boolean }
        subnet: { type: string, format: ipv4, readOnly: true }
        gateway: { type: string, format: ipv4, readOnly: true }
        bacnetDeviceId: { type: string }
        bacnetDeviceName: { type: string }
        bacnetPort: { type: integer, minimum: 1, maximum: 65535 }
        bmsLink: { type: string, enum: [online, offline], readOnly: true }
    NetworkSlave:
      type: object
      required: [address, name, profile, baudRate, pollState, errorRate, lastPollMs]
      properties:
        address: { type: integer, minimum: 1, maximum: 247 }
        name: { type: string }
        profile: { type: string }
        baudRate: { type: integer }
        pollState: { type: string, enum: [online, degraded, offline] }
        errorRate: { type: number }
        lastPollMs: { type: integer }
    NetcfgTransactionRequest:
      type: object
      additionalProperties: false
      properties:
        transactionId: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,64}$" }
        candidate: { $ref: "#/components/schemas/NetcfgCandidate" }
    NetcfgCandidate:
      type: object
      additionalProperties: false
      required: [interface, mode]
      properties:
        interface:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,15}$"
          not: { enum: [lo] }
        mode: { type: string, enum: [static, dhcp] }
        ipv4: { type: string, format: ipv4, maxLength: 15, description: "Required usable host address for static mode; forbidden for DHCP." }
        netmask: { type: string, format: ipv4, maxLength: 15, description: "Static mode requires a contiguous prefix length 1..30; forbidden for DHCP." }
        gateway: { type: string, format: ipv4, maxLength: 15, description: "Optional usable address in the candidate subnet for static mode; forbidden for DHCP." }
        dns:
          $ref: "#/components/schemas/NetcfgDns"
          description: Omitted to preserve the current profile DNS; included DNS is committed and rolled back with the same transaction.
      allOf:
        - if:
            properties: { mode: { const: static } }
            required: [mode]
          then:
            required: [ipv4, netmask]
        - if:
            properties: { mode: { const: dhcp } }
            required: [mode]
          then:
            not:
              anyOf:
                - required: [ipv4]
                - required: [netmask]
                - required: [gateway]
        - if:
            properties:
              dns:
                properties: { mode: { const: auto } }
                required: [mode]
            required: [dns]
          then:
            properties: { mode: { const: dhcp } }
    NetcfgDns:
      type: object
      additionalProperties: false
      required: [mode, servers]
      properties:
        mode: { type: string, enum: [auto, manual] }
        servers:
          type: array
          items: { type: string, format: ipv4 }
          uniqueItems: true
          maxItems: 4
      allOf:
        - if:
            properties: { mode: { const: auto } }
            required: [mode]
          then:
            properties: { servers: { maxItems: 0 } }
        - if:
            properties: { mode: { const: manual } }
            required: [mode]
          then:
            properties: { servers: { minItems: 1, maxItems: 4 } }
    NetcfgActive:
      type: object
      additionalProperties: false
      description: Current kernel-observed interface state; this is not the saved NetworkManager profile.
      required: [interface, link, adminUp, carrier, reasonCode, mode, ipv4, prefixLength, gateway, dnsServers]
      properties:
        interface: { type: string }
        link: { type: string, enum: [up, down, unknown] }
        adminUp: { type: boolean }
        carrier: { type: boolean }
        reasonCode: { type: string }
        mode: { type: string, enum: [static, dhcp, unknown] }
        ipv4: { type: string }
        prefixLength: { type: integer, minimum: 0, maximum: 32 }
        gateway: { type: string }
        dnsServers:
          type: array
          items: { type: string, format: ipv4 }
          uniqueItems: true
          maxItems: 4
    NetcfgResponse:
      type: object
      additionalProperties: false
      required: [version, requestId, result, reasonCode, state, capabilities, management]
      properties:
        version: { type: integer, enum: [1] }
        requestId: { type: string }
        result: { type: string, enum: [accepted, rejected] }
        reasonCode: { type: string }
        message: { type: string }
        transactionId: { type: string }
        state: { type: string, enum: [idle, staged, applying, awaiting_confirmation, confirmed, rolling_back, rolled_back, failed] }
        rollbackRemainingS: { type: integer, minimum: 0, maximum: 120 }
        active:
          $ref: "#/components/schemas/NetcfgActive"
          description: Current kernel-observed state and interface health.
        configured:
          $ref: "#/components/schemas/NetcfgCandidate"
          description: Saved NetworkManager connection profile; omitted when no readable profile exists.
        pending:
          $ref: "#/components/schemas/NetcfgCandidate"
          description: Candidate held by an active transaction; omitted when no transaction candidate exists.
        capabilities:
          type: array
          description: Exact protocol-v1 capability allowlist; clients must preflight before optional mutation.
          prefixItems:
            - { const: dns }
            - { const: management-hostname }
          minItems: 2
          maxItems: 2
        management: { $ref: "#/components/schemas/NetcfgManagement" }
    NetcfgManagement:
      type: object
      additionalProperties: false
      description: Read-only stable management origin; never accepted in a transaction candidate.
      required: [hostname, mdnsName, stable]
      properties:
        hostname: { type: string, readOnly: true }
        mdnsName: { type: string, readOnly: true }
        stable: { type: boolean, readOnly: true }
    ConfigDevice:
      type: object
      required: [device_id, device_name]
      properties:
        device_id: { type: integer }
        device_name: { type: string }
        description: { type: string }
        location: { type: string }
    ConfigNetwork:
      type: object
      properties:
        eth:
          type: object
          readOnly: true
          description: Compatibility shadow only; Ethernet mutation is owned by mkddc-netcfg transactions.
          additionalProperties: true
        wifi: { type: object, additionalProperties: true }
        hostname:
          type: string
          description: Compatibility service field only; does not mutate the OS management hostname or NetcfgManagement.
    ConfigPointMetadata:
      type: object
      required: [ch, tag]
      additionalProperties: true
      properties:
        ch: { type: integer, minimum: 1 }
        tag: { $ref: "#/components/schemas/PointTag" }
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Canonical display name/label. Backend trims/collapses whitespace, rejects control
            characters and compares Unicode-lower keys in a namespace independent from PointTag.
    ConfigIO:
      type: object
      description: >
        UI/AO/DO technical tags share one controller-local namespace with every VP.
        DO rows are authoring metadata only; safe values remain in ConfigSafeState.do.
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        checksum: { type: string, pattern: "^[0-9a-f]{64}$" }
        ui: { type: array, items: { $ref: "#/components/schemas/ConfigPointMetadata" } }
        ao: { type: array, items: { $ref: "#/components/schemas/ConfigPointMetadata" } }
        do: { type: array, items: { $ref: "#/components/schemas/ConfigPointMetadata" } }
    ConfigVirtualPoints:
      type: object
      description: >
        Virtual Point capacity tiers: logEnabled=false <=256; logIntervalMs=1000
        <=128; logIntervalMs=100 <=64; logIntervalMs=10 <=16 diagnostic
        ring/non-permanent channels. logIntervalMs is required when
        logEnabled=true; string/datetime VP cannot be logged.
      properties:
        items:
          type: array
          maxItems: 464
          items: { $ref: "#/components/schemas/VirtualPoint" }
    ConfigSafeState:
      type: object
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        checksum: { type: string, pattern: "^[0-9a-f]{64}$" }
        ao: { type: array, items: { type: object, additionalProperties: true } }
        do: { type: array, items: { type: object, additionalProperties: true } }
    ConfigIOBundle:
      type: object
      required: [io, safe_state]
      properties:
        base_revision: { type: integer, format: int64, minimum: 0 }
        revision: { type: integer, format: int64, readOnly: true }
        checksum: { type: string, readOnly: true }
        io: { $ref: "#/components/schemas/ConfigIO" }
        safe_state: { $ref: "#/components/schemas/ConfigSafeState" }
    ConfigBacnet:
      type: object
      properties:
        bip: { type: object, additionalProperties: true }
    ConfigFieldbus:
      type: object
      properties:
        rs485: { type: object, additionalProperties: true }
        poll_default_ms: { type: integer }
        slaves: { type: array, items: { type: object, additionalProperties: true } }
        revision: { type: integer, format: int64, minimum: 0 }
        checksum: { type: string, pattern: "^[0-9a-f]{64}$" }
        devices: { type: array, items: { $ref: "#/components/schemas/ModbusRTUDevice" } }
        points: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/ModbusRTUPoint" } }
    ModbusBus:
      type: object
      description: >
        MBR-B202 / OD-MBRTU-002 — một sợi dây RS-485. Tham số serial thuộc về
        DÂY, không thuộc thiết bị: hai thiết bị trên cùng dây không thể chạy hai
        baud khác nhau, nên để baud ở Device là mời người dùng lưu một cấu hình
        không thể thực thi.
      required: [bus_id, port, baud, parity, stop_bits, enabled]
      properties:
        bus_id: { type: string, pattern: "^rs485-[0-9]{1,3}$" }
        display_name: { type: string, maxLength: 32 }
        port:
          type: string
          description: >
            MBR-B211 — phải nằm trong capability manifest của board
            (GET /modbus/ports). Chuỗi tự do đã bị bỏ: bản trước nhận mọi đường
            dẫn ≤128 byte nên một cấu hình trỏ vào cổng không tồn tại lưu được,
            checksum hợp lệ, revision tăng, và chỉ hỏng ở tầng iobus (D-14).
          enum: ["/dev/rs485-1", "/dev/rs485-2"]
        baud: { type: integer, minimum: 1200, maximum: 115200 }
        parity: { type: string, enum: [N, E, O] }
        stop_bits: { type: integer, enum: [1, 2] }
        data_bits: { type: integer, enum: [8] }
        offline_probe_ms: { type: integer, minimum: 1000, maximum: 60000, default: 5000 }
        enabled: { type: boolean }
        direction:
          type: string
          enum: [auto, rts]
          default: auto
          description: >
            G-D — cơ chế đảo hướng half-duplex. `auto` (mặc định) hợp với
            transceiver tự đảo hướng: phần cứng Foxlinx SOM-DDC-24 chỉ có TX/RX,
            không có DE/RE. Chỉ đặt `rts` khi bo THẬT SỰ nối DE/RE vào RTS — bật
            nhầm trên bo auto-direction làm driver giữ RTS suốt lượt phát và có
            thể chặn đường truyền. Không có giao diện cấu hình; trường có mặt ở
            đây để cấu hình đi qua vòng đọc–ghi của BE mà không bị xoá mất.
        rts_delay_before_us:
          type: integer
          minimum: 0
          maximum: 100000
          description: "Chỉ có tác dụng khi direction=rts."
        rts_delay_after_us:
          type: integer
          minimum: 0
          maximum: 100000
          description: "Chỉ có tác dụng khi direction=rts."
    ModbusBusConfigInput:
      type: object
      description: >
        Thân của `PUT /modbus/buses/{bus_id}` — CHỈ những trường người dùng được
        quyết định. `bus_id`/`port`/`data_bits`/`direction` cố tình vắng mặt:
        chúng là sự thật phần cứng, không phải lựa chọn cấu hình. Trường không
        gửi thì giữ nguyên giá trị cũ.
      properties:
        display_name: { type: string, maxLength: 32 }
        baud: { type: integer, enum: [9600, 19200, 38400, 57600, 115200] }
        parity: { type: string, enum: [N, E, O] }
        stop_bits: { type: integer, enum: [1, 2] }
        offline_probe_ms: { type: integer, minimum: 1000, maximum: 60000 }
        enabled: { type: boolean }
    ModbusPortCapability:
      type: object
      required: [port]
      properties:
        port: { type: string }
        alias: { type: string, description: "Tên thiết bị thật, ví dụ ttyS5." }
        description: { type: string }
        max_baud: { type: integer }
    ModbusRTUDevice:
      type: object
      required: [device_id, display_name, enabled, rs485_port, baud, parity, stop_bits, slave_id, poll_ms, timeout_ms, retry]
      properties:
        device_id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,22}$" }
        display_name: { type: string, minLength: 1, maxLength: 64 }
        enabled: { type: boolean }
        bus_id:
          type: string
          description: "Bus mà thiết bị thuộc về. Tham số serial dưới đây KẾ THỪA read-only từ Bus."
        rs485_port: { type: string, minLength: 1, maxLength: 128, readOnly: true }
        baud: { type: integer, minimum: 1200, maximum: 115200 }
        parity: { type: string, enum: [N, E, O] }
        stop_bits: { type: integer, enum: [1, 2] }
        slave_id: { type: integer, minimum: 1, maximum: 247 }
        poll_ms: { type: integer, minimum: 10, maximum: 60000 }
        timeout_ms: { type: integer, minimum: 20, maximum: 10000 }
        retry:
          type: integer
          minimum: 0
          maximum: 5
          default: 1
          description: "Số lần phát lại (retry attempts) một giao dịch Modbus khi bị lỗi timeout hoặc CRC trước khi đánh dấu lượt poll thất bại."
        offline_after_errors:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
          description: "Số lượt poll thất bại liên tiếp trước khi chuyển trạng thái kết nối Device sang OFFLINE."
        offline_probe_ms:
          type: integer
          minimum: 1000
          maximum: 60000
          default: 5000
          description: "Chu kỳ phát gói tin thăm dò (probe) khi Device đang ở trạng thái OFFLINE."
    ModbusRTUPoint:
      type: object
      required: [point_id, device_id, tag_name, display_name, register_type, address, data_type, byte_order, word_order, scale, offset, unit, read_write, default_value, safe_value, enabled]
      properties:
        point_id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,22}$", description: "Ổn định khi đổi tag/display name." }
        device_id: { type: string }
        tag_name: { $ref: "#/components/schemas/PointTag" }
        display_name: { type: string, minLength: 1, maxLength: 64 }
        register_type: { type: string, enum: [coil, discrete_input, input_register, holding_register] }
        address: { type: integer, minimum: 0, maximum: 65535 }
        data_type: { type: string, enum: [bool, int16, uint16, int32, uint32, float32] }
        byte_order: { type: string, enum: [big, little] }
        word_order: { type: string, enum: [high_low, low_high] }
        scale: { type: number, not: { const: 0 } }
        offset: { type: number }
        unit: { type: string }
        read_write: { type: string, enum: [read, read_write] }
        default_value: { $ref: "#/components/schemas/PointCommandValue" }
        safe_value: { $ref: "#/components/schemas/PointCommandValue" }
        enabled: { type: boolean }
        bit_index:
          type: integer
          minimum: 0
          maximum: 15
          nullable: true
          description: "OD-MBRTU-003 — trích một bit trong register. Chỉ dùng với data_type=bool trên Holding/Input Register."
        min_value: { type: number, nullable: true, description: "Biên kỹ thuật; mẫu ngoài biên bị đánh BAD/OUT_OF_RANGE." }
        max_value: { type: number, nullable: true }
    ModbusQuality:
      type: string
      description: >
        DATA_MODEL §6.2 — năm mức. CONFIG_ERROR tách khỏi BAD vì người vận hành
        phải phân biệt "thiết bị trả dữ liệu sai" với "cấu hình sai nên chưa
        từng hỏi thiết bị". UNKNOWN xuất hiện khi producer mới hơn consumer —
        không được đoán về GOOD.
      enum: [GOOD, STALE, BAD, OFFLINE, CONFIG_ERROR, UNKNOWN]
    ModbusQualityReason:
      type: string
      description: "DATA_MODEL §6.3 — 10 mã lý do."
      enum: [NOT_INITIALIZED, CONFIG_ERROR, DECODE_ERROR, OUT_OF_RANGE, TIMEOUT, CRC_ERROR, PORT_DOWN, DEVICE_EXCEPTION, WRITE_FAILED, BUS_OVERLOAD, UNKNOWN]
    ModbusRTUDiagnostics:
      type: object
      required: [device_id, slave_id, online, total_polls, total_errors, timeout_errors, crc_errors, retry_attempts, consecutive_errors, last_seen_ms]
      properties:
        device_id: { type: string }
        slave_id: { type: integer }
        bus_id: { type: integer }
        online: { type: boolean }
        total_polls: { type: integer, format: int64, description: "MBR-B110 — uint64; uint32 tràn sau ~2,7 năm ở nhịp poll thực tế." }
        total_errors: { type: integer, format: int64 }
        timeout_errors: { type: integer, format: int64 }
        crc_errors: { type: integer, format: int64 }
        retry_attempts: { type: integer, format: int64, description: "Số lần PHÁT LẠI thật (D-06) — khác total_errors." }
        write_failed: { type: integer, format: int64 }
        write_dropped: { type: integer, format: int64, description: "Lệnh ghi bị bỏ HẲN: hết lượt thử, quá hạn, hoặc không encode được." }
        consecutive_errors: { type: integer }
        last_exception: { type: integer, minimum: 0, maximum: 11 }
        last_seen_ms: { type: integer, format: int64 }
    ModbusBusRuntime:
      type: object
      description: >
        MBR-B305 — số đo THẬT của một sợi dây, do BusWorker đếm. Trường latency
        và utilization là NULLABLE có chủ đích: null nghĩa là iobus chưa đo được,
        và FE phải hiện "—" thay vì 0. Bản trước điền hằng số viết cứng nên giao
        diện hiển thị số không do thiết bị nào sinh ra.
      required: [bus_id, port, open_state]
      properties:
        bus_id: { type: string }
        display_name: { type: string }
        port: { type: string }
        port_alias: { type: string }
        open_state:
          type: string
          enum: [UNKNOWN, CLOSED, OPENING, RUNNING, PORT_ERROR, DRAINING, SWAPPING, CONFIG_ERROR]
        baud: { type: integer }
        parity: { type: string }
        data_bits: { type: integer }
        stop_bits: { type: integer }
        total_devices: { type: integer }
        online_devices: { type: integer }
        poll_latency_p50_ms: { type: integer, nullable: true }
        poll_latency_p95_ms: { type: integer, nullable: true }
        bus_utilization_percent: { type: number, nullable: true }
        estimated_load_percent: { type: number, description: "Ước lượng từ cấu hình (MBR-B207), khác số đo thật ở trên." }
        timeout_errors:
          type: integer
          format: int64
          description: >
            Tổng timeout gộp từ số đo THEO SLAVE của dây này. Trước đây trường
            này bị gán `TotalErrors` của cả dây rồi cộng thêm timeout từng slave
            lên trên, nên một dây có nhiều nhất 100 lỗi báo ra 170 (REV-BE-10).
        crc_errors:
          type: integer
          format: int64
          description: Tổng lỗi CRC gộp từ số đo theo slave.
        total_errors:
          type: integer
          format: int64
          description: >
            Tổng lỗi của cả dây do BusWorker đếm, gồm cả lỗi mức cổng chưa quy
            được về slave nào. KHÔNG cộng con số này với `timeout_errors`/`crc_errors`.
        port_reopens: { type: integer, format: int64 }
    ModbusOverview:
      type: object
      required: [total_devices, online, offline, fault_config, telemetry_available]
      properties:
        total_devices: { type: integer }
        online: { type: integer }
        offline: { type: integer }
        initializing: { type: integer, description: "Chưa từng poll — KHÔNG phải offline." }
        fault_config: { type: integer }
        revision: { type: integer }
        checksum: { type: string }
        telemetry_available:
          type: boolean
          description: "false ⇒ iobus chưa publish lần nào; mọi con số runtime phải hiểu là KHÔNG BIẾT, không phải 0."
    ModbusConfigState:
      type: object
      required: [state, active_revision, diff]
      properties:
        state: { type: string, enum: [CLEAN, DIRTY, APPLYING, FAILED] }
        active_revision: { type: integer, format: int64 }
        active_checksum: { type: string }
        base_revision: { type: integer, format: int64 }
        checksum: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        last_error: { type: string }
        diff: { type: array, items: { $ref: "#/components/schemas/ModbusDiffEntry" } }
        running_on_iobus: { $ref: "#/components/schemas/ModbusRunningSnapshot" }
    ModbusRunningSnapshot:
      type: object
      required: [reachable]
      properties:
        generation: { type: integer, format: int64 }
        config_revision: { type: integer, format: int64 }
        ext_count: { type: integer }
        in_sync: { type: boolean }
        reachable:
          type: boolean
          description: "false ⇒ không liên lạc được iobus. UI phải hiện 'không rõ', không được hiện 'đã đồng bộ'."
    ModbusDiffEntry:
      type: object
      required: [kind, action, id]
      properties:
        kind: { type: string, enum: [bus, device, point] }
        action: { type: string, enum: [added, removed, modified] }
        id: { type: string }
        field: { type: string }
        before: { type: string }
        after: { type: string }
    ModbusCandidate:
      type: object
      properties:
        config: { type: object }
        base_revision: { type: integer, format: int64 }
        checksum: { type: string }
        state: { type: string, enum: [CLEAN, DIRTY, APPLYING, FAILED] }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    ModbusApplyResult:
      type: object
      required: [result, revision]
      properties:
        result: { type: string, enum: [success] }
        revision: { type: integer, format: int64 }
        checksum: { type: string }
        generation: { type: integer, format: int64 }
        reload_mode:
          type: string
          enum: [control, service_restart]
          description: >
            MBR-B212 — `control` là đường chính (áp tại ranh giới giữa hai
            transaction Modbus, KHÔNG gián đoạn IOP). `service_restart` là dự
            phòng cho iobus bản cũ và CÓ gián đoạn I/O; khi đó warnings nói rõ.
        idempotent: { type: boolean }
        warnings: { type: array, items: { type: string } }
    ModbusProbeResult:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [ok, fail] }
        value: { type: number }
        reason: { type: string }
        exception_code: { type: integer, minimum: 0, maximum: 11 }
        elapsed_us: { type: integer }
    ModbusMutationResult:
      type: object
      required: [apply]
      properties:
        device: { $ref: "#/components/schemas/ModbusRTUDevice" }
        point: { $ref: "#/components/schemas/ModbusRTUPoint" }
        apply: { $ref: "#/components/schemas/ConfigPutResult" }
    HealthEndpoint:
      type: object
      required: [status, checks, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        checks:
          type: object
          required: [web, core, iobus, io_shm, plc_shm, mcu_connection]
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, degraded, fault] }
              detail: { type: string }
    ConfigTime:
      type: object
      required: [timezone, ntp_enabled, ntp_servers, system_time, revision]
      properties:
        timezone: { type: string }
        ntp_enabled: { type: boolean }
        ntp_servers: { type: array, items: { type: string } }
        system_time: { type: string, format: date-time, description: "Cho phÃ©p set giá» thá»§ cÃ´ng" }
        revision: { type: integer, format: int64, minimum: 1 }
    ConfigTimeUpdate:
      type: object
      additionalProperties: false
      required: [timezone, ntp_enabled, ntp_servers, system_time, baseRevision, operationId]
      properties:
        timezone: { type: string, maxLength: 64 }
        ntp_enabled: { type: boolean }
        ntp_servers:
          type: array
          maxItems: 4
          items: { type: string, maxLength: 253 }
        system_time: { type: string, description: "One-shot RFC3339 instant with offset; empty when NTP is enabled" }
        baseRevision: { type: integer, format: int64, minimum: 1 }
        operationId: { type: string, minLength: 1, maxLength: 64 }
    TimeStatus:
      type: object
      required: [nowUtc, nowLocal, timezone, mode, synchronized, rtcPresent, health, warnings]
      properties:
        nowUtc: { type: string, format: date-time }
        nowLocal: { type: string, format: date-time }
        timezone: { type: string }
        mode: { type: string, enum: [ntp, manual] }
        synchronized: { type: boolean }
        source: { type: [string, "null"] }
        offsetMs: { type: [number, "null"] }
        lastSyncUtc: { type: [string, "null"], format: date-time }
        rtcPresent: { type: boolean }
        rtcUtc: { type: [string, "null"], format: date-time }
        health: { type: string, enum: [healthy, degraded, fault, unknown] }
        warnings: { type: array, items: { type: string } }
    HistorianInterval:
      type: string
      enum: [auto, 1s, 3s, 5s, 15s, 30s, 1m, 3m, 5m, 15m, 30m, 60m]
      description: >
        `auto` is query-only. Policy updates use the eleven explicit intervals. UI may label
        60m as 1h; config/wire canonical remains 60m.
    HistorianPolicyState:
      type: string
      enum: [off, scheduled, recording]
      description: Derived from dbLoggingEnabled, startAtUtc and serverNowUtc; never persisted separately.
    HistorianPolicy:
      type: object
      required:
        - pointId
        - generation
        - dbLoggingEnabled
        - dbInterval
        - retentionDays
        - maxRetentionDays
        - hotCacheEnabled
        - hotCacheHours
        - startAtUtc
        - state
        - health
      properties:
        pointId: { type: string, example: "VP2" }
        generation: { type: integer, minimum: 1 }
        dbLoggingEnabled: { type: boolean }
        dbInterval:
          allOf: [ { $ref: "#/components/schemas/HistorianInterval" } ]
          description: Explicit value only; auto is invalid for policy updates.
        retentionDays:
          type: integer
          minimum: 1
          description: Selected rolling window in days; must not exceed maxRetentionDays. Omitted patch values preserve the current selection or default to the interval maximum.
        maxRetentionDays:
          type: integer
          minimum: 1
          readOnly: true
          description: Product cap for this point's selected dbInterval.
        hotCacheEnabled: { type: boolean, default: true }
        hotCacheHours: { type: integer, minimum: 1, default: 48 }
        startAtUtc:
          type: string
          format: date-time
          description: Concrete backend-authoritative UTC start persisted after commit.
        state: { $ref: "#/components/schemas/HistorianPolicyState" }
        health: { type: string, enum: [healthy, degraded, error] }
        lastError: { type: string, description: "Latest historian health error; empty or omitted while healthy." }
        lastSampleUtc: { type: string, format: date-time }
        nextBoundaryUtc: { type: string, format: date-time }
    HistorianPolicyPatch:
      type: object
      required: [pointId, generation, dbLoggingEnabled]
      properties:
        pointId: { type: string, example: "VP2" }
        generation: { type: integer, minimum: 1 }
        dbLoggingEnabled: { type: boolean }
        dbInterval:
          type: string
          enum: [1s, 3s, 5s, 15s, 30s, 1m, 3m, 5m, 15m, 30m, 60m]
        retentionDays:
          type: integer
          minimum: 1
          description: Optional rolling window in days; backend rejects values above the interval maximum with historian_retention_invalid.
        startAtUtc:
          type: [string, "null"]
          format: date-time
          description: Null means start now using backend server time; explicit value must be future UTC Z.
    HistorianCapacity:
      type: object
      required: [enabledPoints, reservedBytes, budgetBytes, freeBytes, requiredFreeBytes]
      properties:
        enabledPoints: { type: integer, minimum: 0 }
        reservedBytes: { type: integer, minimum: 0 }
        budgetBytes: { type: integer, minimum: 0 }
        freeBytes: { type: integer, minimum: 0 }
        requiredFreeBytes: { type: integer, minimum: 0 }
    HistorianConfig:
      type: object
      required: [revision, serverNowUtc, points, capacity, namespaceRevision, retentionMaxDaysByInterval]
      properties:
        revision: { type: integer, minimum: 0 }
        serverNowUtc: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: "#/components/schemas/HistorianPolicy" }
        capacity: { $ref: "#/components/schemas/HistorianCapacity" }
        namespaceState: { type: string, enum: [valid, conflicted] }
        namespaceRevision: { type: integer, minimum: 0 }
        retentionMaxDaysByInterval:
          type: object
          readOnly: true
          description: Rev A maximum rolling retention by canonical interval.
          additionalProperties: { type: integer, minimum: 1 }
          example: { "1s": 30, "3s": 60, "5s": 90, "15s": 180, "30s": 365, "1m": 730, "3m": 1095, "5m": 1460, "15m": 1825, "30m": 2555, "60m": 3650 }
    HistorianConfigUpdate:
      type: object
      required: [baseRevision, baseNamespaceRevision, points]
      properties:
        baseRevision: { type: integer, minimum: 0 }
        baseNamespaceRevision: { type: integer, minimum: 0 }
        points:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/HistorianPolicyPatch" }
    HistorySample:
      type: object
      required: [time, value, quality, source, tier, generation]
      properties:
        time: { type: string, format: date-time }
        value: { type: number }
        min: { type: number }
        max: { type: number }
        sum: { type: number }
        count: { type: integer, minimum: 1 }
        quality: { type: string, enum: [GOOD, UNCERTAIN, BAD] }
        source: { type: string }
        tier: { type: string, enum: [cache, ram, hot, archive] }
        generation: { type: integer, minimum: 1 }
    HistorySeries:
      type: object
      required: [pointId, generation, effectiveResolution, samples]
      properties:
        pointId: { type: string }
        generation: { type: integer, minimum: 1 }
        effectiveResolution: { $ref: "#/components/schemas/HistorianInterval" }
        samples:
          type: array
          items: { $ref: "#/components/schemas/HistorySample" }
    HistoryGap:
      type: object
      required: [pointId, generation, fromUtc, toUtc, reason]
      properties:
        pointId: { type: string }
        generation: { type: integer, minimum: 1 }
        fromUtc: { type: string, format: date-time }
        toUtc: { type: string, format: date-time }
        reason:
          type: string
          enum: [not_enabled, before_start, restart, runtime, queue, clock, sqlite, migration, disk]
        detail: { type: string }
    HistoryResponse:
      type: object
      required: [from, to, complete, series, gaps, tiersUsed]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        complete: { type: boolean }
        series:
          type: array
          items: { $ref: "#/components/schemas/HistorySeries" }
        gaps:
          type: array
          items: { $ref: "#/components/schemas/HistoryGap" }
        tiersUsed:
          type: array
          uniqueItems: true
          items: { type: string, enum: [cache, ram, hot, archive] }
    ScheduleValue:
      description: >
        Must match the owning object's `value_type`: BINARY uses ACTIVE/INACTIVE, BOOLEAN uses
        true/false, REAL uses a finite number, UNSIGNED and ENUMERATED use a non-negative integer.
      oneOf:
        - type: string
          enum: [ACTIVE, INACTIVE]
        - type: boolean
        - type: number
        - type: integer
          minimum: 0
    ScheduleTimeValue:
      type: object
      required: [time, value]
      properties:
        time:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$"
          example: "08:00:00"
        value: { $ref: "#/components/schemas/ScheduleValue" }
    ScheduleWeekly:
      type: object
      required: [MON, TUE, WED, THU, FRI, SAT, SUN]
      description: Always all seven days, empty days included (spec §6.1).
      additionalProperties: false
      properties:
        MON: { $ref: "#/components/schemas/ScheduleDay" }
        TUE: { $ref: "#/components/schemas/ScheduleDay" }
        WED: { $ref: "#/components/schemas/ScheduleDay" }
        THU: { $ref: "#/components/schemas/ScheduleDay" }
        FRI: { $ref: "#/components/schemas/ScheduleDay" }
        SAT: { $ref: "#/components/schemas/ScheduleDay" }
        SUN: { $ref: "#/components/schemas/ScheduleDay" }
    ScheduleDay:
      type: array
      maxItems: 24
      description: >
        Sorted ascending by time. Two events at the same instant in one day is `SCH-CONFIG-002`.
        A day may contain several transitions, for example a lunch break.
      items: { $ref: "#/components/schemas/ScheduleTimeValue" }
    ScheduleDateRule:
      type: object
      required: [type]
      description: >
        `WEEK_N_DAY` and `HOLIDAY_GROUP` cannot be evaluated in a person's head, so the UI must
        preview the concrete dates they resolve to over the next 12 months.
      properties:
        type:
          type: string
          enum: [DATE, DATE_RANGE, WEEK_N_DAY, CALENDAR_REFERENCE, HOLIDAY_GROUP]
        date:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$"
        start_date:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$"
        end_date:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$"
        month:
          type: integer
          minimum: 0
          maximum: 12
          description: 1..12 a specific month; 0 means every month.
        week_of_month:
          type: integer
          minimum: 1
          maximum: 6
          description: 1..5 the Nth week; 6 means the LAST week (BACnet convention).
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 = Monday .. 7 = Sunday (ISO-8601).
        calendar_id:
          type: string
          pattern: "^CAL-[A-Za-z0-9_-]{1,60}$"
        group_id:
          type: string
          pattern: "^HG-[A-Za-z0-9_-]{1,60}$"
    ScheduleException:
      type: object
      required: [exception_id, name, date_rule, event_priority, time_values]
      properties:
        exception_id:
          type: string
          pattern: "^EXC-[A-Za-z0-9_-]{1,60}$"
        name: { type: string, minLength: 1, maxLength: 64 }
        date_rule: { $ref: "#/components/schemas/ScheduleDateRule" }
        event_priority:
          type: integer
          minimum: 1
          maximum: 16
          description: >
            Resolves several exceptions effective on the same day WITHIN one Schedule Object.
            This is NOT `priority_for_writing`. Equal priorities report `SCH-CONFIG-003`; the
            system never picks by creation time (spec §7.3).
        time_values:
          type: array
          minItems: 1
          maxItems: 24
          items: { $ref: "#/components/schemas/ScheduleTimeValue" }
    ScheduleTarget:
      type: object
      required: [target_id, target_type]
      description: >
        Up to 32 targets per schedule (ADR-023 QD-3). The board has 64 internal writable points
        plus 256 Modbus points, so the UI must show the real capacity rather than the ceiling.
      properties:
        target_id:
          type: string
          pattern: "^TGT-[A-Za-z0-9_-]{1,60}$"
        target_type:
          type: string
          enum: [INTERNAL_POINT, BACNET_OBJECT]
        point_kind:
          type: string
          enum: [AO, DO, AV, BV, MSV, EXT]
          description: >
            INTERNAL_POINT only. AO/DO go through the priority resolver; AV/BV/MSV write the point
            table; EXT is a Modbus RTU point. A kind incompatible with `value_type` is
            `SCH-TARGET-003`.
        channel:
          type: integer
          minimum: 1
          maximum: 256
          description: 1-based. Per-kind ceilings AO<=4, DO<=4, AV<=32, BV<=16, MSV<=8, EXT<=256.
        point_id:
          type: string
          maxLength: 32
          example: "DO-01"
        device_id: { type: string, maxLength: 64 }
        device_instance: { type: integer, minimum: 0, maximum: 4194302 }
        object_type:
          type: string
          enum: [ANALOG_OUTPUT, ANALOG_VALUE, BINARY_OUTPUT, BINARY_VALUE, MULTI_STATE_OUTPUT, MULTI_STATE_VALUE]
        object_instance: { type: integer, minimum: 0, maximum: 4194302 }
        property_identifier: { type: string, default: PRESENT_VALUE }
        array_index: { type: integer, minimum: 0, nullable: true }
    ScheduleErrorCode:
      type: string
      nullable: true
      description: The 14 spec §11 codes. Every user-facing error carries one.
      enum:
        - SCH-CONFIG-001
        - SCH-CONFIG-002
        - SCH-CONFIG-003
        - SCH-TARGET-001
        - SCH-TARGET-002
        - SCH-TARGET-003
        - SCH-TIME-001
        - SCH-TIME-002
        - SCH-WRITE-001
        - SCH-WRITE-002
        - SCH-RUNTIME-001
        - SCH-VERSION-001
        - SCH-PUBLISH-001
        - SCH-ROLLBACK-001
    ScheduleTargetRuntime:
      type: object
      required: [target_id]
      readOnly: true
      description: Write results are stored per target; one failing target never stops the others.
      properties:
        target_id: { type: string }
        write_result:
          type: string
          nullable: true
          enum: [OK, FAILED, TIMEOUT, SKIPPED]
        written_value: { nullable: true }
        actual_value:
          nullable: true
          description: Real value on the point. Differing from `written_value` usually means a higher priority source is holding it.
        overridden_by:
          type: string
          nullable: true
          enum: [FIRE_SAFETY, LOCAL_MANUAL, BACNET, LOCAL_LOGIC]
          description: >
            The winning non-schedule source on the priority resolver. This is the field that answers
            "the schedule is on, so why is the equipment not running".
        error_code: { $ref: "#/components/schemas/ScheduleErrorCode" }
        last_write_at: { type: string, format: date-time, nullable: true }
    ScheduleRuntimeState:
      type: object
      readOnly: true
      description: >
        Controller truth, never written by a client and never computed in the browser. Configuration
        is intent; this block is fact. Mixing the two is exactly the FE-DIAG-01 defect class.
      properties:
        effective_value: { nullable: true }
        value_source:
          type: string
          nullable: true
          enum: [WEEKLY, EXCEPTION, DEFAULT]
        source_exception_id: { type: string, nullable: true }
        next_transition_at: { type: string, format: date-time, nullable: true }
        applied_revision:
          type: integer
          nullable: true
          minimum: 0
          description: Revision the controller is running. Differing from the object's `revision` means `OUT_OF_SYNC`.
        last_evaluated_at: { type: string, format: date-time, nullable: true }
        error_code: { $ref: "#/components/schemas/ScheduleErrorCode" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/ScheduleTargetRuntime" }
    ScheduleObject:
      type: object
      required:
        - schema_version
        - schedule_id
        - schedule_name
        - enabled
        - status
        - timezone
        - effective_period
        - value_type
        - priority_for_writing
        - schedule_default
        - weekly_schedule
        - exception_schedule
        - target_objects
        - revision
      description: >
        Scheduler Engine v3.1 Schedule Object; replaces the register-based model entirely
        (spec §23). Authoritative machine-readable contract:
        `contracts/config/schedule_v3_1.schema.json` (frozen 2026-08-07).
      properties:
        schema_version:
          type: string
          enum: ["3.1"]
        schedule_id:
          type: string
          pattern: "^SCH-[A-Za-z0-9_-]{1,60}$"
          maxLength: 64
          example: "SCH-001"
        schedule_name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 1024 }
        enabled: { type: boolean }
        status:
          type: string
          enum: [DRAFT, VALIDATED, PUBLISHED, ACTIVE, INACTIVE, DISABLED, ERROR, OUT_OF_SYNC]
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh
          description: IANA name. Evaluation uses this zone, not the process TZ. Invalid is `SCH-TIME-001`.
        effective_period:
          type: object
          required: [start_date, end_date]
          properties:
            start_date:
              type: string
              nullable: true
              pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$"
            end_date:
              type: string
              nullable: true
              pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$"
              description: null means NO END DATE; the UI must say so in words.
        value_type:
          type: string
          enum: [BINARY, BOOLEAN, REAL, UNSIGNED, ENUMERATED]
          description: One Schedule Object uses exactly one value type (spec §2.1); locked once a target exists.
        priority_for_writing:
          type: integer
          minimum: 1
          maximum: 16
          default: 16
          description: >
            Arbitrates BETWEEN SCHEDULES writing the same point (ADR-023 QD-1). It is not a
            resolver level; see `core_priority_level`.
        core_priority_level:
          type: integer
          enum: [4]
          readOnly: true
          description: >
            Derived. The real level on the controller's 6-level priority resolver that every
            schedule shares. The UI must show it next to `priority_for_writing` so an operator can
            see why a priority-1 schedule still loses to a local manual command at level 2.
        schedule_default:
          $ref: "#/components/schemas/ScheduleValue"
        weekly_schedule: { $ref: "#/components/schemas/ScheduleWeekly" }
        exception_schedule:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/ScheduleException" }
        target_objects:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/ScheduleTarget" }
        bacnet_object:
          type: object
          description: Identity is minted from P1 to avoid a second data migration, but is only exposed on BACnet at P4 (ADR-023 QD-4).
          properties:
            object_type: { type: string, enum: [SCHEDULE] }
            object_instance: { type: integer, minimum: 0, maximum: 4194302 }
            exposed: { type: boolean, default: false, readOnly: true }
        revision:
          type: integer
          minimum: 0
          description: Increments on every update. Publishing an older revision is `SCH-VERSION-001`.
        migrated_from_v1:
          type: boolean
          default: false
          readOnly: true
          description: Set by the backend converter (ADR-023 QD-6). The UI shows a banner until the user reviews and republishes.
        runtime: { $ref: "#/components/schemas/ScheduleRuntimeState" }
        created_at: { type: string, format: date-time }
        created_by: { type: string, maxLength: 64 }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, maxLength: 64 }
    ScheduleValidationFinding:
      type: object
      required: [code, path, message]
      properties:
        code: { $ref: "#/components/schemas/ScheduleErrorCode" }
        path:
          type: string
          description: JSON path of the offending field, so the UI can jump to it.
          example: "$.weekly_schedule.MON[1].time"
        message: { type: string }
        severity: { type: string, enum: [error, warning] }
    ScheduleValidationResult:
      type: object
      required: [valid, findings]
      properties:
        valid: { type: boolean }
        status:
          type: string
          enum: [DRAFT, VALIDATED, ERROR]
        findings:
          type: array
          items: { $ref: "#/components/schemas/ScheduleValidationFinding" }
    ScheduleSimulateRequest:
      type: object
      required: [range]
      properties:
        range:
          type: string
          enum: [7_DAYS, 30_DAYS, SPECIFIC_DAY]
        start_date:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$"
          description: Defaults to today in the schedule's timezone.
    ScheduleSimulateTransition:
      type: object
      required: [at, source, value]
      properties:
        at: { type: string, format: date-time }
        source:
          type: string
          enum: [WEEKLY, EXCEPTION, DEFAULT]
        source_exception_id: { type: string, nullable: true }
        value: { $ref: "#/components/schemas/ScheduleValue" }
        target_ids:
          type: array
          items: { type: string }
        priority_for_writing: { type: integer, minimum: 1, maximum: 16 }
    ScheduleSimulateResult:
      type: object
      required: [transitions, conflicts, gaps]
      description: Produced by the controller evaluation engine, not a backend reimplementation.
      properties:
        transitions:
          type: array
          items: { $ref: "#/components/schemas/ScheduleSimulateTransition" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/ScheduleValidationFinding" }
        gaps:
          type: array
          description: Windows with no effective value; each is a configuration smell worth showing in red.
          items:
            type: object
            properties:
              from: { type: string, format: date-time }
              to: { type: string, format: date-time }
    SchedulePublishRequest:
      type: object
      required: [revision, reason]
      properties:
        revision:
          type: integer
          minimum: 0
          description: Revision the client believes it is publishing. A mismatch is `SCH-VERSION-001`.
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: Mandatory; stored in the audit trail.
        correlation_id:
          type: string
          description: Client-supplied idempotency key. Replaying the same key never applies twice.
    SchedulePublishResult:
      type: object
      required: [result, revision]
      properties:
        result:
          type: string
          enum: [ACCEPTED, REJECTED, TIMEOUT]
        revision:
          type: integer
          description: Revision now running on the controller. On REJECTED or TIMEOUT this is the PREVIOUS revision, unchanged.
        correlation_id: { type: string }
        error_code: { $ref: "#/components/schemas/ScheduleErrorCode" }
        error_message: { type: string, nullable: true }
        applied_at: { type: string, format: date-time, nullable: true }
        attempts: { type: integer, minimum: 1 }
    ScheduleRevision:
      type: object
      required: [revision, created_at, created_by]
      properties:
        revision: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        reason: { type: string }
        published: { type: boolean }
        rollback_of: { type: integer, nullable: true }
    ScheduleRollbackRequest:
      type: object
      required: [target_revision, reason]
      properties:
        target_revision: { type: integer, minimum: 0 }
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: Mandatory. A rollback creates a NEW revision and never rewrites history.
    ScheduleAuditEntry:
      type: object
      required: [at, actor, action, schedule_id]
      description: Append-only; spec §20 forbids editing or deleting entries.
      properties:
        at: { type: string, format: date-time }
        actor: { type: string }
        action:
          type: string
          enum: [CREATE, UPDATE, DELETE, VALIDATE, PUBLISH, ENABLE, DISABLE, ROLLBACK, MIGRATE]
        schedule_id: { type: string }
        revision_before: { type: integer, nullable: true }
        revision_after: { type: integer, nullable: true }
        reason: { type: string }
        changes: { type: string, description: Human-readable summary of what changed. }
        controller_id: { type: string }
        result: { type: string, enum: [success, failed] }
        error_code: { $ref: "#/components/schemas/ScheduleErrorCode" }
        source_ip: { type: string }
    AlarmSetting:
      type: object
      required: [id, label, enabled, alarmType, sources, priority, delayS, params]
      description: >
        ADR-013 alarm entity config. Multi-source semantics are per-source evaluation with entity
        state = OR. ACTIVE alarm types are 0, 1, and 3; types 2 and 4..7 are documented for
        EasySet parity but must stay disabled until core hooks land.
      properties:
        id:
          type: string
          pattern: "^ALM-[A-Za-z0-9_-]+$"
          maxLength: 64
          example: "ALM-001"
        label: { type: string, example: "Room temperature" }
        enabled: { type: boolean }
        alarmType: { $ref: "#/components/schemas/AlarmType" }
        sources:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/AlarmSourceRef" }
        delayS:
          type: number
          minimum: 0
          description: Delay before asserting the alarm; maps to AlarmDelay on ACTIVE graph paths.
        priority:
          type: string
          enum: [low, medium, high, critical, flexible]
          description: "`flexible` maps severity from params.severityRules."
        clearMode:
          type: string
          enum: [auto, manual]
          default: auto
          description: "`manual` keeps a returned-to-normal alarm visible until /alarms/{id}/suppress."
        publishBacnet:
          type: boolean
          default: false
          description: At most 8 enabled alarm entities may publish through BACnet Event Enrollment.
        notificationClass:
          type: integer
          minimum: 1
          maximum: 4
          description: BACnet Notification Class when publishBacnet=true.
        params:
          oneOf:
            - { $ref: "#/components/schemas/AlarmDisabledParams" }
            - { $ref: "#/components/schemas/AlarmThresholdParams" }
            - { $ref: "#/components/schemas/AlarmSetpointDeviationParams" }
            - { $ref: "#/components/schemas/AlarmRuntimeParams" }
            - { $ref: "#/components/schemas/AlarmSuperviseStateParams" }
            - { $ref: "#/components/schemas/AlarmSuperviseAnalogParams" }
            - { $ref: "#/components/schemas/AlarmPiSequenceParams" }
    AlarmType:
      type: integer
      enum: [0, 1, 2, 3, 4, 5, 6, 7]
      description: >
        0 disabled (ACTIVE no-op), 1 high_low_input (ACTIVE: AlarmHigh/AlarmLow+AlarmDelay),
        2 setpoint_deviation (DEFERRED), 3 runtime_hours (ACTIVE: RuntimeCounter.alarm),
        4 fan_state_supervision (DEFERRED), 5 digital_output_supervision (DEFERRED),
        6 analog_output_supervision (DEFERRED), 7 pi_sequence_supervision (DEFERRED).
    AlarmSourceRef:
      type: object
      required: [kind, channel, pointId]
      properties:
        kind: { type: string, enum: [UI, AO, DO, VP] }
        channel:
          type: integer
          minimum: 1
          maximum: 464
          description: UI 1..16, AO 1..4, DO 1..4; VP 1..464 must reference a created enabled integer/float Virtual Point.
        pointId:
          type: string
          pattern: "^((UI|AO|DO)-[0-9]{2}|(VP|AV)-?[0-9]{1,3})$"
          description: UI/AO/DO use their own point id; VP references a created Virtual Point; AV is accepted as a legacy alias.
          example: "UI-01"
    AlarmDisabledParams:
      type: object
      maxProperties: 0
      description: alarmType=0.
    AlarmThresholdParams:
      type: object
      required: [hh, h, l, ll]
      description: alarmType=1. Backend enforces hh >= h >= l >= ll when enabled.
      properties:
        hh: { type: number }
        h: { type: number }
        l: { type: number }
        ll: { type: number }
        hysteresis: { type: number, minimum: 0 }
        severityRules:
          type: array
          items: { $ref: "#/components/schemas/AlarmSeverityRule" }
    AlarmSetpointDeviationParams:
      type: object
      required: [setpoint, deviationHigh, deviationLow]
      description: alarmType=2, DEFERRED until core deviation hook exists.
      properties:
        setpoint: { type: number }
        deviationHigh: { type: number, minimum: 0 }
        deviationLow: { type: number, minimum: 0 }
    AlarmRuntimeParams:
      type: object
      required: [runtimeHours]
      description: alarmType=3. Maps to RuntimeCounter maint_hours.
      properties:
        runtimeHours: { type: number, minimum: 0 }
        severityRules:
          type: array
          items: { $ref: "#/components/schemas/AlarmSeverityRule" }
    AlarmSeverityRule:
      type: object
      required: [severity, op, value]
      properties:
        severity: { type: string, enum: [critical, high, medium, low, info] }
        op: { type: string, enum: [">=", "<="] }
        value: { type: number }
    AlarmSuperviseStateParams:
      type: object
      required: [expectedState]
      description: alarmType=4 or 5, DEFERRED until DO/fan supervision hook exists.
      properties:
        expectedState: { type: boolean }
    AlarmSuperviseAnalogParams:
      type: object
      required: [expectedValue, tolerance]
      description: alarmType=6, DEFERRED until AO supervision hook exists.
      properties:
        expectedValue: { type: number }
        tolerance: { type: number, minimum: 0 }
    AlarmPiSequenceParams:
      type: object
      required: [sequence]
      description: alarmType=7, DEFERRED until PI sequence supervision hook exists.
      properties:
        sequence:
          type: string
          maxLength: 64
    AlarmEvent:
      type: object
      description: >
        Visible runtime alarm row from ADR-014. `status=active` means condition true and not acked;
        `acked` means condition true and acknowledged; `unack` means condition cleared before
        acknowledgement and remains latched; `shelved` is reserved for a future phase.
      required: [id, time, severity, status, message, source, value, detail]
      properties:
        id: { type: string, description: "Alarm entity id used by /alarms/{id}/ack.", example: "ALM-001" }
        time: { type: string, format: date-time, description: "Occurrence first-active timestamp from core wall clock." }
        severity: { type: string, enum: [critical, high, medium, low, info], description: "Mapped from alarm priority; info is reserved for non-entity system alarms." }
        status: { type: string, enum: [active, unack, acked, cleared, shelved] }
        message: { type: string, description: "Display label, normally the alarm entity label." }
        source: { type: string, description: "Display source from the core alarm event." }
        value: { type: string, description: "Trigger/source value formatted for display." }
        triggerLevel: { type: string, enum: [HH, H, L, LL, RUNTIME], description: "Threshold bucket that tripped the alarm, if known." }
        threshold: { type: string, description: "Threshold value formatted for display, paired with triggerLevel." }
        detail: { type: string, description: "Human-readable condition detail derived by web from core protocol fields." }
        active: { type: boolean, description: "True while the underlying condition is still present, including acked active alarms." }
        returnable: { type: boolean, description: "True when this row is known by core and an acked active alarm can be returned to active; false for history-only fallback rows." }
    AlarmActionRequest:
      description: >
        Duration choice for alarm ack/suppress actions. Use either permanent=true or
        durationS > 0. Empty ack body is treated as permanent for legacy clients.
      oneOf:
        - type: object
          required: [permanent]
          additionalProperties: false
          properties:
            permanent: { type: boolean, enum: [true] }
        - type: object
          required: [durationS]
          additionalProperties: false
          properties:
            durationS: { type: number, minimum: 1 }
            permanent: { type: boolean, enum: [false] }
    AlarmHistoryEvent:
      type: object
      required: [eventId, time, event]
      properties:
        eventId: { type: string }
        time: { type: string, format: date-time }
        event: { type: string, enum: [started, acked, returned, ended, setting_created, setting_changed, setting_deleted] }
        alarmId: { type: string }
        user: { type: string }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        status: { type: string }
        message: { type: string }
        source: { type: string }
        value: { type: string }
        detail: { type: string }
        triggerLevel: { type: string, enum: [HH, H, L, LL, RUNTIME] }
        threshold: { type: string }
        active: { type: boolean }
        before: { $ref: "#/components/schemas/AlarmSetting" }
        after: { $ref: "#/components/schemas/AlarmSetting" }
    ConfigPutResult:
      type: object
      required: [result, applied, reload]
      description: "Ãnh xáº¡ SIGHUP/Restart: safe-state->sighup-core; device & io->sighup-iobus; bacnet & fieldbus->restart-iobus; network & time->system; (users->none, xá»­ lÃ½ riÃªng á»Ÿ /users)."
      properties:
        result: { type: string, enum: [success, failed, accepted, rejected] }
        applied: { type: boolean }
        reload: { type: string, enum: [sighup-core, sighup-iobus, sighup-iobus+sighup-core, restart-iobus, system, none] }
        warnings: { type: array, items: { type: string } }
        revision: { type: integer, format: int64 }
        checksum: { type: string }
    User:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
