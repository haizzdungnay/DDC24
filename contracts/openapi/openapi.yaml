  /network/transaction:
    get:
      summary: Đọc trạng thái Ethernet/DNS authoritative (viewer+)
      description: >
        Chuyển action `status` tới `mkddc-netcfg`. `active` phản ánh trạng thái kernel hiện tại,
        `configured` phản ánh profile đã lưu trong NetworkManager, và `pending` phản ánh candidate
        của giao dịch đang chờ. `reasonCode` cấp response mô tả kết quả request/giao dịch;
        `active.reasonCode` độc lập và mô tả sức khỏe interface. `capabilities` công bố feature
        protocol v1; `management` trả stable hostname/mDNS read-only.
      x-rbac: [viewer, operator, engineer, admin]
      responses:
        "200":
          description: Trạng thái authoritative hiện tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetcfgResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /network/transaction/{action}:
    post:
      summary: Thực hiện bước giao dịch Ethernet (admin)
      description: >
        Adapter strict/bounded tới `mkddc-netcfg`. `validate`/`stage` yêu cầu candidate;
        `apply`/`confirm`/`rollback` yêu cầu transactionId. Response `rejected` vẫn trả HTTP 200
        để giữ đầy đủ reasonCode/state authoritative; lỗi adapter/socket hoặc authority response
         không hợp đồng trả 502/503. DNS mutation chỉ được gửi sau status-preflight có capability
         `dns` và chỉ accepted khi response validate/stage vẫn công bố capability, echo đúng pending
         DNS/candidate tương ứng; mỗi POST sau authorization ghi đúng một audit event không chứa
         candidate, DNS hoặc token, kể cả request sai shape/action.
      x-rbac: [engineer, admin]
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [validate, stage, apply, confirm, rollback] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetcfgTransactionRequest" }
      responses:
        "200":
          description: Kết quả authoritative, accepted hoặc rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetcfgResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
