      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmActionRequest" }
      responses:
        "200":
          description: Current visible alarm list after ack.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /alarms/{id}/suppress:
    post:
      summary: Suppress alarm
      description: >
