      x-implementation-status: t59-814
      responses:
        "200":
          description: Ảnh chụp typed của phiên
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgrammingSimulationFrame" }
        "401": { $ref: "#/components/responses/ProgrammingError" }
        "403": { $ref: "#/components/responses/ProgrammingError" }
        "404": { $ref: "#/components/responses/ProgrammingError" }
        "503": { $ref: "#/components/responses/ProgrammingUnavailable" }
  /programming/simulation/sessions/{sessionId}/trace:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listProgrammingSimulationTrace
      summary: Đọc trang mẫu trace có biên của phiên
      x-rbac: [viewer, operator, engineer, admin]
      x-implementation-status: t59-814
      parameters:
        - { $ref: "#/components/parameters/ProgrammingCursor" }
        - { $ref: "#/components/parameters/ProgrammingLimit" }
      responses:
        "200":
          description: Trang mẫu trace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgrammingSimulationTracePage" }
        "401": { $ref: "#/components/responses/ProgrammingError" }
        "403": { $ref: "#/components/responses/ProgrammingError" }
        "404": { $ref: "#/components/responses/ProgrammingError" }
        "503": { $ref: "#/components/responses/ProgrammingUnavailable" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ScheduleId:
      name: id
      in: path
      required: true
      description: Schedule Object identifier, SCH-001 .. SCH-064 by convention.
      schema: { type: string, pattern: "^SCH-[A-Za-z0-9_-]{1,60}$", example: "SCH-001" }
    PointId:
      name: id
      in: path
      required: true
      schema: { type: string, example: "UI1" }
    VirtualPointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^(VP|AV)[-_]?0*([1-9]|[1-9][0-9]|[1-3][0-9]{2}|4[0-5][0-9]|46[0-4])$"
        example: "VP1"
    ProgrammingProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProgrammingProgramId:
      name: programId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ProgrammingLibraryEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProgrammingLibraryRevisionId:
      name: libraryRevisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProgrammingRevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProgrammingOperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProgrammingCursor:
      name: cursor
      in: query
      description: Token opaque có MAC, hiệu lực tối đa 15 phút.
      schema: { type: string, maxLength: 1024 }
    ProgrammingLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ProgrammingIdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: UUID v4; unique theo actor, endpoint và controller trong 24 giờ.
      schema: { type: string, format: uuid }
    ProgrammingIfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag mạnh của Draft mà client đã đọc.
      schema: { type: string, minLength: 3, maxLength: 128 }
  headers:
    ProgrammingETag:
      description: ETag mạnh của resource vừa trả về.
      schema: { type: string, minLength: 3, maxLength: 128 }
  responses:
    ProgrammingError:
      description: Lỗi Programming có code ổn định; FE không parse nội dung hiển thị.
      headers:
        X-Correlation-ID:
          schema: { type: string, pattern: "^[A-Za-z0-9._-]{16,64}$" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProgrammingErrorEnvelope" }
    ProgrammingUnavailable:
      description: Contract đã mount nhưng producer của task sau chưa sẵn sàng; không có side effect.
      headers:
        X-Correlation-ID:
          schema: { type: string, pattern: "^[A-Za-z0-9._-]{16,64}$" }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProgrammingErrorEnvelope" }
    ScheduleValidationError:
      description: >
        Configuration rejected. Every finding carries a spec §11 error code and a JSON path so the
        UI can jump straight to the offending field instead of showing a wall of text.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ScheduleValidationResult" }
    Error:
      description: Lá»—i
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error: { type: string }
              code: { type: integer }
              request_id: { type: string }
              details:
                type: array
                items: { $ref: "#/components/schemas/ValidationDetail" }
  schemas:
    ProgrammingErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ProgrammingPublicError" }
    ProgrammingPublicError:
      type: object
      additionalProperties: false
      required: [code, messageKey, retryable, keepsRunningRevision, correlationId]
      properties:
        code:
          type: string
          description: Mã công khai sinh từ contracts/programming/error_catalog_v1.json.
          enum:
            - PRG-ERR-REQ-001
            - PRG-ERR-NOT-FOUND-001
            - PRG-ERR-CONFLICT-001
            - PRG-ERR-SCOPE-001
            - PRG-ERR-MAP-003
            - PRG-ERR-MAP-004
            - PRG-ERR-CHECK-001
            - PRG-ERR-ARTIFACT-001
            - PRG-ERR-TARGET-001
            - PRG-ERR-CUTOVER-001
            - PRG-ERR-RETAIN-001
            - PRG-ERR-OP-001
            - PRG-ERR-COM-001
            - PRG-ERR-RESTORE-001
            - PRG-ERR-IMPORT-001
            - PRG-ERR-ACK-MISSING-001
            - PRG-ERR-ACK-UNEXPECTED-001
            - PRG-ERR-IMPACT-UNAVAILABLE-001
            - PRG-ERR-IMPACT-STALE-001
            - PRG-ERR-UNAVAILABLE-001
            - PRG-ERR-POU-KIND-001
            - PRG-ERR-POU-RECURSION-001
            - PRG-ERR-LIB-VERSION-001
            - PRG-ERR-PROGRAM-LIMIT-001
            - PRG-ERR-SIGNAL-PUBLISHER-001
            - PRG-ERR-SIGNAL-FRESHNESS-001
            - PRG-ERR-OUTPUT-OWNER-001
            - PRG-ERR-ENABLE-NOT-COMMISSIONED-001
            - PRG-ERR-PROGRAM-STATE-001
            - PRG-SIM-UNSUPPORTED
            - PRG-SIM-SAVE-REQUIRED
            - PRG-SIM-FORBIDDEN
            - PRG-SIM-INPUT-NOT-ALLOWED
            - PRG-SIM-STALE-SESSION
            - PRG-SIM-QUOTA
            - PRG-SIM-WORKER-FAILED
            - PRG-SIM-EXPIRED
            - PRG-ERR-PID-REVIEW-001
        messageKey:
          type: string
          pattern: "^programming\\.[A-Za-z0-9_.-]+$"
          description: Giá trị canonical theo code; producer không được tự đặt text.
        args:
          type: object
          description: Giá trị JSON bounded dùng cho i18n; không chứa secret hoặc detail nội bộ.
          additionalProperties: true
        field: { type: string }
        retryable: { type: boolean }
        keepsRunningRevision:
          type: boolean
          description: Chỉ true khi producer có invariant/read-back chứng minh; false nghĩa là chưa được xác nhận và client phải query operation/runtime.
        correlationId: { type: string, pattern: "^[A-Za-z0-9._-]{16,64}$" }
    ProgrammingCapabilities:
      type: object
      additionalProperties: false
      required: [schemaVersion, profile, targetState, limits, languages, types, taskPeriodsMs,
                 compatibility]
      # `workspaceModes` là bổ sung ADDITIVE của PGM-02 (DDD §5.5) và cố ý
      # KHÔNG required: server đời cũ không có nó, và client mới phải coi mọi
      # mode là UNAVAILABLE khi thiếu — không được đoán.
      properties:
        schemaVersion: { type: string, const: "1.0" }
        profile: { type: string, const: "MK-DDC-24-REV-A" }
        targetState: { type: string, enum: [READY, DEGRADED, UNAVAILABLE] }
        languages:
          type: array
          items: { type: string, enum: [ST, FBD] }
          uniqueItems: true
        types:
          type: array
          items: { type: string, enum: [BOOL, INT, DINT, UINT, REAL, TIME] }
          uniqueItems: true
        taskPeriodsMs:
          type: array
          items: { type: integer, enum: [1000, 5000, 30000] }
          uniqueItems: true
        workspaceModes:
          type: object
          additionalProperties: false
          required: [contractVersion, edit, live, simulation]
          properties:
            contractVersion: { type: string, const: "PGM02-WORKSPACE-V1" }
            edit:
              type: object
              additionalProperties: false
              required: [supported]
              properties:
                supported: { type: boolean }
            live:
              type: object
              additionalProperties: false
              required: [supported]
              properties:
                supported: { type: boolean }
            simulation:
              type: object
              additionalProperties: false
              required: [supported, workerVersion, mutationRoles, limits]
              properties:
                supported: { type: boolean }
                workerVersion: { type: string, nullable: true, maxLength: 32 }
                # v1 PHẢI là [admin]. Server là authority của quyền; FE chỉ đọc.
                mutationRoles:
                  type: array
                  items: { type: string, enum: [viewer, operator, admin] }
                  uniqueItems: true
                limits:
                  type: object
                  additionalProperties: false
                  required: [maxConcurrentSessionsPerController, idleTtlSeconds, hardTtlSeconds,
                             maxRssMiB, maxCpuPercentOneCore, maxActionsPerSecond, maxTraceSamples,
                             maxVirtualInputs, workerCommandTimeoutMs]
                  properties:
                    maxConcurrentSessionsPerController: { type: integer, minimum: 1 }
                    idleTtlSeconds: { type: integer, minimum: 1 }
                    hardTtlSeconds: { type: integer, minimum: 1 }
                    maxRssMiB: { type: integer, minimum: 1 }
                    maxCpuPercentOneCore: { type: integer, minimum: 1, maximum: 100 }
                    maxActionsPerSecond: { type: integer, minimum: 1 }
                    maxTraceSamples: { type: integer, minimum: 1 }
                    maxVirtualInputs: { type: integer, minimum: 1 }
                    workerCommandTimeoutMs: { type: integer, minimum: 1 }
        limits:
          type: object
          additionalProperties: false
          required: [projectsPerController, tasks, stSourceBytes, variables, statements, fbdBlocks, fbdConnections, artifactBytes, bindings]
          properties:
            projectsPerController: { type: integer, const: 1 }
            tasks: { type: integer, const: 1 }
            stSourceBytes: { type: integer, const: 65536 }
            variables: { type: integer, const: 512 }
            statements: { type: integer, const: 4096 }
            fbdBlocks: { type: integer, const: 256 }
            fbdConnections: { type: integer, const: 512 }
            artifactBytes: { type: integer, const: 1048576 }
            bindings: { type: integer, const: 256 }
        # ISS-STED-19 — BỘ BA TƯƠNG THÍCH, công bố thành MỘT KHỐI.
        #
        # Ba phiên bản này đã tồn tại rải rác (hồ sơ ngôn ngữ ở compiler,
        # registry thư viện ở domain, ABI ở profile) nhưng không endpoint nào
        # gom lại. Rải rác thì mỗi bên tự kiểm một mảnh, và lệch ở mảnh không
        # ai kiểm sẽ đi qua trong im lặng: bundle FE cũ vẫn vẽ palette/từ khoá
        # của phiên bản khác với phiên bản thiết bị đang biên dịch.
        #
        # KHÁC `workspaceModes`: khối này là REQUIRED. Thiếu nó KHÔNG được đọc
        # thành "chắc là khớp" — FE phải coi là KHÔNG KIỂM CHỨNG ĐƯỢC và chặn
        # soạn thảo (fail-closed), vì thiếu bằng chứng không phải là bằng chứng
        # khớp.
        compatibility:
          type: object
          additionalProperties: false
          required: [stLanguageProfileVersion, stLanguageProfileSha256, libraryRegistryVersion,
                     libraryRegistrySha256, compilerProfileId, targetAbi]
          properties:
            stLanguageProfileVersion: { type: string, minLength: 1, maxLength: 64 }
            stLanguageProfileSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
            libraryRegistryVersion: { type: string, minLength: 1, maxLength: 64 }
            libraryRegistrySha256: { type: string, pattern: "^[a-f0-9]{64}$" }
            compilerProfileId: { type: string, minLength: 1, maxLength: 64 }
            targetAbi: { type: integer, const: 3841 }
    ProgrammingProject:
      type: object
      additionalProperties: false
      required:
        [projectId, name, etag, activeRevisionId, draftRevisionId, baseRevisionId,
         updatedAt, dirty, draftSequence, activeSequence]
      properties:
        projectId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        etag: { type: string }
        activeRevisionId: { type: [string, "null"], format: uuid }
        draftRevisionId: { type: string, format: uuid }
        baseRevisionId:
          description: >
            Revision nền hiện hành của Draft, dùng cho baseRevisionId của lần
            lưu hoặc đóng Revision kế tiếp. Trước lần đóng đầu tiên, giá trị
            bằng draftRevisionId.
          type: string
          format: uuid
        updatedAt: { type: string, format: date-time }
        draft:
          description: >
            Nội dung Draft canonical (DM-PROG-001 §7: schemaVersion/project/
            programs/variables/bindings/task/library). Chỉ có ở
            `GET /projects/{projectId}` (đọc một Project); item của
            `GET /projects` (danh sách) không có trường này — field optional
            nên bổ sung là thay đổi minor tương thích ngược (task-prog-501).
          $ref: "#/components/schemas/ProgrammingResource"
        latestCheck:
          description: >
            Check gần nhất cho `baseRevisionId` hiện hành, bất kể state
            (WP-01, `REV-PROG-OVERVIEW-DESIGN-GAP-2026-08-15` §5.2). `null`
            khi Draft chưa từng niêm phong hoặc chưa từng Check — Overview
            dùng trường này để phân biệt checking/failed/ready thay vì chỉ
            có no-draft/dirty như trước.
          oneOf:
            - { $ref: "#/components/schemas/ProgrammingProjectLatestCheck" }
            - { type: "null" }
        # --- T60-015 (Plan 60 §3.1 nhóm B, D-05) ---
        # Ba trường dưới đây BẮT BUỘC CÓ MẶT, kể cả khi giá trị là `null`: server
        # cố ý không dùng `omitempty` vì `null` tường minh nói "server đã xét và
        # chưa biết", còn trường vắng mặt lẫn với "server đời cũ chưa có trường
        # này". FE render `null` thành `—`, tuyệt đối không thành `0` hay "sạch".
        dirty:
          description: >
            `true` khi `drafts.content_sha256` KHÁC `draftContentSha256` của
            manifest base Revision (còn việc chưa phát hành); `false` khi trùng
            byte-for-byte; `null` khi manifest base không mang
            `draftContentSha256` — khẳng định "sạch" khi chưa biết là giấu việc.
          type: [boolean, "null"]
        draftSequence:
          description: >
            Số thứ tự Revision nền hiện hành của Draft, dùng cho nhãn `Draft #14`
            thay cho UUID thô (AC-PGM01-01). `null` khi chưa phân giải được.
          type: [integer, "null"]
          minimum: 1
        activeSequence:
          description: >
            Số thứ tự Revision mà Core ĐANG chạy, và CHỈ khi Revision đó thuộc
            đúng Project này. Core im, hoặc Core chạy một Revision mà DB Web
            không biết ⇒ `null`; không lấy bản Commission gần nhất thế chỗ.
          type: [integer, "null"]
          minimum: 1
    ProgrammingProjectLatestCheck:
      type: object
      additionalProperties: false
      required: [checkId, revisionId, state, createdAt]
      properties:
        checkId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        state: { type: string, enum: [QUEUED, RUNNING, PASSED, FAILED, TIMED_OUT] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    ProgrammingProjectPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProgrammingProject" }
        nextCursor: { type: [string, "null"] }
    ProgrammingCreateProjectRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, name]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000, default: "" }
    ProgrammingDraftMutationRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, baseRevisionId, operations]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        baseRevisionId: { type: string, format: uuid }
        operations:
          type: array
          minItems: 1
          maxItems: 512
          items:
            type: object
            required: [op]
            properties:
              op: { type: string, minLength: 1, maxLength: 64 }
            additionalProperties: true
    ProgrammingCreateRevisionRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, baseRevisionId, label]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        baseRevisionId: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 120 }
        comment: { type: string, maxLength: 2000, default: "" }
    ProgrammingMutationResponse:
      type: object
      additionalProperties: false
      required: [resource, etag, auditId, correlationId]
      properties:
        resource: { $ref: "#/components/schemas/ProgrammingResource" }
        etag: { type: string }
        auditId: { type: string, format: uuid }
        correlationId: { type: string, pattern: "^[A-Za-z0-9._-]{16,64}$" }
    ProgrammingRevision:
      type: object
      additionalProperties: false
      # `snapshot` nằm trong `required` vì `GET /revisions/{id}` LUÔN gửi khoá
      # này: `GetRevision` dựng `{manifest, objects}` trên đường thành công, còn
      # đường thất bại đã trả 404 từ trước. Khai optional là nói contract lỏng
      # hơn thứ server thực sự bảo đảm, và client sẽ phải viết một nhánh "thiếu
      # snapshot" không bao giờ chạy tới.
      required: [revisionId, projectId, state, sequence, contentHash, createdAt, snapshot]
      properties:
        revisionId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        state: { type: string, enum: [DRAFT, IMMUTABLE, ACTIVE, LKG, SUPERSEDED] }
        # T60-015 + D-05 — số thứ tự Revision trong Project, LUÔN >= 1 nên không
        # nullable: hàng `revisions` không tồn tại thì request đã trả 404 từ
        # trước đó. Đây là thứ cho phép hiện `Active #12` thay cho UUID thô.
        sequence: { type: integer, minimum: 1 }
        contentHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        createdAt: { type: string, format: date-time }
        snapshot: { $ref: "#/components/schemas/ProgrammingResource" }
    ProgrammingRevisionChanges:
      type: object
      additionalProperties: false
      # T59-819 — `stHunks`/`fbdChanges`/`truncated` nằm trong `required` vì
      # server LUÔN gửi khoá: mảng rỗng nghĩa là "đã so và không có gì", khác
      # hẳn khoá vắng mặt nghĩa là "server đời cũ chưa biết so". Khai optional
      # sẽ làm hai câu đó trông giống nhau ở phía dùng — đúng chỗ một UI sẽ vẽ
      # "không có thay đổi" cho một Revision chưa hề được so.
      # `nextCursor` cũng nằm trong `required` và nullable: máy chủ LUÔN gửi
      # khoá, `null` nghĩa là "đã đọc hết". Khai optional sẽ làm "hết trang"
      # trông giống "server đời cũ không biết phân trang".
      required:
        [fromRevisionId, toRevisionId, impact, changes, stHunks, fbdChanges,
         truncated, nextCursor]
      properties:
        fromRevisionId:
          oneOf:
            - { type: string, format: uuid }
            - { type: string, const: none }
        toRevisionId: { type: string, format: uuid }
        impact: { $ref: "#/components/schemas/ProgrammingImpact" }
        changes:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/ProgrammingRevisionChange" }
        stHunks:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ProgrammingStHunk" }
        fbdChanges:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ProgrammingFbdChange" }
        # Danh sách chạm trần payload. Một danh sách bị cắt IM LẶNG trông y hệt
        # một danh sách đầy đủ, nên cờ này bắt buộc phải có mặt.
        truncated: { type: boolean }
        nextCursor:
          oneOf:
            - { type: string, minLength: 1, maxLength: 64 }
            - { type: "null" }
    ProgrammingStHunk:
      type: object
      additionalProperties: false
      required:
        [objectId, changeType, beforeStartLine, beforeLineCount, afterStartLine,
         afterLineCount, beforeText, afterText, truncated, coarse]
      properties:
        objectId: { type: string, format: uuid }
        changeType: { type: string, enum: [ADDED, REMOVED, REPLACED] }
        # Dòng bắt đầu đếm từ 1 để khớp thứ người dùng thấy trong editor. Hunk
        # thuần thêm/xoá có `*LineCount = 0` ở phía không tồn tại.
        beforeStartLine: { type: integer, minimum: 1 }
        beforeLineCount: { type: integer, minimum: 0 }
        afterStartLine: { type: integer, minimum: 1 }
        afterLineCount: { type: integer, minimum: 0 }
        beforeText:
          type: array
          maxItems: 40
          items: { type: string, maxLength: 4096 }
        afterText:
          type: array
          maxItems: 40
          items: { type: string, maxLength: 4096 }
        # Thân hunk bị cắt so với thực tế: `*LineCount` vẫn là số dòng THẬT.
        truncated: { type: boolean }
        # Tài liệu vượt trần thuật toán nên cả tệp bị hạ thành một hunk REPLACED.
        # Kết luận thô, không phải diff chi tiết — người đọc phải phân biệt được.
        coarse: { type: boolean }
    ProgrammingFbdChange:
      type: object
      additionalProperties: false
      required: [objectId, element, elementId, changeType, detail]
      properties:
        objectId: { type: string, format: uuid }
        element: { type: string, enum: [NETWORK, NODE, PORT, WIRE] }
        # Rỗng chỉ với thay đổi ở cấp tài liệu (vd GEOMETRY_ONLY của layout).
        elementId: { type: string, maxLength: 128 }
        # ORDER_ONLY và GEOMETRY_ONLY tách riêng khỏi UPDATED: kéo một khối trên
        # canvas không đổi hành vi chương trình, gộp chung sẽ làm người đọc mất
        # khả năng phân biệt thứ cần soi kỹ với thứ chỉ cần liếc.
        changeType: { type: string, enum: [ADDED, REMOVED, UPDATED, ORDER_ONLY, GEOMETRY_ONLY] }
        detail: { type: string, maxLength: 64 }
    ProgrammingRevisionChange:
      type: object
      additionalProperties: false
      required: [objectId, kind, changeType, category, beforeSha256, afterSha256]
      properties:
        objectId: { type: string, format: uuid }
        # Phải bằng whitelist revision_objects/validObjectKind; thiếu SIGNAL ở
        # đây khiến client sinh từ contract không giải mã được diff của chính
        # Revision Published Signal mà store v11 vừa cho phép seal.
        kind: { type: string, enum: [METADATA, PROGRAM, FUNCTION, FUNCTION_BLOCK, VARIABLE, BINDING, TASK, SIGNAL] }
        changeType: { type: string, enum: [ADDED, REMOVED, MODIFIED] }
        category: { type: string, enum: [SOURCE, MAPPING, OUTPUT_MAPPING, TASK, LIBRARY, RETAIN, PUBLISHED_SIGNAL, PROGRAM_SET] }
        beforeSha256:
          oneOf:
            - { type: string, pattern: "^[a-f0-9]{64}$" }
            - { type: "null" }
        afterSha256:
          oneOf:
            - { type: string, pattern: "^[a-f0-9]{64}$" }
            - { type: "null" }
    ProgrammingImpactStatus:
      type: string
      enum: [NONE, PRESENT, UNAVAILABLE]
    ProgrammingImpactKey:
      type: string
      # T59-502 bổ sung bốn nhóm cho mô hình đa Program. Bốn nhóm cũ chỉ phủ
      # Rev A một Program, nên một Revision đổi Published Signal, đổi Control
      # Library, thêm/bớt Program, hay chạm đúng Program đang Enabled đều đi qua
      # Commission mà KHÔNG hỏi acknowledgement nào.
      enum:
        [retain, activeOverrides, cutover, outputMappingChanges,
         publishedSignals, controlLibrary, programSet, enableIntent]
    ProgrammingImpactGroup:
      type: object
      additionalProperties: false
      required: [status, items]
      properties:
        status: { $ref: "#/components/schemas/ProgrammingImpactStatus" }
        items:
          type: array
          items: { type: string, minLength: 1, maxLength: 512 }
    ProgrammingImpact:
      type: object
      additionalProperties: false
      required:
        [impactRef, retain, activeOverrides, cutover, outputMappingChanges,
         publishedSignals, controlLibrary, programSet, enableIntent]
      properties:
        impactRef: { type: string, minLength: 8, maxLength: 128 }
        retain: { $ref: "#/components/schemas/ProgrammingImpactGroup" }
        activeOverrides: { $ref: "#/components/schemas/ProgrammingImpactGroup" }
        cutover: { $ref: "#/components/schemas/ProgrammingImpactGroup" }
        outputMappingChanges: { $ref: "#/components/schemas/ProgrammingImpactGroup" }
        # Đổi freshness/chính sách stale/publisher của một Published Signal đổi
        # hành vi của MỌI consumer khi mất dữ liệu — thứ không nhìn thấy được
        # trong diff mã nguồn.
        publishedSignals: { $ref: "#/components/schemas/ProgrammingImpactGroup" }
        # Đổi Control Library đổi thân của mọi POU tham chiếu nó.
        controlLibrary: { $ref: "#/components/schemas/ProgrammingImpactGroup" }
        # Thêm/bớt Program đổi TẬP chương trình đang chạy trên thiết bị.
        programSet: { $ref: "#/components/schemas/ProgrammingImpactGroup" }
        # Program đang Enabled mà Revision này chạm tới: người vận hành phải biết
        # thứ đang chạy sắp bị thay, không phải phát hiện sau khi nó đã thay.
        enableIntent: { $ref: "#/components/schemas/ProgrammingImpactGroup" }
    ProgrammingCheckRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, targetProfile]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        targetProfile: { type: string, const: "MK-DDC-24-REV-A" }
    ProgrammingCheck:
      type: object
      additionalProperties: false
      required: [checkId, revisionId, state, diagnostics, symbols, createdAt, attemptCount]
      properties:
        checkId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        state: { type: string, enum: [QUEUED, RUNNING, PASSED, FAILED, TIMED_OUT] }
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/ProgrammingDiagnostic" }
        # ISS-STED-13 — bảng biến GIAO DIỆN do compiler công bố, để FE đối
        # chiếu chỉ mục ký hiệu dựng bằng regex của mình. FE có ba bộ đọc ST
        # độc lập với compiler và trước đây không có cách nào biết mình đọc
        # lệch. Mảng RỖNG là câu trả lời thật ("POU không khai cổng nào");
        # Check chưa PASSED thì cũng rỗng, vì một bảng dở dang đem đối chiếu
        # sẽ tạo ra chính thứ lệch giả mà cổng này sinh ra để chống.
        symbols:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pouId, name, direction, type, slot]
            properties:
              pouId: { type: string }
              name: { type: string, minLength: 1, maxLength: 64 }
              direction: { type: string, enum: [input, output] }
              type: { type: string, enum: [BOOL, INT, DINT, UINT, REAL, TIME] }
              slot: { type: integer, minimum: 0 }
        artifact:
          oneOf:
            - { $ref: "#/components/schemas/ProgrammingArtifact" }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        attemptCount: { type: integer, minimum: 0, maximum: 2 }
    ProgrammingArtifact:
      type: object
      additionalProperties: false
      required: [artifactId, sha256, byteSize, profile, targetAbi, compilerVersion, libraryVersion,
                 stLanguageProfileVersion]
      properties:
        artifactId: { type: string, format: uuid }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        byteSize: { type: integer, minimum: 1, maximum: 1048576 }
        profile: { type: string, const: "MKDDC24_REVA" }
        targetAbi: { type: integer, const: 3841 }
        compilerVersion: { type: string, minLength: 1, maxLength: 64 }
        libraryVersion: { type: string, minLength: 1, maxLength: 64 }
        # ISS-STED-19: phiên bản hồ sơ ngôn ngữ ST đi CÙNG artifact. Một artifact
        # tách khỏi ngữ cảnh sinh ra nó (lưu lại, gửi đi, đọc lại sau) mà không
        # mang phiên bản ngôn ngữ thì không ai nói được nó biên dịch dưới hồ sơ nào.
        stLanguageProfileVersion: { type: string, minLength: 1, maxLength: 64 }
    ProgrammingDiagnostic:
      type: object
      additionalProperties: false
      required: [code, detailCode, severity, messageKey, location]
      properties:
        code: { type: string, pattern: "^PRG-ERR-[A-Z0-9-]+$" }
        detailCode: { type: string, pattern: "^[A-Z][A-Z0-9-]{2,127}$" }
        severity: { type: string, enum: [ERROR, WARNING, INFO] }
        messageKey: { type: string }
        location: { $ref: "#/components/schemas/ProgrammingResource" }
        args:
          type: object
          additionalProperties:
            type: [string, integer, number, boolean]
    ProgrammingCheckAccepted:
      type: object
      additionalProperties: false
      required: [checkId, statusUrl, state, requestHash, acceptedAt, correlationId]
      properties:
        checkId: { type: string, format: uuid }
        statusUrl: { type: string, pattern: "^/api/v1/programming/checks/[A-Za-z0-9-]+$" }
        state: { type: string, enum: [QUEUED, RUNNING, PASSED, FAILED, TIMED_OUT] }
        requestHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        acceptedAt: { type: string, format: date-time }
        correlationId: { type: string, pattern: "^[A-Za-z0-9._-]{16,64}$" }
    ProgrammingTraceRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, variableIds, durationMs, samplePeriodMs]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        variableIds:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: { type: string, format: uuid }
        durationMs: { type: integer, minimum: 1000, maximum: 600000 }
        samplePeriodMs: { type: integer, minimum: 100, maximum: 30000 }
    ProgrammingTaskMetrics:
      type: object
      additionalProperties: false
      required: [taskId, periodMs, budgetMs, state, runCount, missedReleaseCount, lastExecNs, maxExecNs, overrunCount, consecutiveOverruns]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 32 }
        periodMs: { type: integer, minimum: 1 }
        budgetMs: { type: integer, minimum: 1 }
        state: { type: string, enum: [STOPPED, RUNNING, FAULT] }
        runCount: { type: integer, minimum: 0 }
        missedReleaseCount: { type: integer, minimum: 0 }
        lastExecNs: { type: integer, minimum: 0 }
        maxExecNs: { type: integer, minimum: 0 }
        overrunCount: { type: integer, minimum: 0 }
        consecutiveOverruns: { type: integer, minimum: 0 }
    ProgrammingMonitorPointRef:
      type: object
      additionalProperties: false
      required: [category, pointId]
      properties:
        category: { type: string, enum: [LOCAL, VP, MB_RTU] }
        pointId: { type: string, minLength: 1, maxLength: 128 }
        deviceId: { type: string, minLength: 1, maxLength: 128 }
    ProgrammingMonitorSample:
      type: object
      additionalProperties: false
      required: [variableId, variableName, programId, point, direction, dataType, programValue, actualValue, overriddenBy, effectivePriority, overrideActor, overrideRemainingS, quality, observedAt, freshness]
      properties:
        variableId: { type: string, format: uuid }
        variableName: { type: string, minLength: 1, maxLength: 128 }
        programId: { type: string, format: uuid }
        point: { $ref: "#/components/schemas/ProgrammingMonitorPointRef" }
        direction: { type: string, enum: [READ, WRITE, READ_WRITE] }
        dataType: { type: string, enum: [BOOL, INT, DINT, UINT, REAL, TIME] }
        unit: { type: string, maxLength: 32 }
        programValue: { type: [number, integer, boolean, string, "null"] }
        actualValue: { type: [number, integer, boolean, string, "null"] }
        overriddenBy: { type: [string, "null"], maxLength: 64 }
        effectivePriority: { type: [integer, "null"], minimum: 1, maximum: 6 }
        overrideActor: { type: [string, "null"], maxLength: 128 }
        overrideRemainingS: { type: [integer, "null"], minimum: 0 }
        quality: { type: string, enum: [GOOD, UNCERTAIN, BAD, STALE, OFFLINE, UNKNOWN] }
        observedAt: { type: string, format: date-time }
        freshness: { type: string, enum: [LIVE, STALE, UNAVAILABLE] }
    ProgrammingMonitorPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, activeRevisionId, safeState, task, items, producer]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        activeRevisionId: { type: [string, "null"], format: uuid }
        producer: { $ref: "#/components/schemas/ProgrammingProducerStamp" }
        safeState: { type: boolean }
        task:
          oneOf:
            - { $ref: "#/components/schemas/ProgrammingTaskMetrics" }
            - { type: "null" }
        items:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/ProgrammingMonitorSample" }
    ProgrammingProducerStamp:
      description: >-
        `T59-810` — dấu của NGƯỜI SẢN XUẤT số liệu (Core), đi kèm mọi snapshot
        runtime. `activeRevisionId` một mình không đủ để giữ mạch: hai snapshot
        CÙNG một Revision vẫn có thể tới sai thứ tự (poll chồng nhau, retry), và
        khi đó giá trị đi lùi mà không ai biết. `capturedMonotonicNs` là mốc
        monotonic lúc Core chụp — tăng nghiêm ngặt trong một lần chạy, và GIẢM
        khi Core khởi động lại, nên nó phân biệt được "cũ hơn" với "producer đã
        restart".
      type: object
      additionalProperties: false
      required: [capturedMonotonicNs]
      properties:
        capturedMonotonicNs:
          description: >-
            Chuỗi thập phân, KHÔNG phải number. Nanosecond kể từ boot vượt
            `Number.MAX_SAFE_INTEGER` sau ~104 ngày uptime; truyền dạng số sẽ
            làm client JavaScript làm tròn im lặng đúng lúc thiết bị chạy lâu
            nhất — tức đúng lúc dấu này cần thiết nhất.
          type: string
          pattern: "^[0-9]{1,20}$"
    # T59-814 / ADR-053 — Simulation R3.
    #
    # Mọi số đếm đi bằng CHUỖI thập phân (`sessionSequence`, `virtualTimeMs`,
    # `observationSequence`, `resetEpoch`): chúng là uint64 và JSON number của
    # JavaScript mất chính xác từ 2^53. Một sequence bị làm tròn sẽ làm mọi phép
    # so `If-Match` sai theo cách không ai nhìn thấy.
    ProgrammingSimulationCreateRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, controllerId, projectId, sourceDraftRevisionId, sourceContentSha256]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        controllerId: { type: string, minLength: 1, maxLength: 128 }
        projectId: { type: string, format: uuid }
        sourceDraftRevisionId: { type: string, format: uuid }
        sourceContentSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    ProgrammingSimulationActionRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, action]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        # `SET_INPUT` và `STOP` cố ý KHÔNG có ở đây: chúng có resource riêng.
        action: { type: string, enum: [RUN, PAUSE, STEP_CYCLE, RESET, SET_SPEED] }
        speed: { type: integer, enum: [1, 10, 60] }
    ProgrammingSimulationInputRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, dataType, value]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        # Kiểu ĐI KÈM giá trị và phải khớp manifest. Suy kiểu từ hình dạng JSON
        # sẽ biến biên kiểm kiểu thành biên kiểm định dạng.
        dataType: { type: string, enum: [BOOL, INT, DINT, UINT, REAL, TIME] }
        value: { nullable: false }
    ProgrammingSimulationInput:
      type: object
      additionalProperties: false
      required: [observationId, programId, variable, sourceKind, dataType, unit, min, max, simulationWritable]
      properties:
        observationId: { type: string, minLength: 1, maxLength: 128 }
        programId: { type: string }
        variable: { type: string }
        # Chỉ hai nguồn này được ghi. OUTPUT/IN_OUT/RETAIN/INTERNAL/COMMAND/
        # OVERRIDE/PRODUCTION_WRITER không bao giờ xuất hiện trong allowlist.
        sourceKind: { type: string, enum: [VAR_INPUT, READ_BINDING] }
        dataType: { type: string, enum: [BOOL, INT, DINT, UINT, REAL, TIME] }
        unit: { type: string, nullable: true, maxLength: 32 }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        simulationWritable: { type: boolean }
    ProgrammingSimulationObservation:
      type: object
      additionalProperties: false
      required: [observationId, programId, variable, kind, dataType, quality, value]
      properties:
        observationId: { type: string, minLength: 1, maxLength: 128 }
        programId: { type: string }
        variable: { type: string }
        kind: { type: string, enum: [INPUT, OUTPUT] }
        dataType: { type: string, enum: [BOOL, INT, DINT, UINT, REAL, TIME] }
        # UNAVAILABLE khi Program chưa từng đến hạn. Không có "0 mặc định": một
        # số 0 không phân biệt được với số 0 thật là đúng loại lỗi phải tránh.
        quality: { type: string, enum: [GOOD, UNCERTAIN, BAD, UNAVAILABLE] }
        value: { nullable: true }
    ProgrammingSimulationFrame:
      type: object
      additionalProperties: false
      required: [virtualTimeMs, snapshotSequence, resetEpoch, observations]
      properties:
        virtualTimeMs: { type: integer, format: int64, minimum: 0 }
        snapshotSequence: { type: integer, format: int64, minimum: 0 }
        resetEpoch: { type: integer, format: int64, minimum: 0 }
        observations:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/ProgrammingSimulationObservation" }
    ProgrammingSimulationTraceSample:
      type: object
      additionalProperties: false
      required: [virtualTimeMs, snapshotSequence, values]
      properties:
        virtualTimeMs: { type: integer, format: int64, minimum: 0 }
        snapshotSequence: { type: integer, format: int64, minimum: 0 }
        values:
          type: array
          maxItems: 4096
          items: { nullable: true }
    ProgrammingSimulationTracePage:
      type: object
      additionalProperties: false
      required: [samples, nextCursor, total, dropped]
      properties:
        samples:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/ProgrammingSimulationTraceSample" }
        nextCursor: { type: integer, format: int64, minimum: 0 }
        total: { type: integer, format: int64, minimum: 0 }
        # `dropped` > 0 nghĩa là trace đã đầy và DỪNG ghi. Nói ra thay vì cuộn
        # vòng im lặng: một trace bị cuộn trông y hệt một trace đầy đủ.
        dropped: { type: integer, format: int64, minimum: 0 }
    ProgrammingSimulationSession:
      type: object
      additionalProperties: false
      required: [sessionId, controllerId, projectId, sourceDraftRevisionId, sourceContentSha256,
                 state, sessionSequence, etag, baseTickMs, virtualTimeMs, speed,
                 observationSequence, resetEpoch, createdAt, lastActivityAt, idleExpiresAt,
                 hardExpiresAt, failureCode, workerVersion]
      properties:
        sessionId: { type: string, format: uuid }
        controllerId: { type: string, minLength: 1, maxLength: 128 }
        projectId: { type: string, format: uuid }
        sourceDraftRevisionId: { type: string, format: uuid }
        sourceContentSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        state: { type: string, enum: [PREPARING, PAUSED, RUNNING, COMPLETED, FAILED, EXPIRED, STOPPED] }
        sessionSequence: { type: string, pattern: "^[0-9]{1,20}$" }
        etag: { type: string, minLength: 1, maxLength: 128 }
        baseTickMs: { type: integer, nullable: true, minimum: 1 }
        virtualTimeMs: { type: string, pattern: "^[0-9]{1,20}$" }
        speed: { type: integer, enum: [1, 10, 60] }
        observationSequence: { type: string, pattern: "^[0-9]{1,20}$" }
        resetEpoch: { type: string, pattern: "^[0-9]{1,20}$" }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        idleExpiresAt: { type: string, format: date-time }
        hardExpiresAt: { type: string, format: date-time }
        # Mã ổn định, không phải văn bản tự do. Null nghĩa là "chưa hỏng".
        failureCode: { type: string, nullable: true, maxLength: 64 }
        workerVersion: { type: string, nullable: true, maxLength: 32 }
        simulationInputs:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/ProgrammingSimulationInput" }
        auditId: { type: string, format: uuid }
    ProgrammingTraceAccepted:
      type: object
      additionalProperties: false
      required: [traceId, statusUrl, state, requestHash, acceptedAt, correlationId]
      properties:
        traceId: { type: string, format: uuid }
        statusUrl: { type: string, pattern: "^/api/v1/programming/runtime/traces/[A-Za-z0-9-]+$" }
        state: { type: string, enum: [RUNNING, COMPLETED] }
        requestHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        acceptedAt: { type: string, format: date-time }
        correlationId: { type: string, pattern: "^[A-Za-z0-9._-]{16,64}$" }
    ProgrammingTraceValue:
      type: object
      additionalProperties: false
      required: [variableId, programValue, actualValue, overriddenBy, effectivePriority, quality, freshness]
      properties:
        variableId: { type: string, format: uuid }
        programValue: { type: [number, integer, boolean, string, "null"] }
        actualValue: { type: [number, integer, boolean, string, "null"] }
        overriddenBy: { type: [string, "null"], maxLength: 64 }
        effectivePriority: { type: [integer, "null"], minimum: 1, maximum: 6 }
        quality: { type: string, enum: [GOOD, UNCERTAIN, BAD, STALE, OFFLINE, UNKNOWN] }
        freshness: { type: string, enum: [LIVE, STALE, UNAVAILABLE] }
    ProgrammingTraceSample:
      type: object
      additionalProperties: false
      required: [sequence, observedAt, values]
      properties:
        sequence: { type: integer, minimum: 1, maximum: 10000 }
        observedAt: { type: string, format: date-time }
        values:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/ProgrammingTraceValue" }
    ProgrammingTrace:
      type: object
      additionalProperties: false
      required: [traceId, state, variableIds, durationMs, samplePeriodMs, startedAt, updatedAt, stopReason, droppedSamples, samples, pin]
      properties:
        traceId: { type: string, format: uuid }
        state: { type: string, enum: [RUNNING, COMPLETED, STOPPED, FAILED] }
        pin: { $ref: "#/components/schemas/ProgrammingTracePin" }
        variableIds:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: { type: string, format: uuid }
        durationMs: { type: integer, minimum: 1000, maximum: 600000 }
        samplePeriodMs: { type: integer, minimum: 100, maximum: 30000 }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stopReason: { type: [string, "null"], enum: [DURATION_REACHED, QUOTA_REACHED, USER_STOPPED, SOURCE_UNAVAILABLE, null] }
        droppedSamples: { type: integer, minimum: 0 }
        samples:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/ProgrammingTraceSample" }
    ProgrammingTracePin:
      description: >-
        `T59-810` — tuple Active mà phiên Trace được NEO vào lúc tạo. Một phiên
        Trace kéo dài qua một lần cutover sẽ ghép mẫu của hai chương trình khác
        nhau vào cùng một đồ thị; người đọc không có cách nào nhìn ra chỗ nối.
        Neo tuple lúc tạo và dừng phiên khi tuple trôi là cách duy nhất để dãy
        mẫu chỉ thuộc về đúng một Revision.
      type: object
      additionalProperties: false
      required: [revisionId, producer]
      properties:
        revisionId: { type: [string, "null"], format: uuid }
        producer: { $ref: "#/components/schemas/ProgrammingProducerStamp" }
    ProgrammingCommissionRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, revisionId, expectedActiveRevisionId, checkId, impactRef, acknowledgements, cutover]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        revisionId: { type: string, format: uuid }
        expectedActiveRevisionId: { type: [string, "null"], format: uuid }
        checkId: { type: string, format: uuid }
        impactRef: { type: string, minLength: 8, maxLength: 128 }
        acknowledgements:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProgrammingImpactKey" }
        cutover:
          type: object
          additionalProperties: false
          required: [requested]
          properties:
            requested: { type: string, enum: [GRAPH_ONLY, PROGRAM_ONLY] }
            graphBackupId: { type: [string, "null"], maxLength: 128 }
    ProgrammingRestoreRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, revisionId, expectedActiveRevisionId, reason]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        revisionId: { type: string, format: uuid }
        expectedActiveRevisionId: { type: [string, "null"], format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ProgrammingBundleExportRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, revisionIds]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        revisionIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    ProgrammingBundleImportRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, bundleBase64, expectedSha256]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000, default: "" }
        bundleBase64:
          type: string
          minLength: 4
          maxLength: 5592408
          contentEncoding: base64
        expectedSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    ProgrammingBundleExportResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, bundleSha256, byteSize, revisionIds, selectedRevisionId, bundleBase64, auditId, correlationId]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        bundleSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        byteSize: { type: integer, minimum: 1, maximum: 4194304 }
        revisionIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        selectedRevisionId: { type: string, format: uuid }
        bundleBase64:
          type: string
          minLength: 4
          maxLength: 5592408
          contentEncoding: base64
        auditId: { type: string, format: uuid }
        correlationId: { type: string, pattern: "^[A-Za-z0-9._-]{16,64}$" }
    ProgrammingRecoveryResetRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, reason]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Lý do gỡ khoá — đi thẳng vào audit, kể cả khi Core từ chối.
    ProgrammingRecoveryResetResult:
      type: object
      additionalProperties: false
      required: [applied, auditId]
      properties:
        applied: { type: boolean }
        detailCode: { type: string, maxLength: 64 }
        auditId: { type: string, format: uuid }
    ProgrammingRetainResetRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedActiveRevisionId, confirmationToken, reason]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        expectedActiveRevisionId: { type: string, format: uuid }
        confirmationToken: { type: string, minLength: 16, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ProgrammingOperationAccepted:
      type: object
      additionalProperties: false
      required: [operationId, statusUrl, state, requestHash, acceptedAt, correlationId]
      properties:
        operationId: { type: string, format: uuid }
        statusUrl: { type: string, pattern: "^/api/v1/programming/operations/[A-Za-z0-9-]+$" }
        state: { type: string, const: QUEUED }
        requestHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        acceptedAt: { type: string, format: date-time }
        correlationId: { type: string, pattern: "^[A-Za-z0-9._-]{16,64}$" }
    ProgrammingOperation:
      type: object
      additionalProperties: false
      required: [operationId, state, step, keepsRunningRevision, startedAt, updatedAt]
      properties:
        operationId: { type: string, format: uuid }
        state: { type: string, enum: [QUEUED, PREFLIGHT, STAGING, APPLYING, VERIFYING, SUCCEEDED, FAILED, ROLLED_BACK, UNKNOWN_RECONCILING] }
        step: { type: string, maxLength: 128 }
        requestedRevisionId: { type: [string, "null"], format: uuid }
        previousActiveRevisionId: { type: [string, "null"], format: uuid }
        actualActiveRevisionId: { type: [string, "null"], format: uuid }
        keepsRunningRevision: { type: boolean }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProgrammingRuntime:
      type: object
      additionalProperties: false
      required: [schemaVersion, controllerId, producerState, activeRevisionId, lkgRevisionId, taskState, safeState, safeStateNoControllerOnly, observedAt, task]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        controllerId: { type: string, minLength: 1, maxLength: 128 }
        producerState: { type: string, enum: [READY, DEGRADED, UNAVAILABLE] }
        activeRevisionId: { type: [string, "null"], format: uuid }
        lkgRevisionId: { type: [string, "null"], format: uuid }
        taskState: { type: string, enum: [STOPPED, STARTING, RUNNING, FAULT, UNKNOWN] }
        safeState: { type: boolean }
        safeStateNoControllerOnly:
          type: boolean
          description: >-
            true CHỈ KHI safeState=true đến từ trigger T7 (no_controller) đơn
            độc ở Core — không có iop_fault/stale/graph_input_bad/overrun đi
            kèm. Commission một Program có output sẽ tự giải quyết trường hợp
            này; false thì safeState do lỗi thật, không được coi là an toàn
            để Commission bỏ qua.
        observedAt: { type: string, format: date-time }
        task:
          oneOf:
            - { $ref: "#/components/schemas/ProgrammingTaskMetrics" }
            - { type: "null" }
    ProgrammingRuntimeSignal:
      type: object
      additionalProperties: false
      required: [signalId, name, producerProgramId, dataType, unit, value, valid, quality, freshness, stalePolicy, freshnessMs, publishedAtMonoNs, generation, definitionState]
      properties:
        signalId: { type: [string, "null"], format: uuid }
        name: { type: string, minLength: 1, maxLength: 64 }
        producerProgramId: { type: string, minLength: 1, maxLength: 64 }
        dataType: { type: string, enum: [BOOL, INT, DINT, UINT, REAL, TIME] }
        unit: { type: [string, "null"], maxLength: 32 }
        value:
          description: null khi valid=false; không bao giờ thay null bằng 0/false.
          type: [boolean, integer, number, "null"]
        valid: { type: boolean }
        quality: { type: string, enum: [GOOD, UNCERTAIN, BAD] }
        freshness: { type: string, enum: [FRESH, STALE_HELD, STALE_FALLBACK, UNAVAILABLE, NOT_DECLARED] }
        stalePolicy: { type: string, enum: [WAIT, HOLD_LAST, USE_FALLBACK, SAFE_STATE] }
        freshnessMs: { type: integer, minimum: 1000, maximum: 90000 }
        # uint64 đi qua JSON dưới dạng chuỗi để không mất bit trong JavaScript.
        publishedAtMonoNs: { type: string, pattern: "^(0|[1-9][0-9]{0,19})$" }
        generation: { type: string, pattern: "^(0|[1-9][0-9]{0,19})$" }
        definitionState: { type: string, enum: [MATCHED, MISMATCH, CORE_ONLY, REVISION_ONLY] }
    ProgrammingRuntimeSignalPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, producerState, activeRevisionId, observedAt, items]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        producerState: { type: string, enum: [READY, DEGRADED, UNAVAILABLE] }
        activeRevisionId: { type: [string, "null"], format: uuid }
        observedAt: { type: string, format: date-time }
        items:
          type: array
          maxItems: 512
          items: { $ref: "#/components/schemas/ProgrammingRuntimeSignal" }
    ProgrammingResource:
      type: object
      additionalProperties: true
    ProgrammingLibraryDependency:
      type: object
      additionalProperties: false
      required: [entryId, version]
      properties:
        entryId: { type: string, format: uuid }
        version: { type: string, minLength: 1, maxLength: 64 }
    ProgrammingLibraryEntry:
      type: object
      additionalProperties: false
      required: [scope, libraryRevisionId, libraryVersion, libraryState, entryId, kind, name, featureState, contentSha256, dependencies, stateLayoutKnown, stateSizeBytes]
      properties:
        scope: { type: string, enum: [SYSTEM, PROJECT] }
        libraryRevisionId: { type: string, minLength: 1, maxLength: 128 }
        libraryVersion: { type: string, minLength: 1, maxLength: 64 }
        libraryState: { type: string, enum: [DRAFT, PUBLISHED, DEPRECATED] }
        entryId: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [FUNCTION, FUNCTION_BLOCK, CONVERSION] }
        name: { type: string, minLength: 1, maxLength: 64 }
        language: { type: string, enum: [ST, FBD] }
        featureState: { type: string, enum: [AVAILABLE, REVIEW_REQUIRED] }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        # `interface` giữ nguyên chữ ký THÔ như nơi lưu: PROJECT entry do người
        # dùng nạp và backend chỉ kiểm "JSON hợp lệ + hash khớp", nên siết kiểu
        # ở đây sẽ từ chối những entry đang chạy được.
        interface: { type: object }
        # `signature` là chữ ký ĐÃ PHÂN GIẢI, chỉ có mặt khi chữ ký thô khớp
        # hình dạng canonical. Vắng field này nghĩa là "chưa đọc được chữ ký" —
        # một câu trả lời rõ ràng, khác hẳn việc mỗi client tự parse rồi mỗi nơi
        # kết luận một kiểu (T59-804 / PGM02-V22-WP-03).
        signature: { $ref: "#/components/schemas/ProgrammingLibrarySignature" }
        dependencies:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/ProgrammingLibraryDependency" }
        # `T61-101` — metadata TRÌNH BÀY. Cả ba đều OPTIONAL: hợp đồng là
        # ADDITIVE, client cũ bỏ qua field lạ và vẫn chạy. Field VẮNG nghĩa là
        # "chưa ai điền" — khác chuỗi rỗng nghĩa là "đã điền rỗng có chủ đích",
        # và PGM-04 render trường vắng thành `—` chứ không thành ô trống.
        category: { type: string, maxLength: 32 }
        description: { type: string, maxLength: 512 }
        # Băm RIÊNG phần trình bày. Nó tồn tại để không ai bị cám dỗ nhét mô tả
        # vào `contentSha256`: `contentSha256` là danh tính THỰC THI, đi vào
        # artifact và vào pin của Revision. Sửa một dòng mô tả mà đổi nó thì mọi
        # artifact đã ký thành lỗi thời.
        presentationSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        # `stateLayoutKnown=false` nghĩa là layout CHƯA BIẾT, không phải bằng 0.
        # Consumer không được coi `stateSizeBytes=0` là sự thật khi cờ này false.
        stateLayoutKnown: { type: boolean }
        stateSizeBytes: { type: integer, minimum: 0, maximum: 1048576 }
    ProgrammingLibrarySignaturePort:
      type: object
      additionalProperties: false
      required: [name, direction, dataType]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        direction: { type: string, enum: [INPUT, OUTPUT] }
        dataType: { type: string, enum: [BOOL, INT, DINT, UINT, REAL, TIME] }
    ProgrammingLibrarySignature:
      type: object
      additionalProperties: false
      required: [category, dispatch, polymorphic, allowedTypes, typedPortNames, ports]
      properties:
        category: { type: string, minLength: 1, maxLength: 32 }
        labelVi: { type: string, maxLength: 128 }
        labelEn: { type: string, maxLength: 128 }
        # `dispatch` nói compiler hiện thực entry bằng cách nào: toán tử, bảng
        # hàm, FB có state, hay KHAI TRIỂN thành chuỗi lệnh đã có (§7A.6).
        dispatch: { type: string, enum: [OPERATOR, FUNC_TABLE, FB_TYPE, EXPANSION] }
        polymorphic: { type: boolean }
        allowedTypes:
          type: array
          maxItems: 8
          items: { type: string, enum: [BOOL, INT, DINT, UINT, REAL, TIME] }
        defaultType: { type: string, enum: [BOOL, INT, DINT, UINT, REAL, TIME] }
        typedPortNames:
          type: array
          maxItems: 16
          items: { type: string, minLength: 1, maxLength: 64 }
        ports:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/ProgrammingLibrarySignaturePort" }
    ProgrammingLibraryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProgrammingLibraryEntry" }
        nextCursor: { type: [string, "null"] }
    ProgrammingLibraryUsage:
      type: object
      additionalProperties: false
      required: [sealed, draft, availability]
      properties:
        sealed: { $ref: "#/components/schemas/ProgrammingLibraryUsageScope" }
        draft: { $ref: "#/components/schemas/ProgrammingLibraryUsageScope" }
        # COMPLETE: cả hai phạm vi đo được.
        # SEALED_ONLY: chỉ phần đã niêm phong đo được.
        # UNAVAILABLE: không phạm vi nào đo được — entry SYSTEM rơi vào đây vì
        #   usage của chúng phân giải từ registry/profile lock chứ không nằm
        #   trong bảng `library_usages`.
        availability: { type: string, enum: [COMPLETE, SEALED_ONLY, UNAVAILABLE] }
    ProgrammingLibraryUsageScope:
      type: object
      additionalProperties: false
      required: [count, truncated, items]
      properties:
        count: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ProgrammingLibraryUsageItem" }
    ProgrammingLibraryUsageItem:
      type: object
      additionalProperties: false
      required: [projectId, projectName, revisionId, objectId, objectName, requiredVersion, usageKind, isActive]
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        revisionId: { type: string, format: uuid }
        objectId: { type: string, format: uuid }
        objectName: { type: string }
        requiredVersion: { type: string }
        # `INSTANCE` mang trạng thái, `CALL` thì không — hai loại có hệ quả khác
        # nhau khi đổi version, nên chúng không được gộp thành một con số.
        usageKind: { type: string, enum: [CALL, INSTANCE] }
        isActive: { type: boolean }
    ProgrammingLibraryStateLayout:
      type: object
      additionalProperties: false
      required: [version, stateSizeBytes, sha256]
      properties:
        version: { type: integer, minimum: 1, maximum: 4294967295 }
        stateSizeBytes: { type: integer, minimum: 0, maximum: 1048576 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    ProgrammingLibraryEntryRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, entryId, kind, name, language, source, interface]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        entryId: { type: string, format: uuid }
        kind: { type: string, enum: [FUNCTION, FUNCTION_BLOCK] }
        name: { type: string, minLength: 1, maxLength: 64 }
        language: { type: string, enum: [ST, FBD] }
        # featureState chỉ nhận AVAILABLE. REVIEW_REQUIRED là cờ Controls/Safety
        # của registry SYSTEM, không phải nhãn client tự dán cho POU của mình.
        featureState: { type: string, enum: [AVAILABLE] }
        source: { type: string, minLength: 1, maxLength: 65536 }
        interface: { type: object }
        dependencies:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/ProgrammingLibraryDependency" }
        # `T61-401` — metadata TRÌNH BÀY trên đường GHI, đối xứng với
        # `ProgrammingLibraryEntry.category/description` trên đường ĐỌC.
        # Cả hai OPTIONAL, nên client cũ không gửi chúng vẫn ghi được như cũ.
        #
        # Upsert này là phép GHI ĐÈ toàn phần — `source` cũng phải gửi lại đủ —
        # nên field vắng nghĩa là entry sau lần ghi KHÔNG có metadata đó, đúng
        # như mọi field optional khác của request. Không có ngữ nghĩa "giữ lại
        # giá trị cũ" riêng cho hai trường này: một trường vá tại chỗ nằm giữa
        # các trường ghi đè là chỗ người ta mất mô tả mà không hiểu vì sao.
        #
        # Sửa hai trường này KHÔNG đổi `contentSha256` (`D61-09`): danh tính
        # thực thi không được phụ thuộc vào một lần sửa chính tả.
        category: { type: string, maxLength: 32 }
        description: { type: string, maxLength: 512 }
        # Vắng mặt nghĩa là layout chưa biết. FUNCTION không được mang khối này.
        stateLayout: { $ref: "#/components/schemas/ProgrammingLibraryStateLayout" }
    ProgrammingLibraryRevisionDeprecateRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion]
      properties:
        schemaVersion: { type: string, const: "1.0" }
    ProgrammingProgramIntentRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, desiredEnabled]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        # BẮT BUỘC có mặt. Thiếu `desiredEnabled` KHÁC `desiredEnabled=false`:
        # mặc định về false sẽ biến một payload hỏng thành lệnh TẮT chương trình.
        desiredEnabled: { type: boolean }
    ProgrammingProgramRuntimeState:
      description: >
        Trạng thái vận hành của một Program theo hợp đồng D-07 (Plan 60 §4.1).
        `STARTING`/`STOPPING` CỐ Ý không có mặt: `start()`/`stop()`/`disable()`
        của scheduler đổi trạng thái ĐỒNG BỘ, TỨC THÌ — không có pha trung gian
        nào để hiển thị. Khai hai giá trị đó vào enum là mời chúng quay lại và
        làm UI kẹt vĩnh viễn ở một chuyển tiếp không hề tồn tại.
        `ACTIVE`/`STOPPED`/`ROLLED_BACK` của Core cùng chiếu về `WAITING`; phần
        bị mất khi chiếu được nói lại bằng `coreState` và `health`.
      type: string
      enum: [RUNNING, WAITING, DISABLED, FAULTED, UNKNOWN]
    ProgrammingProgramRuntimeStateSource:
      description: >
        Nguồn của số đo trên chính dòng đó. `CORE_LIVE` = đọc được từ snapshot
        này của Core. `LAST_KNOWN` = Core sống nhưng không kể tên Program này;
        giá trị hiển thị là read-back bền vững lần cuối, kèm mốc của chính nó.
        `UNAVAILABLE` = không đọc được gì, bắt buộc đi kèm
        `runtimeState = UNKNOWN` và mọi số đo `null`.
        Không có trường này thì `RUNNING` đọc từ DB (ghi lúc đẩy intent, có thể
        từ một giờ trước) trông y hệt `RUNNING` vừa đọc từ Core — và đó chính là
        lúc người vận hành cần phân biệt nhất.
      type: string
      enum: [CORE_LIVE, LAST_KNOWN, UNAVAILABLE]
    ProgrammingProgramHealth:
      description: >
        Nhãn sức khoẻ do SERVER tính theo D-04 (Plan 60 §4.2, thứ tự xét
        1 → 2 → 6 → 3 → 4 → 5 → 7). Nullable ở nơi dùng: Program `DISABLED`/
        `WAITING` không mang nhãn sức khoẻ nào, và `null` là câu trả lời hợp lệ
        chứ không phải một giá trị enum bịa thêm cho gọn. FE hiện `null` thành
        `—`, không bao giờ thành `HEALTHY`.
      type: string
      enum: [HEALTHY, DEGRADED, FAULT, UNKNOWN]
    ProgrammingProgramListItem:
      type: object
      additionalProperties: false
      # MỌI trường đều BẮT BUỘC CÓ MẶT, kể cả khi giá trị là `null` — server Go
      # cố ý không dùng `omitempty`. `null` tường minh nói "server đã xét và chưa
      # biết", còn trường VẮNG MẶT lẫn với "server đời cũ chưa có trường này".
      # Client không được suy `null` thành `0`/`false`.
      required:
        [programId, desiredEnabled, generation, updatedBy, updatedAtUtcMs,
         runtimeState, runtimeStateSource, coreState, enabled, observedAt,
         periodMs, lastExecNs, maxExecNs, missedReleaseCount,
         consecutiveMissedRelease, lastRunAtUtc, lastRunAgeMs, lane,
         lastFaultCode, lastFaultLine, faultCount, health]
      properties:
        programId: { type: string, minLength: 1, maxLength: 64 }
        # --- Ý định bền vững (`program_runtime_intents`) ---
        # `null` = Project này CHƯA TỪNG ghi intent cho Program đó (Program chỉ
        # Core biết). KHÁC HẲN `false`, vốn nghĩa là đã có người tắt nó.
        desiredEnabled: { type: [boolean, "null"] }
        # Chỉ tăng, không bao giờ lùi: Core dùng nó để biết intent nào mới hơn mà
        # KHÔNG phải tin đồng hồ tường của hai máy khác nhau.
        generation: { type: [integer, "null"], minimum: 1 }
        updatedBy: { type: [string, "null"], minLength: 1, maxLength: 128 }
        updatedAtUtcMs: { type: [integer, "null"], minimum: 0 }
        # --- Read-back (`point_snapshot` của Core) ---
        runtimeState: { $ref: "#/components/schemas/ProgrammingProgramRuntimeState" }
        runtimeStateSource: { $ref: "#/components/schemas/ProgrammingProgramRuntimeStateSource" }
        # NGUYÊN VĂN `StProgramState` của Core. Giữ lại vì `runtimeState` là phép
        # chiếu CÓ MẤT MÁT: `ACTIVE`, `STOPPED` và `ROLLED_BACK` cùng ra
        # `WAITING`, nhưng chỉ `ROLLED_BACK` mới kéo `health` xuống `DEGRADED`.
        coreState: { type: [string, "null"], minLength: 1, maxLength: 32 }
        # Cờ enable THẬT trong Core, không phải ý định. Lệch với `desiredEnabled`
        # là một sự kiện vận hành, không phải một lỗi hiển thị.
        enabled: { type: [boolean, "null"] }
        observedAt: { type: [string, "null"], format: date-time }
        # `null` (KHÔNG phải `0`) khi Core không phân giải được chu kỳ hiệu lực.
        # `0` ở cột Cycle là một số bịa, và nó bịa đúng chỗ người vận hành tin nhất.
        periodMs: { type: [integer, "null"], minimum: 1 }
        # THỜI LƯỢNG một lần chạy, KHÔNG phải mốc thời gian — mốc là `lastRunAtUtc`.
        lastExecNs: { type: [integer, "null"], minimum: 0 }
        maxExecNs: { type: [integer, "null"], minimum: 0 }
        # Bộ đếm TÍCH LUỸ từ lúc start. Không dùng nó cho `health`: một lần lỡ
        # nhịp cách đây một giờ sẽ ghim Program ở DEGRADED vĩnh viễn.
        missedReleaseCount: { type: [integer, "null"], minimum: 0 }
        # Bộ đếm LIÊN TIẾP, reset về 0 mỗi lần release đúng hạn — đây mới là thứ
        # điều 4 của công thức `health` dùng.
        consecutiveMissedRelease: { type: [integer, "null"], minimum: 0 }
        # MỐC lần chạy gần nhất — đúng thứ cột `Last Exec` cần. KHÔNG suy ra từ
        # `lastExecNs`; mốc dựng từ `lastRunMonoNs` trừ trong cùng snapshot rồi
        # quy về đồng hồ tường.
        lastRunAtUtc: { type: [string, "null"], format: date-time }
        lastRunAgeMs: { type: [integer, "null"], minimum: 0 }
        lane: { type: [integer, "null"], minimum: 0 }
        # --- LÝ DO Program hỏng, do Core cấp ---
        # Core vốn đã ghi `last_fault_code`/`last_fault_line` vào Program nhưng
        # chúng chết ở đó: không vào snapshot, không ra IPC, không tới API. Đo
        # được trên bo: một Program nằm `FAULTED` suốt hai ngày mà không nơi nào
        # nói vì sao, người vận hành chỉ thấy `coreState=FAULTED, lastExecNs=0`.
        #
        # Chuỗi RỖNG = chưa từng fault; `null` = Core không cấp được. Hai câu đó
        # khác nhau và client không được gộp.
        lastFaultCode: { type: [string, "null"], maxLength: 32 }
        lastFaultLine: { type: [integer, "null"], minimum: 0 }
        faultCount: { type: [integer, "null"], minimum: 0 }
        health:
          oneOf:
            - { $ref: "#/components/schemas/ProgrammingProgramHealth" }
            - { type: "null" }
    ProgrammingProgramsPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, projectId, runtimeStateSource, observedAt, programsTruncated, items]
      properties:
        schemaVersion: { type: string, const: "1.0" }
        projectId: { type: string, format: uuid }
        # Mức TRANG: `CORE_LIVE` khi đọc được bảng Program của Core trong lần gọi
        # này, `UNAVAILABLE` khi không. Mức dòng vẫn có thể hạ xuống
        # `LAST_KNOWN`/`UNAVAILABLE` riêng.
        runtimeStateSource: { $ref: "#/components/schemas/ProgrammingProgramRuntimeStateSource" }
        # Mốc Core chụp snapshot. `null` khi không đọc được — KHÔNG điền đồng hồ
        # của web-api vào đây, đó là mốc của một quan sát chưa xảy ra.
        observedAt: { type: [string, "null"], format: date-time }
        # `null` khi không có bảng nào để nói tới; `true` khi Core đã cắt ở trần
        # `kMaxProgramsTotal` (32) ⇒ danh sách KHÔNG đầy đủ.
        programsTruncated: { type: [boolean, "null"] }
        items:
          type: array
