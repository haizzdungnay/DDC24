      summary: Táº£i log (gzip, admin)
      responses:
        "200":
          description: OK
          content:
            application/gzip:
              schema: { type: string, format: binary }
  /bacnet/objects:
    get:
      summary: Danh sÃ¡ch object BACnet
      responses: { "200": { description: OK } }
  /alarms:
    get:
      summary: Runtime alarm list
      description: >
        Runtime alarm rows derived from ADR-013 alarm entities and ADR-014 ack lifecycle.
        This is the visible current list, not full history: active unacked alarms,
        active acked alarms, cleared-but-unacknowledged latched alarms, and future shelved alarms.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmEvent" }
  /alarms/{id}/ack:
    post:
      summary: Acknowledge alarm
      description: >
        Acknowledge one alarm entity id. If the alarm is active, status becomes acked until
        clear. If the condition already cleared but is latched unack, ack removes it from
        the visible list. Optional duration payload makes ack expire later; no body keeps
        the legacy permanent ack behavior. Unknown or already-normal ids return 404.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmActionRequest" }
      responses:
        "200":
          description: Current visible alarm list after ack.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /alarms/{id}/suppress:
    post:
      summary: Suppress alarm
      description: >
        Hide an active or manually latched alarm for a selected duration, or permanently
        until core restart. Used by the Alarm log Off action.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmActionRequest" }
      responses:
        "200":
          description: Current visible alarm list after suppress.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /alarms/{id}/return:
    post:
      summary: Return acknowledged alarm to active
      description: >
        Undo acknowledge for a still-active alarm entity id. This is only valid while
        the underlying alarm condition remains true; unknown, cleared, or already-active ids return 404.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200":
          description: Current visible alarm list after return.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /alarm-history:
    get:
      summary: Persistent alarm history
      description: >
        Reads JSONL alarm history persisted on the device. Filters are combined with AND;
        comma-separated event values are OR-ed. `limit=all` returns every matching record.
      parameters:
        - { name: limit, in: query, schema: { type: string, default: "20" } }
        - { name: text, in: query, schema: { type: string } }
        - { name: alarm, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: event, in: query, schema: { type: string }, description: "Comma-separated started,acked,returned,ended,setting_created,setting_changed,setting_deleted." }
        - { name: severity, in: query, schema: { type: string, enum: [critical, high, medium, low, info] } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Matching persistent alarm history records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmHistoryEvent" }
        "400": { $ref: "#/components/responses/Error" }
  /graph/validate:
    post:
      summary: Validate graph.json (role operator+)
      description: Cháº¡y validator theo GRAPH_SCHEMA; khÃ´ng deploy, tráº£ pass=false kÃ¨m errors náº¿u fail.
      x-rbac: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Graph" }
      responses:
        "200":
          description: Káº¿t quáº£ validate, schema khá»›p GraphValidationResult cá»§a FE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphValidationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /graph/deploy:
    post:
      summary: Validate rá»“i deploy graph.json (role admin)
      description: >
        Validate graph.json, gá»­i core build plan vÃ  Ã¡p dá»¥ng atomically náº¿u pass. Náº¿u validate/build fail,
        giá»¯ graph cÅ© vÃ  tráº£ pass=false/deployed=false kÃ¨m errors.
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Graph" }
      responses:
        "200":
          description: Káº¿t quáº£ deploy hoáº·c lá»—i validate/build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphDeployResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    PointId:
      name: id
      in: path
      required: true
      schema: { type: string, example: "UI1" }
    VirtualPointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^(VP|AV)[-_]?0*([1-9]|[1-9][0-9]|[1-3][0-9]{2}|4[0-5][0-9]|46[0-4])$"
        example: "VP1"
  responses:
    Error:
      description: Lá»—i
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error: { type: string }
              code: { type: integer }
              request_id: { type: string }
  schemas:
    Point:
      type: object
      required: [id, name, kind, value, quality, source, updatedAt]
      properties:
        id: { type: string, example: "UI-01" }
        name: { type: string, example: "Room temperature" }
        kind: { type: string, enum: [UI, AO, DO, virtual] }
        value:
          allOf:
            - $ref: "#/components/schemas/PointCommandValue"
          example: 23.5
        unit: { type: string, example: "Â°C" }
        quality: { type: string, enum: [good, uncertain, bad] }
        source: { type: string, example: "backend" }
        updatedAt: { type: string, format: date-time }
        sensorType: { type: string, example: "NTC10k" }
        raw: { type: number }
        rawUnit: { type: string }
        priority: { type: string }
        fault: { type: boolean }
        forced: { type: boolean }
        signalType: { type: string, enum: [boolean, integer, float, string, datetime] }
        writable: { type: boolean, description: "Only writable=true VP may be written through PUT /points/{id}." }
        logEnabled: { type: boolean }
        logIntervalMs: { type: integer, enum: [1000, 100, 10] }
    VirtualPointValue:
      oneOf:
        - type: number
        - type: boolean
        - type: string
    VirtualPoint:
      type: object
      required: [label, signalType, enabled, writable, logEnabled]
      description: >
        Backend-owned Virtual Point. Total capacity is 464 VP: 256 non-logged,
        128 logged at 1s, 64 logged at 100ms, and 16 diagnostic 10ms ring-buffer
        channels. String/datetime VP cannot be logged or charted.
      properties:
        id:
          type: string
          pattern: "^(VP|AV)[-_]?0*([1-9]|[1-9][0-9]|[1-3][0-9]{2}|4[0-5][0-9]|46[0-4])$"
          example: "VP1"
        label: { type: string, maxLength: 64 }
        signalType: { type: string, enum: [boolean, integer, float, string, datetime] }
        enabled: { type: boolean, default: true }
        writable: { type: boolean, default: true }
        logEnabled: { type: boolean, default: false }
        logIntervalMs: { type: integer, enum: [1000, 100, 10], nullable: true }
        retentionS: { type: integer, minimum: 0, description: "Max: 30d at 1s, 7d at 100ms, 1h at 10ms." }
        value: { $ref: "#/components/schemas/VirtualPointValue" }
        unit: { type: string, enum: ["", percent, degC, Pa, ppm], description: "Selected from the EasySet u4 Units list." }
        displayMin: { type: number, minimum: -50, maximum: 205, default: 0, description: "EasySet-style u1 Display Min metadata." }
        displayMax: { type: number, minimum: -50, maximum: 205, default: 100, description: "EasySet-style u2 Display Max metadata." }
        rangeMultiplier: { type: integer, minimum: 0, maximum: 5, default: 0, description: "EasySet-style u3 Range Multiplier metadata." }
        filterSamples: { type: integer, minimum: 0, maximum: 100, default: 3, description: "EasySet-style u5 Filter Samples metadata." }
        sensorCal: { type: number, minimum: -12.7, maximum: 12.8, default: 0, description: "EasySet-style u6 Sensor Calibration metadata." }
        mathFunction: { type: integer, minimum: 0, maximum: 3, default: 0, description: "EasySet-style u7 Math Function metadata." }
