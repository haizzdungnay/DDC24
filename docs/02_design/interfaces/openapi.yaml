openapi: 3.1.0
info:
  title: MK-DDC-24 REST API
  version: "1.0.0"
  description: >
    REST API HTTPS (TLS 1.3) cho MK-DDC-24. Cổng 8443. Auth Bearer JWT (exp 1h).
    Nguồn-chuẩn cho endpoint (D-4). Trace: SW-API-001..010, SRS §6.4.
servers:
  - url: https://{device_ip}:8443/api/v1
    variables:
      device_ip:
        default: 192.168.1.50
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Đăng nhập, trả JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [admin, operator, viewer] }
                  expires_in: { type: integer, example: 3600 }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Đăng xuất, vô hiệu token
      responses: { "200": { description: OK } }
  /points:
    get:
      summary: Danh sách tất cả I/O point + giá trị
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Point" }
  /points/{id}:
    get:
      summary: Đọc 1 point
      parameters: [ { $ref: "#/components/parameters/PointId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Point" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Ghi giá trị point (role operator+; LUÔN vào mức Local manual — client KHÔNG chọn priority)
      description: >
        Contract Freeze 2026-06-11: REST không expose BACnet priority 1..16.
        Mọi lệnh web đi vào nguồn "Local manual" (mức 2 trong 6 mức của core —
        PRODUCT_DEFINITION §13). BACnet client dùng priority array riêng qua BACnet/IP
        (kết quả vào mức 3). Gửi release=true để nhả manual (relinquish mức 2).
      parameters: [ { $ref: "#/components/parameters/PointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: number, description: "Bắt buộc trừ khi release=true" }
                release: { type: boolean, default: false, description: "true = nhả manual override" }
      responses:
        "200":
          description: Kết quả áp lệnh từ core (ghi audit log)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [accepted, overridden, rejected] }
                  applied_value: { type: number }
                  active_source: { type: string, example: "safety", description: "Nguồn priority đang thắng kênh này" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /system/status:
    get:
      summary: Trạng thái hệ thống (CPU/RAM/uptime/IOP/version)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
  /system/config:
    get:
      summary: Đọc cấu hình hiện tại (admin)
      responses: { "200": { description: OK } }
    put:
      summary: Cập nhật cấu hình (admin)
      responses: { "200": { description: OK } }
  /ota/upload:
    post:
      summary: Upload gói firmware (admin)
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses: { "202": { description: Accepted } }
  /ota/apply:
    post:
      summary: Kích hoạt OTA + reboot (admin)
      responses: { "202": { description: Accepted } }
  /ota/status:
    get:
      summary: Trạng thái + tiến độ OTA
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [idle, downloading, verifying, applying, rebooting, success, failed, rolledback] }
                  progress: { type: integer, minimum: 0, maximum: 100 }
  /logs/download:
    get:
      summary: Tải log (gzip, admin)
      responses:
        "200":
          description: OK
          content:
            application/gzip:
              schema: { type: string, format: binary }
  /bacnet/objects:
    get:
      summary: Danh sách object BACnet
      responses: { "200": { description: OK } }
  /alarms:
    get:
      summary: Danh sách alarm đang active
      responses: { "200": { description: OK } }
  /alarms/{id}/ack:
    post:
      summary: Acknowledge alarm
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: OK } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    PointId:
      name: id
      in: path
      required: true
      schema: { type: string, example: "UI1" }
  responses:
    Error:
      description: Lỗi
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error: { type: string }
              code: { type: integer }
              request_id: { type: string }
  schemas:
    Point:
      type: object
      properties:
        id: { type: string, example: "UI1" }
        type: { type: string, enum: [AI, AO, BI, BO, AV, BV, MSV] }
        value: { type: number, example: 23.5 }
        unit: { type: string, example: "°C" }
        quality: { type: string, enum: [good, uncertain, bad] }
        timestamp: { type: string, format: date-time }
        sensor_type: { type: string, example: "NTC10k" }
        fault: { type: boolean }
    SystemStatus:
      type: object
      properties:
        cpu_percent: { type: number }
        ram_percent: { type: number }
        uptime_s: { type: integer }
        versions:
          type: object
          description: Tách version từng thành phần (Contract Freeze 2026-06-11)
          properties:
            mcu_fw: { type: string, example: "1.0", description: "Từ HANDSHAKE_RESP/DIAG (iobus đọc)" }
            iobus: { type: string, example: "1.2.0" }
            core: { type: string, example: "1.1.0" }
            web: { type: string, example: "1.0.0" }
        iop:
          type: object
          description: Nguồn = mkddc-iobus (đọc từ kx_io_shm metrics)
          properties:
            status: { type: string, enum: [normal, fault, safe] }
            crc_errors: { type: integer }
            timeouts: { type: integer }
            seq_errors: { type: integer }
            last_io_resp_ms: { type: integer }
        scan:
          type: object
          description: Nguồn = mkddc-core (đọc từ kx_plc_shm)
          properties:
            count: { type: integer }
            overrun: { type: integer }
