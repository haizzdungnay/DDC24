      summary: Runtime alarm list
      x-rbac: [viewer, operator, engineer, admin]
      description: >
        Runtime alarm rows derived from ADR-013 alarm entities and ADR-014 ack lifecycle.
        This is the visible current list, not full history: active unacked alarms,
