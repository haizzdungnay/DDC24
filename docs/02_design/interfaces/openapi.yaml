openapi: 3.1.0
info:
  title: MK-DDC-24 REST API
  version: "1.4.0"
  description: >
    REST API HTTPS (TLS 1.3) cho MK-DDC-24. Cổng 8443. Auth Bearer JWT (exp 1h).
    Nguồn-chuẩn cho endpoint (D-4). Trace: SW-API-001..010, SRS §6.4.
    BE-B0 2026-06-17: bổ sung commissioning test, graph validate/deploy; WebSocket
    monitor chuẩn ở /api/v1/ws/monitor được tham chiếu bằng x-websocket.
    BE-B5 2026-06-18: Mở contract chi tiết cho cấu hình (/system/config/*) và users CRUD, password self-service.
    2026-06-18: thêm aggregate /network cho trang Network.
x-revision:
  date: "2026-06-18"
  note: "v1.4.0 thêm /network aggregate cho trang Network, map config thật."
servers:
  - url: https://{device_ip}:8443/api/v1
    variables:
      device_ip:
        default: 192.168.1.50
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Đăng nhập, trả JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [admin, operator, viewer] }
                  expires_in: { type: integer, example: 3600 }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Đăng xuất, vô hiệu token
      responses: { "200": { description: OK } }
  /points:
    get:
      summary: Danh sách tất cả I/O point + giá trị
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Point" }
  /points/{id}:
    get:
      summary: Đọc 1 point
      parameters: [ { $ref: "#/components/parameters/PointId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Point" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Ghi giá trị point (role operator+; LUÔN vào mức Local manual — client KHÔNG chọn priority)
      description: >
        Contract Freeze 2026-06-11: REST không expose BACnet priority 1..16.
        Mọi lệnh web đi vào nguồn "Local manual" (mức 2 trong 6 mức của core —
        PRODUCT_DEFINITION §13). BACnet client dùng priority array riêng qua BACnet/IP
        (kết quả vào mức 3). Gửi release=true để nhả manual (relinquish mức 2).
      parameters: [ { $ref: "#/components/parameters/PointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: number, description: "Bắt buộc trừ khi release=true" }
                release: { type: boolean, default: false, description: "true = nhả manual override" }
      responses:
        "200":
          description: Kết quả áp lệnh từ core (ghi audit log)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [accepted, overridden, rejected] }
                  applied_value: { type: number }
                  active_source: { type: string, example: "safety", description: "Nguồn priority đang thắng kênh này" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /system/status:
    get:
      summary: Trạng thái hệ thống (CPU/RAM/uptime/IOP/version)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
  /network:
    get:
      summary: Dữ liệu trang Network (viewer+)
      description: Gộp network/device/bacnet/fieldbus config và trạng thái poll tổng từ core/iobus; không sinh slave demo.
      x-rbac: [viewer, operator, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkPageData" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      summary: Cập nhật cấu hình northbound trang Network (admin)
      description: Ghi atomic `network.conf`, `device.conf`, `bacnet.conf`; preserve field không expose bởi form; fieldbus/slave chỉ đọc.
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkPageData" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /commissioning/points/{id}/test:
    post:
      summary: Test commissioning một point (role operator+)
      description: >
        Gửi lệnh test DO/AO qua mkddc-core, vào nguồn Local manual mức 2 như PUT /points/{id}.
        Dùng cho màn Commissioning; mọi lệnh phải audit log.
      x-rbac: [operator, admin]
      parameters: [ { $ref: "#/components/parameters/PointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissioningTestRequest" }
      responses:
        "200":
          description: Kết quả test từ core, schema khớp CommissioningTestResult của FE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissioningTestResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /system/config:
    get:
      summary: Đọc toàn bộ cấu hình hiện tại (gộp) (admin)
      description: Trả về object gộp các nhóm (device, network, io, safe_state, bacnet, fieldbus, time).
      x-rbac: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemConfig" }
  /system/config/device:
    get:
      summary: Đọc cấu hình device (admin)
      x-rbac: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigDevice" }
    put:
      summary: Cập nhật cấu hình device (admin)
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigDevice" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
  /system/config/network:
    get:
      summary: Đọc cấu hình network (admin)
      x-rbac: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigNetwork" }
    put:
      summary: Cập nhật cấu hình network (admin)
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigNetwork" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
  /system/config/io:
    get:
      summary: Đọc cấu hình IO (admin)
      x-rbac: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigIO" }
    put:
      summary: Cập nhật cấu hình IO (admin)
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigIO" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
  /system/config/safe-state:
    get:
      summary: Đọc cấu hình IO safe-state (admin)
      x-rbac: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSafeState" }
    put:
      summary: Cập nhật cấu hình IO safe-state (admin)
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigSafeState" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
  /system/config/bacnet:
    get:
      summary: Đọc cấu hình BACnet/IP (admin)
      x-rbac: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigBacnet" }
    put:
      summary: Cập nhật cấu hình BACnet/IP (admin)
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigBacnet" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
  /system/config/fieldbus:
    get:
      summary: Đọc cấu hình Fieldbus (Modbus RTU master) (admin)
      x-rbac: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigFieldbus" }
    put:
      summary: Cập nhật cấu hình Fieldbus (admin)
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigFieldbus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
  /system/config/time:
    get:
      summary: Đọc cấu hình Time (admin)
      x-rbac: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigTime" }
    put:
      summary: Cập nhật cấu hình Time (admin)
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigTime" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
  /users:
    get:
      summary: Danh sách user (admin)
      description: Không trả về mật khẩu (pw_bcrypt)
      x-rbac: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      summary: Tạo user (admin)
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role, password]
              properties:
                username: { type: string, minLength: 3 }
                role: { type: string, enum: [admin, operator, viewer] }
                password: { type: string, format: password, minLength: 6 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{username}:
    put:
      summary: Đổi role user (admin)
      x-rbac: [admin]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, operator, viewer] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Xóa user (admin)
      x-rbac: [admin]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Lỗi nếu là admin cuối cùng hoặc là chính mình" }
  /users/{username}/reset-password:
    post:
      summary: Reset mật khẩu user (admin)
      x-rbac: [admin]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, format: password, minLength: 6 }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /me:
    get:
      summary: Lấy thông tin user đang đăng nhập (role viewer+)
      x-rbac: [viewer, operator, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /me/change-password:
    post:
      summary: Đổi mật khẩu cá nhân (role viewer+)
      x-rbac: [viewer, operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 6 }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: "Mật khẩu cũ không đúng" }
  /history:
    get:
      summary: Historian/trend samples by point and range (viewer+)
      description: >
        Returns wide TrendSample rows matching FE shape: `{time, <pointId>: value}`.
        Query `point` accepts one id or comma-separated ids.
      x-rbac: [viewer, operator, admin]
      parameters:
        - name: point
          in: query
          required: true
          schema:
            type: string
            example: "AI-01,AI-02"
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [30m, 1h, 6h, 24h]
            example: 30m
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrendSample" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /trends/config:
    get:
      summary: Read historian/trend sampler config (admin)
      x-rbac: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendConfig" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      summary: Update historian/trend sampler config (admin)
      description: Persist trend config for mkddc-web sampler; apply mechanism is `none`.
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrendConfig" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /schedules:
    get:
      summary: Read weekly/exception schedules (viewer+)
      description: Rev A has weekly repeating schedules and exception rows; no monthly mode.
      x-rbac: [viewer, operator, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduleRow" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      summary: Update schedules (admin)
      description: Persist `schedule.conf`, then apply by `sighup-core`; core executes schedule priority level 4.
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/ScheduleRow" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /alarm-settings:
    get:
      summary: Read alarm entity settings (viewer+)
      description: >
        Returns `alarm_settings.conf` as the ADR-013 entity-list model. Legacy per-point rows are
        migrated by the Phase 2 backend before being returned.
      x-rbac: [viewer, operator, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 64
                items: { $ref: "#/components/schemas/AlarmSetting" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace alarm entity settings (admin)
      description: >
        Persist `alarm_settings.conf` using ADR-013 entity-list schema. Current web/backend stores
        the file; Phase 2/3 core work must add `alarm_settings.conf` boot/SIGHUP loading and
        per-source evaluation before this contract becomes runtime-active. At most 64 internal
        alarm entities are accepted, and at most 8 enabled entities may set `publishBacnet=true`
        because BACnet Event Enrollment capacity is 8.
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 64
              items: { $ref: "#/components/schemas/AlarmSetting" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPutResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /ota/upload:
    post:
      summary: Upload gói firmware (admin)
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses: { "202": { description: Accepted } }
  /ota/apply:
    post:
      summary: Kích hoạt OTA + reboot (admin)
      responses: { "202": { description: Accepted } }
  /ota/status:
    get:
      summary: Trạng thái + tiến độ OTA
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [idle, downloading, verifying, applying, rebooting, success, failed, rolledback] }
                  progress: { type: integer, minimum: 0, maximum: 100 }
  /logs/download:
    get:
      summary: Tải log (gzip, admin)
      responses:
        "200":
          description: OK
          content:
            application/gzip:
              schema: { type: string, format: binary }
  /bacnet/objects:
    get:
      summary: Danh sách object BACnet
      responses: { "200": { description: OK } }
  /alarms:
    get:
      summary: Runtime alarm list
      description: >
        Runtime alarm rows derived from ADR-013 alarm entities and ADR-014 ack lifecycle.
        This is the visible current list, not full history: active unacked alarms,
        active acked alarms, cleared-but-unacknowledged latched alarms, and future shelved alarms.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmEvent" }
  /alarms/{id}/ack:
    post:
      summary: Acknowledge alarm
      description: >
        Acknowledge one alarm entity id. If the alarm is active, status becomes acked until
        clear. If the condition already cleared but is latched unack, ack removes it from
        the visible list. Unknown or already-normal ids return 404.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200":
          description: Current visible alarm list after ack.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /alarms/{id}/return:
    post:
      summary: Return acknowledged alarm to active
      description: >
        Undo acknowledge for a still-active alarm entity id. This is only valid while
        the underlying alarm condition remains true; unknown, cleared, or already-active ids return 404.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200":
          description: Current visible alarm list after return.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /alarm-history:
    get:
      summary: Persistent alarm history
      description: >
        Reads JSONL alarm history persisted on the device. Filters are combined with AND;
        comma-separated event values are OR-ed. `limit=all` returns every matching record.
      parameters:
        - { name: limit, in: query, schema: { type: string, default: "20" } }
        - { name: text, in: query, schema: { type: string } }
        - { name: alarm, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: event, in: query, schema: { type: string }, description: "Comma-separated started,acked,returned,ended,setting_created,setting_changed,setting_deleted." }
        - { name: severity, in: query, schema: { type: string, enum: [critical, high, medium, low, info] } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Matching persistent alarm history records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmHistoryEvent" }
        "400": { $ref: "#/components/responses/Error" }
  /graph/validate:
    post:
      summary: Validate graph.json (role operator+)
      description: Chạy validator theo GRAPH_SCHEMA; không deploy, trả pass=false kèm errors nếu fail.
      x-rbac: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Graph" }
      responses:
        "200":
          description: Kết quả validate, schema khớp GraphValidationResult của FE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphValidationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /graph/deploy:
    post:
      summary: Validate rồi deploy graph.json (role admin)
      description: >
        Validate graph.json, gửi core build plan và áp dụng atomically nếu pass. Nếu validate/build fail,
        giữ graph cũ và trả pass=false/deployed=false kèm errors.
      x-rbac: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Graph" }
      responses:
        "200":
          description: Kết quả deploy hoặc lỗi validate/build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphDeployResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    PointId:
      name: id
      in: path
      required: true
      schema: { type: string, example: "UI1" }
  responses:
    Error:
      description: Lỗi
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error: { type: string }
              code: { type: integer }
              request_id: { type: string }
  schemas:
    Point:
      type: object
      properties:
        id: { type: string, example: "UI1" }
        type: { type: string, enum: [AI, AO, BI, BO, AV, BV, MSV] }
        value: { type: number, example: 23.5 }
        unit: { type: string, example: "°C" }
        quality: { type: string, enum: [good, uncertain, bad] }
        timestamp: { type: string, format: date-time }
        sensor_type: { type: string, example: "NTC10k" }
        fault: { type: boolean }
    SystemStatus:
      type: object
      properties:
        cpu_percent: { type: number }
        ram_percent: { type: number }
        uptime_s: { type: integer }
        versions:
          type: object
          description: Tách version từng thành phần (Contract Freeze 2026-06-11)
          properties:
            mcu_fw: { type: string, example: "1.0", description: "Từ HANDSHAKE_RESP/DIAG (iobus đọc)" }
            iobus: { type: string, example: "1.2.0" }
            core: { type: string, example: "1.1.0" }
            web: { type: string, example: "1.0.0" }
        iop:
          type: object
          description: Nguồn = mkddc-iobus (đọc từ kx_io_shm metrics)
          properties:
            status: { type: string, enum: [normal, fault, safe] }
            crc_errors: { type: integer }
            timeouts: { type: integer }
            seq_errors: { type: integer }
            last_io_resp_ms: { type: integer }
        scan:
          type: object
          description: Nguồn = mkddc-core (đọc từ kx_plc_shm)
          properties:
            count: { type: integer }
            overrun: { type: integer }
    PointCommandValue:
      oneOf:
        - type: number
        - type: boolean
    CommissioningTestRequest:
      type: object
      required: [value]
      properties:
        value: { $ref: "#/components/schemas/PointCommandValue" }
    CommissioningTestResult:
      type: object
      required: [result, pointId, message]
      properties:
        result: { type: string, enum: [passed, failed, running] }
        pointId: { type: string, example: "DO1" }
        appliedValue: { $ref: "#/components/schemas/PointCommandValue" }
        message: { type: string, example: "Test accepted" }
        scanMs: { type: number, example: 12 }
    GraphValidationError:
      type: object
      required: [path, message, severity]
      properties:
        path: { type: string, example: "nodes[3].params.limit_hi" }
        message: { type: string }
        severity: { type: string, enum: [error, warn] }
    GraphValidationResult:
      type: object
      required: [pass, errors]
      properties:
        pass: { type: boolean }
        errors:
          type: array
          items: { $ref: "#/components/schemas/GraphValidationError" }
    GraphDeployResult:
      type: object
      required: [pass, deployed, errors]
      properties:
        pass: { type: boolean, description: "Kết quả validate trước deploy" }
        deployed: { type: boolean, description: "true nếu graph mới đã áp dụng atomically" }
        message: { type: string }
        activeRev:
          oneOf:
            - type: integer
            - type: string
        errors:
          type: array
          items: { $ref: "#/components/schemas/GraphValidationError" }
    GraphPort:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { type: string, enum: [float, bool, int, string] }
    GraphPortRef:
      oneOf:
        - type: string
        - $ref: "#/components/schemas/GraphPort"
    GraphNode:
      type: object
      required: [id, type]
      additionalProperties: true
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
        type: { type: string }
        ports:
          type: object
          properties:
            inputs:
              type: array
              items: { $ref: "#/components/schemas/GraphPortRef" }
            outputs:
              type: array
              items: { $ref: "#/components/schemas/GraphPortRef" }
        inputs:
          type: array
          items: { $ref: "#/components/schemas/GraphPortRef" }
        outputs:
          type: array
          items: { $ref: "#/components/schemas/GraphPortRef" }
        params: { type: object, additionalProperties: true }
        config: { type: object, additionalProperties: true }
        limit:
          type: object
          additionalProperties: true
          properties:
            min: { type: number }
            max: { type: number }
            limit_lo: { type: number }
            limit_hi: { type: number }
        fallback: {}
        safeState: {}
        safe_state: {}
        power_on: { type: object, additionalProperties: true }
    GraphLink:
      type: object
      required: [from, to]
      properties:
        from: { type: string, example: "pid1.out" }
        to: { type: string, example: "ao1.in" }
    GraphIoPoint:
      type: object
      required: [node]
      additionalProperties: true
      properties:
        node: { type: string }
        channel: { type: integer }
        sensor: { type: string }
        unit: { type: string }
        mode: { type: string }
        limit_lo: { type: number }
        limit_hi: { type: number }
        fallback: {}
        safeState: {}
        safe_state: {}
    GraphModbusPoint:
      type: object
      required: [node]
      additionalProperties: true
      properties:
        node: { type: string }
        fc: { type: integer }
        addr: { type: integer }
        type: { type: string }
        scale: { type: number }
        fallback: {}
        safeState: {}
        safe_state: {}
    GraphModbusDevice:
      type: object
      additionalProperties: true
      properties:
        bus: { type: integer }
        baud: { type: integer }
        slave: { type: integer }
        host: { type: string }
        unit: { type: integer }
        poll_ms: { type: integer }
        points:
          type: array
          items: { $ref: "#/components/schemas/GraphModbusPoint" }
    Graph:
      type: object
      required: [schema_version, device, io_map, nodes, links]
      properties:
        schema_version: { type: string, example: "1.0" }
        device:
          type: object
          required: [bacnet_device_id, name, scan_ms]
          properties:
            bacnet_device_id:
              oneOf:
                - type: integer
                - type: string
            name: { type: string }
            scan_ms: { type: integer, minimum: 500 }
        io_map:
          type: object
          properties:
            ai:
              type: array
              items: { $ref: "#/components/schemas/GraphIoPoint" }
            ao:
              type: array
              items: { $ref: "#/components/schemas/GraphIoPoint" }
            di:
              type: array
              items: { $ref: "#/components/schemas/GraphIoPoint" }
            do:
              type: array
              items: { $ref: "#/components/schemas/GraphIoPoint" }
        modbus:
          type: object
          properties:
            rtu:
              type: array
              items: { $ref: "#/components/schemas/GraphModbusDevice" }
            tcp:
              type: array
              items: { $ref: "#/components/schemas/GraphModbusDevice" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/GraphNode" }
        links:
          type: array
          items: { $ref: "#/components/schemas/GraphLink" }
        meta: { type: object, additionalProperties: true }
    SystemConfig:
      type: object
      properties:
        device: { $ref: "#/components/schemas/ConfigDevice" }
        network: { $ref: "#/components/schemas/ConfigNetwork" }
        io: { $ref: "#/components/schemas/ConfigIO" }
        safe_state: { $ref: "#/components/schemas/ConfigSafeState" }
        bacnet: { $ref: "#/components/schemas/ConfigBacnet" }
        fieldbus: { $ref: "#/components/schemas/ConfigFieldbus" }
        time: { $ref: "#/components/schemas/ConfigTime" }
    NetworkPageData:
      type: object
      required: [northbound, southbound]
      properties:
        northbound: { $ref: "#/components/schemas/NetworkPageConfig" }
        southbound:
          type: array
          items: { $ref: "#/components/schemas/NetworkSlave" }
    NetworkPageConfig:
      type: object
      required: [deviceName, ip, dhcp, wifiEnabled, subnet, gateway, bacnetDeviceId, bacnetDeviceName, bacnetPort, bmsLink]
      properties:
        deviceName: { type: string }
        ip: { type: string, format: ipv4 }
        dhcp: { type: boolean }
        wifiEnabled: { type: boolean }
        subnet: { type: string, format: ipv4 }
        gateway: { type: string, format: ipv4 }
        bacnetDeviceId: { type: string }
        bacnetDeviceName: { type: string }
        bacnetPort: { type: integer, minimum: 1, maximum: 65535 }
        bmsLink: { type: string, enum: [online, offline] }
    NetworkSlave:
      type: object
      required: [address, name, profile, baudRate, pollState, errorRate, lastPollMs]
      properties:
        address: { type: integer, minimum: 1, maximum: 247 }
        name: { type: string }
        profile: { type: string }
        baudRate: { type: integer }
        pollState: { type: string, enum: [online, degraded, offline] }
        errorRate: { type: number }
        lastPollMs: { type: integer }
    ConfigDevice:
      type: object
      required: [device_id, device_name]
      properties:
        device_id: { type: integer }
        device_name: { type: string }
        description: { type: string }
        location: { type: string }
    ConfigNetwork:
      type: object
      properties:
        eth: { type: object, additionalProperties: true }
        wifi: { type: object, additionalProperties: true }
        hostname: { type: string }
    ConfigIO:
      type: object
      properties:
        ui: { type: array, items: { type: object, additionalProperties: true } }
        ao: { type: array, items: { type: object, additionalProperties: true } }
    ConfigSafeState:
      type: object
      properties:
        ao: { type: array, items: { type: object, additionalProperties: true } }
        do: { type: array, items: { type: object, additionalProperties: true } }
    ConfigBacnet:
      type: object
      properties:
        bip: { type: object, additionalProperties: true }
    ConfigFieldbus:
      type: object
      properties:
        rs485: { type: object, additionalProperties: true }
        poll_default_ms: { type: integer }
        slaves: { type: array, items: { type: object, additionalProperties: true } }
    ConfigTime:
      type: object
      properties:
        timezone: { type: string }
        ntp_enabled: { type: boolean }
        ntp_servers: { type: array, items: { type: string } }
        system_time: { type: string, format: date-time, description: "Cho phép set giờ thủ công" }
    TrendSample:
      type: object
      required: [time]
      description: "Wide FE TrendSample: `{time, AI-01: 23.4}`; extra keys are series/point ids."
      properties:
        time: { type: string, format: date-time }
      additionalProperties:
        oneOf:
          - type: number
          - type: string
    TrendConfig:
      type: object
      required: [pointIds, intervalS, retentionRecords]
      properties:
        enabled: { type: boolean, default: true }
        pointIds:
          type: array
          description: Points logged by the mkddc-web sampler.
          items: { type: string }
          example: ["AI-01", "AI-02", "AO-01"]
        intervalS:
          type: integer
          minimum: 10
          maximum: 300
          default: 30
          description: "Sampler interval in seconds; default 30s, configurable 10..300s for 30m/1h/6h/24h UI ranges."
        retentionRecords:
          type: integer
          minimum: 1000
          default: 2880
          description: "Minimum retained samples per point/log; default 2880 (~24h at 30s), never below 1000."
    ScheduleCell:
      type: object
      required: [day, value, start, end]
      properties:
        day: { type: string, example: "T2" }
        value: { type: string, enum: ["ON", "OFF", "OPEN", "CLOSE"] }
        start: { type: string, example: "08:00" }
        end: { type: string, example: "17:00" }
    ScheduleRow:
      type: object
      required: [id, label, cells]
      properties:
        id: { type: string, example: "SCH-01" }
        label: { type: string, example: "Weekly Template" }
        cells:
          type: array
          items: { $ref: "#/components/schemas/ScheduleCell" }
    AlarmSetting:
      type: object
      required: [id, label, enabled, alarmType, sources, priority, delayS, params]
      description: >
        ADR-013 alarm entity config. Multi-source semantics are per-source evaluation with entity
        state = OR. ACTIVE alarm types are 0, 1, and 3; types 2 and 4..7 are documented for
        EasySet parity but must stay disabled until core hooks land.
      properties:
        id:
          type: string
          pattern: "^ALM-[A-Za-z0-9_-]+$"
          maxLength: 64
          example: "ALM-001"
        label: { type: string, example: "Room temperature" }
        enabled: { type: boolean }
        alarmType: { $ref: "#/components/schemas/AlarmType" }
        sources:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/AlarmSourceRef" }
        delayS:
          type: number
          minimum: 0
          description: Delay before asserting the alarm; maps to AlarmDelay on ACTIVE graph paths.
        priority: { type: string, enum: [low, medium, high, critical] }
        publishBacnet:
          type: boolean
          default: false
          description: At most 8 enabled alarm entities may publish through BACnet Event Enrollment.
        notificationClass:
          type: integer
          minimum: 1
          maximum: 4
          description: BACnet Notification Class when publishBacnet=true.
        params:
          oneOf:
            - { $ref: "#/components/schemas/AlarmDisabledParams" }
            - { $ref: "#/components/schemas/AlarmThresholdParams" }
            - { $ref: "#/components/schemas/AlarmSetpointDeviationParams" }
            - { $ref: "#/components/schemas/AlarmRuntimeParams" }
            - { $ref: "#/components/schemas/AlarmSuperviseStateParams" }
            - { $ref: "#/components/schemas/AlarmSuperviseAnalogParams" }
            - { $ref: "#/components/schemas/AlarmPiSequenceParams" }
    AlarmType:
      type: integer
      enum: [0, 1, 2, 3, 4, 5, 6, 7]
      description: >
        0 disabled (ACTIVE no-op), 1 high_low_input (ACTIVE: AlarmHigh/AlarmLow+AlarmDelay),
        2 setpoint_deviation (DEFERRED), 3 runtime_hours (ACTIVE: RuntimeCounter.alarm),
        4 fan_state_supervision (DEFERRED), 5 digital_output_supervision (DEFERRED),
        6 analog_output_supervision (DEFERRED), 7 pi_sequence_supervision (DEFERRED).
    AlarmSourceRef:
      type: object
      required: [kind, channel, pointId]
      properties:
        kind: { type: string, enum: [UI, AO, DO] }
        channel:
          type: integer
          minimum: 1
          maximum: 16
          description: UI 1..16, AO 1..4, DO 1..4; kind-specific max is validated by backend.
        pointId:
          type: string
          pattern: "^(UI|AO|DO)-[0-9]{2}$"
          example: "UI-01"
    AlarmDisabledParams:
      type: object
      maxProperties: 0
      description: alarmType=0.
    AlarmThresholdParams:
      type: object
      required: [hh, h, l, ll]
      description: alarmType=1. Backend enforces hh >= h >= l >= ll when enabled.
      properties:
        hh: { type: number }
        h: { type: number }
        l: { type: number }
        ll: { type: number }
        hysteresis: { type: number, minimum: 0 }
    AlarmSetpointDeviationParams:
      type: object
      required: [setpoint, deviationHigh, deviationLow]
      description: alarmType=2, DEFERRED until core deviation hook exists.
      properties:
        setpoint: { type: number }
        deviationHigh: { type: number, minimum: 0 }
        deviationLow: { type: number, minimum: 0 }
    AlarmRuntimeParams:
      type: object
      required: [runtimeHours]
      description: alarmType=3. Maps to RuntimeCounter maint_hours.
      properties:
        runtimeHours: { type: number, minimum: 0 }
    AlarmSuperviseStateParams:
      type: object
      required: [expectedState]
      description: alarmType=4 or 5, DEFERRED until DO/fan supervision hook exists.
      properties:
        expectedState: { type: boolean }
    AlarmSuperviseAnalogParams:
      type: object
      required: [expectedValue, tolerance]
      description: alarmType=6, DEFERRED until AO supervision hook exists.
      properties:
        expectedValue: { type: number }
        tolerance: { type: number, minimum: 0 }
    AlarmPiSequenceParams:
      type: object
      required: [sequence]
      description: alarmType=7, DEFERRED until PI sequence supervision hook exists.
      properties:
        sequence:
          type: string
          maxLength: 64
    AlarmEvent:
      type: object
      description: >
        Visible runtime alarm row from ADR-014. `status=active` means condition true and not acked;
        `acked` means condition true and acknowledged; `unack` means condition cleared before
        acknowledgement and remains latched; `shelved` is reserved for a future phase.
      required: [id, time, severity, status, message, source, value, detail]
      properties:
        id: { type: string, description: "Alarm entity id used by /alarms/{id}/ack.", example: "ALM-001" }
        time: { type: string, format: date-time, description: "Occurrence first-active timestamp from core wall clock." }
        severity: { type: string, enum: [critical, high, medium, low, info], description: "Mapped from alarm priority; info is reserved for non-entity system alarms." }
        status: { type: string, enum: [active, unack, acked, cleared, shelved] }
        message: { type: string, description: "Display label, normally the alarm entity label." }
        source: { type: string, description: "Display source from the core alarm event." }
        value: { type: string, description: "Trigger/source value formatted for display." }
        triggerLevel: { type: string, enum: [HH, H, L, LL, RUNTIME], description: "Threshold bucket that tripped the alarm, if known." }
        threshold: { type: string, description: "Threshold value formatted for display, paired with triggerLevel." }
        detail: { type: string, description: "Human-readable condition detail derived by web from core protocol fields." }
        active: { type: boolean, description: "True while the underlying condition is still present, including acked active alarms." }
        returnable: { type: boolean, description: "True when this row is known by core and an acked active alarm can be returned to active; false for history-only fallback rows." }
    AlarmHistoryEvent:
      type: object
      required: [eventId, time, event]
      properties:
        eventId: { type: string }
        time: { type: string, format: date-time }
        event: { type: string, enum: [started, acked, returned, ended, setting_created, setting_changed, setting_deleted] }
        alarmId: { type: string }
        user: { type: string }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        status: { type: string }
        message: { type: string }
        source: { type: string }
        value: { type: string }
        detail: { type: string }
        triggerLevel: { type: string, enum: [HH, H, L, LL, RUNTIME] }
        threshold: { type: string }
        active: { type: boolean }
        before: { $ref: "#/components/schemas/AlarmSetting" }
        after: { $ref: "#/components/schemas/AlarmSetting" }
    ConfigPutResult:
      type: object
      required: [result, applied, reload]
      description: "Ánh xạ SIGHUP/Restart: safe-state->sighup-core; device & io->sighup-iobus; bacnet & fieldbus->restart-iobus; network & time->system; (users->none, xử lý riêng ở /users)."
      properties:
        result: { type: string, enum: [success, failed, accepted, rejected] }
        applied: { type: boolean }
        reload: { type: string, enum: [sighup-core, sighup-iobus, restart-iobus, system, none] }
        warnings: { type: array, items: { type: string } }
    User:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
