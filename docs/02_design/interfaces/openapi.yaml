        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: event, in: query, schema: { type: string }, description: "Comma-separated started,acked,returned,ended,setting_created,setting_changed,setting_deleted." }
        - { name: severity, in: query, schema: { type: string, enum: [critical, high, medium, low, info] } }
