  /alarms/{id}/ack:
    post:
      summary: Acknowledge alarm
      x-rbac: [operator, engineer, admin]
      description: >
        Acknowledge one alarm entity id. If the alarm is active, status becomes acked until
        clear. If the condition already cleared but is latched unack, ack removes it from
        the visible list. Optional duration payload makes ack expire later; no body keeps
        the legacy permanent ack behavior. Unknown or already-normal ids return 404.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
