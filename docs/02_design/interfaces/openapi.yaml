        Adapter strict/bounded tới `mkddc-netcfg`. `validate`/`stage` yêu cầu candidate;
        `apply`/`confirm`/`rollback` yêu cầu transactionId. Response `rejected` vẫn trả HTTP 200
        để giữ đầy đủ reasonCode/state authoritative; lỗi adapter/socket hoặc authority response
         không hợp đồng trả 502/503. DNS mutation chỉ được gửi sau status-preflight có capability
