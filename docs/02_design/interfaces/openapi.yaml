components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    wsToken: { type: apiKey, in: query, name: token }
  parameters:
    PointId:
      name: id
      in: path
      required: true
      schema: { type: string, example: "UI1" }
    VirtualPointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^(VP|AV)[-_]?0*([1-9]|[1-9][0-9]|[1-3][0-9]{2}|4[0-5][0-9]|46[0-4])$"
        example: "VP1"
  responses:
    Error:
      description: Lá»—i
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error: { type: string }
              code: { type: integer }
              request_id: { type: string }
              details:
                type: array
                items: { $ref: "#/components/schemas/ValidationDetail" }
  schemas:
    ValidationDetail:
      type: object
      required: [path, reason]
      properties:
        path: { type: string, example: "items[2].tag" }
        reason:
          type: string
          enum:
            - point_tag_invalid
            - point_tag_reserved
            - point_tag_conflict
            - point_name_invalid
            - point_name_conflict
            - point_namespace_conflicted
            - point_channel_conflict
            - config_conflict
            - historian_policy_invalid
            - historian_interval_invalid
            - historian_retention_invalid
            - historian_start_in_past
            - historian_generation_conflict
            - historian_capacity_exceeded
            - historian_storage_unavailable
            - resolution_unavailable
            - historian_unavailable
        message: { type: string }
        pointId: { type: string, example: "VP3" }
        conflictPointId: { type: string, example: "UI-01" }
        conflictPath: { type: string, example: "ui[0].tag" }
        tag: { type: string, example: "fan 1" }
        name: { type: string, example: "Virtual Point" }
    PointTag:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9][A-Za-z0-9 _.-]{0,63}$"
      description: >
        Canonical display technical tag. Backend trims/collapses ASCII spaces and compares
        ASCII-lower keys across UI/AO/DO/all VP including disabled VP. Canonical ID families
        are reserved for their owning point.
    PointConfigPatch:
      type: object
      minProperties: 1
      properties:
        tag: { $ref: "#/components/schemas/PointTag" }
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Canonical display name/label. Backend trims/collapses whitespace, rejects control
            characters and compares Unicode-lower keys in a namespace independent from PointTag.
    Point:
      type: object
      required: [id, tag, name, kind, value, quality, source, updatedAt]
      properties:
        id: { type: string, example: "UI-01", description: "Stable canonical runtime identity." }
        tag: { $ref: "#/components/schemas/PointTag" }
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: "Room temperature"
          description: >
            Display name; separate from technical tag and globally unique within the independent
            UI/AO/DO/VP display-name namespace after backend canonicalization.
        kind: { type: string, enum: [UI, AO, DO, virtual] }
        value:
          allOf:
            - $ref: "#/components/schemas/PointCommandValue"
          example: 23.5
        unit: { type: string, example: "Â°C" }
        quality: { type: string, enum: [good, uncertain, bad] }
        source: { type: string, example: "backend" }
        updatedAt: { type: string, format: date-time }
        sensorType: { type: string, example: "NTC10k" }
        raw: { type: number }
        rawUnit: { type: string }
        priority: { type: string }
        fault: { type: boolean }
        forced: { type: boolean }
        signalType: { type: string, enum: [boolean, integer, float, string, datetime] }
        writable: { type: boolean, description: "Only writable=true VP may be written through PUT /points/{id}." }
        logEnabled: { type: boolean }
        logIntervalMs: { type: integer, enum: [1000, 100, 10] }
    VirtualPointValue:
      oneOf:
        - type: number
        - type: boolean
        - type: string
    VirtualPoint:
      type: object
      required: [tag, label, signalType, enabled, writable, logEnabled]
      description: >
        Backend-owned Virtual Point. Total capacity is 464 VP: 256 non-logged,
        128 logged at 1s, 64 logged at 100ms, and 16 diagnostic 10ms ring-buffer
        channels. String/datetime VP cannot be logged or charted.
      properties:
        id:
          type: string
          pattern: "^(VP|AV)[-_]?0*([1-9]|[1-9][0-9]|[1-3][0-9]{2}|4[0-5][0-9]|46[0-4])$"
          example: "VP1"
        tag: { $ref: "#/components/schemas/PointTag" }
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Display label; separate from technical tag and globally unique in the independent
            UI/AO/DO/VP display-name namespace.
        signalType: { type: string, enum: [boolean, integer, float, string, datetime] }
        enabled: { type: boolean, default: true }
        writable: { type: boolean, default: true }
        logEnabled: { type: boolean, default: false }
        logIntervalMs: { type: integer, enum: [1000, 100, 10], nullable: true }
        retentionS: { type: integer, minimum: 0, description: "Max: 30d at 1s, 7d at 100ms, 1h at 10ms." }
        value: { $ref: "#/components/schemas/VirtualPointValue" }
        unit: { type: string, enum: ["", percent, degC, Pa, ppm], description: "Selected from the EasySet u4 Units list." }
        displayMin: { type: number, minimum: -50, maximum: 205, default: 0, description: "EasySet-style u1 Display Min metadata." }
        displayMax: { type: number, minimum: -50, maximum: 205, default: 100, description: "EasySet-style u2 Display Max metadata." }
        rangeMultiplier: { type: integer, minimum: 0, maximum: 5, default: 0, description: "EasySet-style u3 Range Multiplier metadata." }
        filterSamples: { type: integer, minimum: 0, maximum: 100, default: 3, description: "EasySet-style u5 Filter Samples metadata." }
        sensorCal: { type: number, minimum: -12.7, maximum: 12.8, default: 0, description: "EasySet-style u6 Sensor Calibration metadata." }
        mathFunction: { type: integer, minimum: 0, maximum: 3, default: 0, description: "EasySet-style u7 Math Function metadata." }
        note: { type: string }
    SystemStatus:
      type: object
      properties:
        cpu_percent: { type: number }
        ram_percent: { type: number }
        uptime_s: { type: integer }
        versions:
          type: object
