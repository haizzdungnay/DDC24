  <rect x="28" y="890" width="1384" height="34" rx="6" fill="#E5E6E8" stroke="#636970"/>
  <text x="44" y="905" font-size="10" fill="#1C1F23"><tspan font-weight="700">Giả định lập kế hoạch:</tspan> 1 BE, 1 FE, 1,5 Core/Compiler, 0,5 Architect, 0,5 QA toàn thời gian; FW và HW theo nguồn lực riêng. Đổi giả định thì lịch đổi theo.</text>
  <text x="44" y="919" font-size="10" fill="#1C1F23">Thời lượng phải được ước lượng lại khi decision thay đổi capacity, FBD, thư viện, TLS hoặc phần cứng. Không dùng biểu đồ này làm deadline trước khi duyệt nguồn lực và lịch board.</text>
