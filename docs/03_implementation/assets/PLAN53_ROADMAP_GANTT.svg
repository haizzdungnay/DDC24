<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>Plan 53 — Biểu đồ roadmap triển khai Programming MK-DDC-24</title>
  <desc>Sơ đồ Gantt theo tuần tương đối T+1..T+22 từ khi khởi động formal authority review P0-A cho bảy pha P0..P6, bảy cổng kỹ thuật G0..G6 và ba cổng quyền hạn. Thời lượng là giả định lập kế hoạch, không phải cam kết lịch.</desc>

  <defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L8 4 L0 8 z" fill="#CC1F28"/></marker></defs>
  <rect width="1440" height="940" fill="#C8CCD0"/>

  <text x="28" y="38" font-size="19" font-weight="700" fill="#1C1F23">Roadmap triển khai Programming MK-DDC-24 — PLAN-PROG-053</text>
  <text x="28" y="60" font-size="12" fill="#4A4F55">Trục <tspan font-weight="700">T+n</tspan> tính từ khi khởi động formal authority review P0-A trên candidate đã pin. Gate trễ thì mốc downstream trượt tương ứng.</text>

