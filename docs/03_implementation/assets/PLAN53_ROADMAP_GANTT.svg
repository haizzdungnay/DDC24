  <text x="28" y="702" font-size="11" fill="#1C1F23">Đường găng phần cứng chạy <tspan font-weight="700" fill="#826500">song song từ T+1</tspan>. Nếu để tới T+13 mới bắt đầu, dự án đứng chờ phần cứng ở G6.</text>
  <text x="28" y="722" font-size="11" fill="#1C1F23">Mutation của FE (S5-C trở đi) <tspan font-weight="700">không</tspan> được nối trước khi contract BE/Core và hành vi lỗi tồn tại thật, tức không sớm hơn G3.</text>

