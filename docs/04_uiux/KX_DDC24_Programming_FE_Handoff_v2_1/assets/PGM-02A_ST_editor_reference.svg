<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" fill="#cbd5e1" role="img" aria-labelledby="title desc">
  <title id="title">PGM-02A ST Editor Target reference</title>
  <desc id="desc">ST editor desktop layout với Quick Library, Inspector, diagnostics, mode safety và sáu trạng thái loading, error, permission, unknown, stale, offline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#15233d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
      .title{font-size:22px;font-weight:750;fill:#f8fafc}
      .h2{font-size:14px;font-weight:700;fill:#e2e8f0}
      .label{font-size:12px;font-weight:650;fill:#cbd5e1}
      .small{font-size:11px;fill:#a8b5c8}
      .tiny{font-size:10px;fill:#94a3b8}
      .code{font-size:13px;fill:#d5dfed}
      .panel{fill:#111c2f;stroke:#334155;stroke-width:1}
      .panel2{fill:#0b1424;stroke:#253651;stroke-width:1}
      .line{stroke:#334155;stroke-width:1}
      .focus{fill:#102c43;stroke:#38bdf8;stroke-width:1.5}
      .pill{fill:#1d293d;stroke:#475569}
      .safe{fill:#0e2925;stroke:#34d399}
      .warn{fill:#352812;stroke:#fbbf24}
      .danger{fill:#341924;stroke:#fb7185}
      .muted{fill:#182337;stroke:#475569}
    </style>
  </defs>

  <rect width="1680" height="1080" fill="#0b1527"/>
  <text x="24" y="26" class="ui small">PGM-02A · TARGET v2.2 · DỮ LIỆU MINH HỌA, KHÔNG PHẢI BẰNG CHỨNG RUNTIME</text>

  <g filter="url(#shadow)">
    <rect x="20" y="40" width="1640" height="790" rx="18" fill="#08101d" stroke="#475569"/>
  </g>
  <rect x="20" y="40" width="1640" height="64" rx="18" fill="#111e33"/>
  <rect x="20" y="88" width="1640" height="16" fill="#111e33"/>
  <text x="44" y="79" class="ui title">ST Editor · AHU_SUPPLY</text>
  <text x="354" y="78" class="ui small">Foxlinx Tower / AHU-02</text>
  <rect x="1014" y="55" width="76" height="34" rx="8" class="focus"/>
  <text x="1037" y="77" class="ui label" fill="#7dd3fc">EDIT</text>
  <rect x="1098" y="55" width="102" height="34" rx="8" class="pill"/>
  <text x="1118" y="77" class="ui label">SIMULATE</text>
  <rect x="1208" y="55" width="76" height="34" rx="8" class="pill"/>
  <text x="1230" y="77" class="ui label">LIVE</text>
  <rect x="1298" y="55" width="154" height="34" rx="8" class="safe"/>
  <text x="1315" y="76" class="ui small" fill="#a7f3d0">● Saved · Draft r17</text>
  <rect x="1462" y="55" width="174" height="34" rx="8" class="muted"/>
  <text x="1479" y="76" class="ui small">Admin · Core online</text>

  <!-- Context and safety -->
  <rect x="36" y="116" width="1608" height="50" rx="9" class="panel"/>
  <text x="52" y="137" class="ui tiny">DOCUMENT</text>
  <text x="52" y="156" class="ui label">Saved Draft r17 · objectId …92ad</text>
  <line x1="292" y1="127" x2="292" y2="156" class="line"/>
  <text x="310" y="137" class="ui tiny">ACTIVE / RUNTIME</text>
  <text x="310" y="156" class="ui label">r15 · Running · không overlay trong EDIT</text>
  <rect x="750" y="126" width="876" height="30" rx="7" class="warn"/>
  <text x="768" y="146" class="ui small" fill="#fde68a">AN TOÀN MODE: EDIT sửa Saved Draft · SIM chạy sandbox, không physical I/O · LIVE mở sealed Active và chỉ đọc</text>

  <!-- Explorer -->
  <rect x="36" y="180" width="220" height="476" rx="10" class="panel"/>
  <text x="52" y="207" class="ui h2">POU EXPLORER</text>
  <rect x="50" y="220" width="192" height="30" rx="7" class="panel2"/>
  <text x="63" y="240" class="ui small">⌕ Tìm POU…</text>
  <text x="52" y="279" class="ui tiny">PROGRAMS</text>
  <rect x="48" y="291" width="196" height="36" rx="7" class="focus"/>
  <text x="64" y="314" class="ui label">ST  AHU_SUPPLY</text>
  <text x="64" y="350" class="ui small">◇ FBD  ZONE_CONTROL</text>
  <text x="64" y="380" class="ui small">ST  PUMP_LEAD_LAG</text>
  <text x="52" y="420" class="ui tiny">FUNCTION BLOCKS</text>
  <text x="64" y="446" class="ui small">◇ FB  PID_LOOP</text>
  <text x="64" y="475" class="ui small">◇ FB  ALARM_DELAY</text>
  <line x1="50" y1="505" x2="242" y2="505" class="line"/>
  <text x="52" y="531" class="ui tiny">IDENTITY GUARD</text>
  <text x="52" y="552" class="ui small">Selection = objectId</text>
  <text x="52" y="572" class="ui small">Runtime = programId</text>
  <text x="52" y="592" class="ui tiny">Không suy hai ID bằng nhau</text>
  <rect x="50" y="612" width="192" height="28" rx="6" class="muted"/>
  <text x="65" y="631" class="ui tiny">+ POU · admin trong EDIT</text>

  <!-- ST editor -->
  <rect x="270" y="180" width="780" height="476" rx="10" class="panel"/>
  <rect x="270" y="180" width="780" height="42" rx="10" fill="#19263c"/>
  <rect x="270" y="212" width="780" height="10" fill="#19263c"/>
  <text x="288" y="207" class="ui h2">AHU_SUPPLY.st</text>
  <rect x="784" y="190" width="84" height="24" rx="6" class="muted"/>
  <text x="802" y="207" class="ui tiny">Format</text>
  <rect x="878" y="190" width="70" height="24" rx="6" class="muted"/>
  <text x="898" y="207" class="ui tiny">Save</text>
  <rect x="958" y="190" width="74" height="24" rx="6" class="focus"/>
  <text x="976" y="207" class="ui tiny">Check</text>
  <rect x="282" y="234" width="756" height="406" rx="8" class="panel2"/>
  <rect x="282" y="234" width="48" height="406" rx="8" fill="#07101d"/>
  <line x1="330" y1="234" x2="330" y2="640" class="line"/>
  <g class="mono tiny">
    <text x="299" y="264">01</text><text x="299" y="292">02</text>
    <text x="299" y="320">03</text><text x="299" y="348">04</text>
    <text x="299" y="376">05</text><text x="299" y="404">06</text>
    <text x="299" y="432">07</text><text x="299" y="460">08</text>
    <text x="299" y="488">09</text><text x="299" y="516">10</text>
    <text x="299" y="544">11</text><text x="299" y="572">12</text>
    <text x="299" y="600">13</text>
  </g>
  <g class="mono code">
    <text x="350" y="264" fill="#c4b5fd">PROGRAM</text><text x="421" y="264"> AHU_SUPPLY</text>
    <text x="350" y="292" fill="#c4b5fd">VAR</text>
    <text x="372" y="320">T_Start : TON;</text>
    <text x="372" y="348">DamperCmd : REAL;</text>
    <text x="350" y="376" fill="#c4b5fd">END_VAR</text>
    <text x="350" y="420" fill="#c4b5fd">IF</text><text x="372" y="420"> FanEnable </text><text x="454" y="420" fill="#c4b5fd">THEN</text>
    <text x="372" y="448">SupplyFan := TRUE;</text>
    <text x="372" y="476" fill="#7dd3fc">T_Start</text><text x="425" y="476">(IN := SupplyFan, PT := T#5s);</text>
    <rect x="366" y="491" width="382" height="26" rx="4" fill="#15344f"/>
    <text x="372" y="510">DamperCmd := LIMIT(0.0, PID_LOOP(...), 100.0);</text>
    <text x="350" y="544" fill="#c4b5fd">ELSE</text>
    <text x="372" y="572">SupplyFan := FALSE;</text>
    <text x="350" y="600" fill="#c4b5fd">END_IF;</text>
  </g>
  <path d="M612 516 h133" stroke="#fb7185" stroke-width="2"/>
  <circle cx="744" cy="516" r="3" fill="#fb7185"/>

  <!-- Quick Library -->
  <rect x="1064" y="180" width="248" height="476" rx="10" class="panel"/>
  <text x="1080" y="207" class="ui h2">QUICK LIBRARY</text>
  <rect x="1078" y="220" width="220" height="32" rx="7" class="panel2"/>
  <text x="1091" y="241" class="ui small">⌕ timer, PID, limit…</text>
  <text x="1080" y="277" class="ui tiny">★ FAVORITES</text>
  <rect x="1078" y="288" width="220" height="54" rx="8" class="focus"/>
  <text x="1092" y="310" class="ui label">TON</text>
  <text x="1092" y="329" class="ui tiny">FB · stateful · READY</text>
  <rect x="1078" y="350" width="220" height="54" rx="8" class="panel2"/>
  <text x="1092" y="372" class="ui label">LIMIT</text>
  <text x="1092" y="391" class="ui tiny">FUNCTION · READY</text>
  <rect x="1078" y="412" width="220" height="58" rx="8" class="warn"/>
  <text x="1092" y="434" class="ui label">PID</text>
  <text x="1092" y="454" class="ui tiny" fill="#fde68a">REVIEW_REQUIRED · locked</text>
  <text x="1080" y="503" class="ui tiny">INSERT CONTRACT</text>
  <text x="1080" y="526" class="ui small">Function → call template</text>
  <text x="1080" y="548" class="ui small">FB → instance + call</text>
  <text x="1080" y="570" class="ui tiny">Một transaction · một undo</text>
  <rect x="1078" y="600" width="220" height="40" rx="7" class="safe"/>
  <text x="1092" y="625" class="ui small" fill="#a7f3d0">Drag / Enter để insert</text>

  <!-- Inspector -->
  <rect x="1326" y="180" width="318" height="476" rx="10" class="panel"/>
  <text x="1342" y="207" class="ui h2">INSPECTOR · TON</text>
  <text x="1342" y="239" class="ui tiny">SIGNATURE AUTHORITY</text>
  <text x="1342" y="264" class="ui label">T_Start : TON</text>
  <text x="1342" y="288" class="ui small">IN · BOOL · required</text>
  <text x="1342" y="310" class="ui small">PT · TIME · required</text>
  <text x="1342" y="332" class="ui small">Q · BOOL · output</text>
  <text x="1342" y="354" class="ui small">ET · TIME · output</text>
  <line x1="1342" y1="374" x2="1628" y2="374" class="line"/>
  <text x="1342" y="401" class="ui tiny">DIAGNOSTIC</text>
  <rect x="1340" y="413" width="288" height="70" rx="8" class="danger"/>
  <text x="1354" y="437" class="ui label">ST-POU-003 · L10:C23</text>
  <text x="1354" y="458" class="ui small">PID_LOOP chưa được profile duyệt</text>
  <text x="1354" y="476" class="ui tiny">Nguồn: compiler diagnostic</text>
  <line x1="1342" y1="501" x2="1628" y2="501" class="line"/>
  <text x="1342" y="528" class="ui tiny">MODE SAFETY</text>
  <rect x="1340" y="540" width="288" height="100" rx="8" class="safe"/>
  <text x="1354" y="565" class="ui small">EDIT · Saved Draft · admin</text>
  <text x="1354" y="589" class="ui small">SIM · immutable sandbox</text>
  <text x="1354" y="613" class="ui small">LIVE · sealed Active · read-only</text>
  <text x="1354" y="632" class="ui tiny">Không mode nào ở đây ghi physical I/O</text>

  <!-- Bottom workbench -->
  <rect x="36" y="670" width="1608" height="144" rx="10" class="panel"/>
  <rect x="36" y="670" width="1608" height="40" rx="10" fill="#19263c"/>
  <text x="54" y="696" class="ui label">Problems  1</text>
  <text x="152" y="696" class="ui small">Watch</text>
  <text x="214" y="696" class="ui small">Trace</text>
  <text x="272" y="696" class="ui small">Search</text>
  <text x="334" y="696" class="ui small">Cross Reference</text>
  <rect x="52" y="724" width="1574" height="72" rx="8" class="danger"/>
  <text x="70" y="750" class="ui label">1 error · Check failed · Active r15 vẫn Running</text>
  <text x="70" y="774" class="ui small">L10:C23 · ST-POU-003 · Mở chi tiết · Copy diagnostic</text>

  <!-- Required state strip -->
  <text x="24" y="866" class="ui h2">TRẠNG THÁI BẮT BUỘC · cùng layout, không thay giá trị thiếu bằng 0</text>

  <g transform="translate(24 884)">
    <rect width="258" height="160" rx="12" class="panel"/>
    <text x="16" y="28" class="ui label">LOADING</text>
    <rect x="16" y="45" width="190" height="12" rx="6" fill="#334155"/>
    <rect x="16" y="68" width="220" height="12" rx="6" fill="#26364f"/>
    <rect x="16" y="91" width="164" height="12" rx="6" fill="#334155"/>
    <text x="16" y="132" class="ui tiny">Skeleton · mutation disabled</text>
    <text x="16" y="149" class="ui tiny">Không dùng cache làm authority</text>
  </g>
  <g transform="translate(294 884)">
    <rect width="258" height="160" rx="12" class="danger"/>
    <text x="16" y="28" class="ui label">ERROR</text>
    <text x="16" y="56" class="ui small">Không tải được Draft.</text>
    <text x="16" y="78" class="ui tiny">PRG-ERR-REQ-001</text>
    <rect x="16" y="101" width="82" height="30" rx="7" class="muted"/>
    <text x="36" y="121" class="ui small">Thử lại</text>
    <text x="16" y="149" class="ui tiny">Giữ buffer nếu Save lỗi</text>
  </g>
  <g transform="translate(564 884)">
    <rect width="258" height="160" rx="12" class="warn"/>
    <text x="16" y="28" class="ui label">PERMISSION</text>
    <text x="16" y="56" class="ui small">Bạn chỉ có quyền đọc.</text>
    <text x="16" y="78" class="ui tiny">Insert · Save · Check disabled</text>
    <rect x="16" y="101" width="146" height="30" rx="7" class="muted"/>
    <text x="31" y="121" class="ui small">Xem quyền truy cập</text>
    <text x="16" y="149" class="ui tiny">Server vẫn kiểm tra RBAC</text>
  </g>
  <g transform="translate(834 884)">
    <rect width="258" height="160" rx="12" class="muted"/>
    <text x="16" y="28" class="ui label">UNKNOWN</text>
    <text x="16" y="56" class="ui small">Chưa xác nhận trạng thái.</text>
    <text x="16" y="78" class="ui tiny">Timeout ≠ success</text>
    <rect x="16" y="101" width="90" height="30" rx="7" class="panel2"/>
    <text x="32" y="121" class="ui small">Làm mới</text>
    <text x="16" y="149" class="ui tiny">Read-back trước retry</text>
  </g>
  <g transform="translate(1104 884)">
    <rect width="258" height="160" rx="12" class="warn"/>
    <text x="16" y="28" class="ui label">STALE</text>
    <text x="16" y="56" class="ui small">Giá trị cũ · 21.8 °C</text>
    <text x="16" y="78" class="ui tiny">Observed 09:42:18 UTC</text>
    <path d="M16 91 h146" stroke="#fbbf24" stroke-width="2"/>
    <text x="16" y="121" class="ui small">Không dùng để quyết định</text>
    <text x="16" y="149" class="ui tiny">Badge + time luôn visible</text>
  </g>
  <g transform="translate(1374 884)">
    <rect width="282" height="160" rx="12" class="danger"/>
    <text x="16" y="28" class="ui label">OFFLINE</text>
    <text x="16" y="56" class="ui small">Controller ngoại tuyến.</text>
    <text x="16" y="78" class="ui h2">Runtime value: —</text>
    <rect x="16" y="101" width="90" height="30" rx="7" class="muted"/>
    <text x="32" y="121" class="ui small">Thử lại</text>
    <text x="16" y="149" class="ui tiny">Không render zero giả</text>
  </g>
</svg>
