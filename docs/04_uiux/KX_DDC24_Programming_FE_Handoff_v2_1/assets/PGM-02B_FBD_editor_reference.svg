  <text x="1354" y="458" class="ui small">BOOL không nối được vào REAL</text>
  <text x="1354" y="476" class="ui tiny">Chọn port tương thích · Xóa edge</text>
  <line x1="1342" y1="501" x2="1628" y2="501" class="line"/>
  <text x="1342" y="528" class="ui tiny">MODE SAFETY</text>
  <rect x="1340" y="540" width="288" height="100" rx="8" class="safe"/>
  <text x="1354" y="565" class="ui small">EDIT · graph Draft · admin</text>
  <text x="1354" y="589" class="ui small">SIM · virtual point image</text>
  <text x="1354" y="613" class="ui small">LIVE · Active graph · read-only</text>
  <text x="1354" y="632" class="ui tiny">Mismatch → không overlay port value</text>

  <!-- Bottom workbench -->
  <rect x="36" y="670" width="1608" height="144" rx="10" class="panel"/>
  <rect x="36" y="670" width="1608" height="40" rx="10" fill="#19263c"/>
  <text x="54" y="696" class="ui label">Problems  2</text>
  <text x="152" y="696" class="ui small">Watch</text>
  <text x="214" y="696" class="ui small">Trace</text>
  <text x="272" y="696" class="ui small">Search</text>
  <text x="334" y="696" class="ui small">Cross Reference</text>
  <rect x="52" y="724" width="1574" height="72" rx="8" class="danger"/>
  <text x="70" y="750" class="ui label">2 errors · Check failed · Active r15 vẫn Running</text>
  <text x="70" y="774" class="ui small">edge-27 type mismatch · PID REVIEW_REQUIRED · Focus node / Copy diagnostic</text>

  <!-- Required state strip -->
  <text x="24" y="866" class="ui h2">TRẠNG THÁI BẮT BUỘC · giữ node-edge semantics, không dựng card/form thay canvas</text>

  <g transform="translate(24 884)">
