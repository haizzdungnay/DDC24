<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" fill="#cbd5e1" role="img" aria-labelledby="title desc">
  <title id="title">PGM-02B FBD Editor Target reference</title>
  <desc id="desc">FBD node-edge canvas với Quick Library, Inspector, typed ports, diagnostics, mode safety và sáu trạng thái loading, error, permission, unknown, stale, offline.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#34435b" opacity=".62"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#17243c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
      .title{font-size:22px;font-weight:750;fill:#f8fafc}
      .h2{font-size:14px;font-weight:700;fill:#e2e8f0}
      .label{font-size:12px;font-weight:650;fill:#cbd5e1}
      .small{font-size:11px;fill:#a8b5c8}
      .tiny{font-size:10px;fill:#94a3b8}
      .panel{fill:#111c2f;stroke:#334155;stroke-width:1}
      .panel2{fill:#0b1424;stroke:#253651;stroke-width:1}
      .line{stroke:#334155;stroke-width:1}
      .focus{fill:#102c43;stroke:#38bdf8;stroke-width:1.5}
      .pill{fill:#1d293d;stroke:#475569}
      .safe{fill:#0e2925;stroke:#34d399}
      .warn{fill:#352812;stroke:#fbbf24}
      .danger{fill:#341924;stroke:#fb7185}
      .muted{fill:#182337;stroke:#475569}
    </style>
  </defs>

  <rect width="1680" height="1080" fill="#0b1527"/>
  <text x="24" y="26" class="ui small">PGM-02B · TARGET v2.2 · DỮ LIỆU MINH HỌA, KHÔNG PHẢI BẰNG CHỨNG RUNTIME</text>

  <g filter="url(#shadow)">
    <rect x="20" y="40" width="1640" height="790" rx="18" fill="#08101d" stroke="#475569"/>
  </g>
  <rect x="20" y="40" width="1640" height="64" rx="18" fill="#111e33"/>
  <rect x="20" y="88" width="1640" height="16" fill="#111e33"/>
  <text x="44" y="79" class="ui title">FBD Editor · ZONE_CONTROL</text>
  <text x="378" y="78" class="ui small">Foxlinx Tower / AHU-02</text>
  <rect x="1014" y="55" width="76" height="34" rx="8" class="focus"/>
  <text x="1037" y="77" class="ui label" fill="#7dd3fc">EDIT</text>
  <rect x="1098" y="55" width="102" height="34" rx="8" class="pill"/>
  <text x="1118" y="77" class="ui label">SIMULATE</text>
  <rect x="1208" y="55" width="76" height="34" rx="8" class="pill"/>
  <text x="1230" y="77" class="ui label">LIVE</text>
  <rect x="1298" y="55" width="154" height="34" rx="8" class="safe"/>
  <text x="1315" y="76" class="ui small" fill="#a7f3d0">● Saved · Draft r17</text>
  <rect x="1462" y="55" width="174" height="34" rx="8" class="muted"/>
  <text x="1479" y="76" class="ui small">Admin · Core online</text>

  <!-- Context and safety -->
  <rect x="36" y="116" width="1608" height="50" rx="9" class="panel"/>
  <text x="52" y="137" class="ui tiny">DOCUMENT</text>
  <text x="52" y="156" class="ui label">Saved Draft r17 · objectId …d10f</text>
  <line x1="292" y1="127" x2="292" y2="156" class="line"/>
  <text x="310" y="137" class="ui tiny">CANVAS LIMIT</text>
  <text x="310" y="156" class="ui label">22 / 256 nodes · 27 / 512 edges</text>
  <rect x="750" y="126" width="876" height="30" rx="7" class="warn"/>
  <text x="768" y="146" class="ui small" fill="#fde68a">AN TOÀN MODE: EDIT sửa Saved Draft · SIM chạy sandbox, không physical I/O · LIVE mở sealed Active và chỉ đọc</text>

  <!-- Explorer -->
  <rect x="36" y="180" width="220" height="476" rx="10" class="panel"/>
  <text x="52" y="207" class="ui h2">POU EXPLORER</text>
  <rect x="50" y="220" width="192" height="30" rx="7" class="panel2"/>
  <text x="63" y="240" class="ui small">⌕ Tìm POU…</text>
  <text x="52" y="279" class="ui tiny">PROGRAMS</text>
  <text x="64" y="310" class="ui small">ST  AHU_SUPPLY</text>
  <rect x="48" y="322" width="196" height="36" rx="7" class="focus"/>
  <text x="64" y="345" class="ui label">◇ FBD  ZONE_CONTROL</text>
  <text x="64" y="382" class="ui small">ST  PUMP_LEAD_LAG</text>
  <text x="52" y="422" class="ui tiny">FUNCTION BLOCKS</text>
  <text x="64" y="449" class="ui small">◇ FB  PID_LOOP</text>
  <text x="64" y="478" class="ui small">◇ FB  ALARM_DELAY</text>
  <line x1="50" y1="507" x2="242" y2="507" class="line"/>
  <text x="52" y="533" class="ui tiny">IDENTITY GUARD</text>
  <text x="52" y="554" class="ui small">Selection = objectId</text>
  <text x="52" y="574" class="ui small">Runtime = programId</text>
  <text x="52" y="594" class="ui tiny">Node/port ID không đổi theo label</text>
  <rect x="50" y="612" width="192" height="28" rx="6" class="muted"/>
  <text x="65" y="631" class="ui tiny">+ POU · admin trong EDIT</text>

  <!-- FBD Canvas -->
  <rect x="270" y="180" width="780" height="476" rx="10" class="panel"/>
  <rect x="270" y="180" width="780" height="42" rx="10" fill="#19263c"/>
  <rect x="270" y="212" width="780" height="10" fill="#19263c"/>
  <text x="288" y="207" class="ui h2">ZONE_CONTROL.fbd</text>
  <rect x="670" y="190" width="56" height="24" rx="6" class="muted"/>
  <text x="687" y="207" class="ui tiny">↶</text>
  <rect x="734" y="190" width="56" height="24" rx="6" class="muted"/>
  <text x="751" y="207" class="ui tiny">↷</text>
  <rect x="798" y="190" width="72" height="24" rx="6" class="muted"/>
  <text x="814" y="207" class="ui tiny">100%</text>
  <rect x="878" y="190" width="70" height="24" rx="6" class="muted"/>
  <text x="898" y="207" class="ui tiny">Save</text>
  <rect x="958" y="190" width="74" height="24" rx="6" class="focus"/>
  <text x="976" y="207" class="ui tiny">Check</text>
  <rect x="282" y="234" width="756" height="406" rx="8" fill="#0a1322"/>
  <rect x="282" y="234" width="756" height="406" rx="8" fill="none" stroke="#253651"/>

  <!-- Edges behind nodes -->
  <path d="M438 326 C486 326 486 326 528 326" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M438 430 C486 430 486 374 528 374" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M668 326 C716 326 716 326 756 326" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <path d="M668 390 C716 390 716 398 756 398" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M900 326 C944 326 944 350 1008 350" fill="none" stroke="#34d399" stroke-width="3"/>
  <path d="M668 456 C718 456 720 488 756 488" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="7 5"/>

  <!-- Input nodes -->
  <g filter="url(#shadow)">
    <rect x="308" y="286" width="132" height="80" rx="9" fill="#12304a" stroke="#38bdf8"/>
  </g>
  <text x="324" y="311" class="ui tiny">AI_ZONE_TEMP</text>
  <text x="324" y="339" class="ui h2">21.8 °C</text>
  <circle cx="440" cy="326" r="6" fill="#38bdf8"/>
  <g filter="url(#shadow)">
    <rect x="308" y="390" width="132" height="80" rx="9" fill="#342711" stroke="#f59e0b"/>
  </g>
  <text x="324" y="415" class="ui tiny">SP_ZONE</text>
  <text x="324" y="443" class="ui h2">22.0 °C</text>
  <circle cx="440" cy="430" r="6" fill="#f59e0b"/>

  <!-- PID node -->
  <g filter="url(#shadow)">
    <rect x="528" y="276" width="142" height="222" rx="10" fill="#251e45" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <rect x="528" y="276" width="142" height="38" rx="10" fill="#382e66"/>
  <rect x="528" y="304" width="142" height="10" fill="#382e66"/>
  <text x="576" y="301" class="ui h2">PID</text>
  <text x="544" y="331" class="ui tiny">PV</text>
  <text x="544" y="379" class="ui tiny">SP</text>
  <text x="544" y="423" class="ui tiny">EN</text>
  <text x="544" y="459" class="ui tiny">RST</text>
  <text x="625" y="331" class="ui tiny">OUT</text>
  <text x="625" y="395" class="ui tiny">Q</text>
  <circle cx="528" cy="326" r="6" fill="#38bdf8"/>
  <circle cx="528" cy="374" r="6" fill="#f59e0b"/>
  <circle cx="528" cy="418" r="6" fill="#34d399"/>
  <circle cx="528" cy="456" r="6" fill="#fb7185"/>
  <circle cx="670" cy="326" r="6" fill="#a78bfa"/>
  <circle cx="670" cy="390" r="6" fill="#f59e0b"/>
  <rect x="544" y="472" width="110" height="18" rx="4" class="warn"/>
  <text x="554" y="485" class="ui tiny" fill="#fde68a">REVIEW_REQUIRED</text>

  <!-- Limit node -->
  <g filter="url(#shadow)">
    <rect x="756" y="276" width="146" height="170" rx="10" fill="#15302e" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <rect x="756" y="276" width="146" height="38" rx="10" fill="#1b4641"/>
  <rect x="756" y="304" width="146" height="10" fill="#1b4641"/>
