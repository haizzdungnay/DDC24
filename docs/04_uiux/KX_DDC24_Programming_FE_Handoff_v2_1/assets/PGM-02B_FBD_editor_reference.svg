  <g filter="url(#shadow)">
    <rect x="906" y="312" width="112" height="78" rx="9" fill="#17312d" stroke="#34d399"/>
  </g>
  <text x="922" y="338" class="ui tiny">AO_DAMPER</text>
  <text x="922" y="366" class="ui h2">— %</text>
  <circle cx="906" cy="350" r="6" fill="#34d399"/>

