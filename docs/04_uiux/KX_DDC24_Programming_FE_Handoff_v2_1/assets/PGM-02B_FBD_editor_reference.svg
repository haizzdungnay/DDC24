  <rect x="1078" y="600" width="220" height="40" rx="7" class="safe"/>
  <text x="1092" y="625" class="ui small" fill="#a7f3d0">Keyboard insert có parity</text>

  <!-- Inspector -->
  <rect x="1326" y="180" width="318" height="476" rx="10" class="panel"/>
  <text x="1342" y="207" class="ui h2">INSPECTOR · LIMIT</text>
  <text x="1342" y="239" class="ui tiny">NODE / PORT IDENTITY</text>
  <text x="1342" y="264" class="ui label">node-08 · SYSTEM/LIMIT@1</text>
  <text x="1342" y="288" class="ui small">IN · REAL · required</text>
  <text x="1342" y="310" class="ui small">MIN · REAL · 0.0</text>
  <text x="1342" y="332" class="ui small">MAX · REAL · 100.0</text>
  <text x="1342" y="354" class="ui small">OUT · REAL · output</text>
