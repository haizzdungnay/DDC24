    <rect x="16" y="45" width="210" height="78" rx="8" fill="#26364f"/>
    <circle cx="55" cy="84" r="18" fill="#334155"/>
    <rect x="84" y="68" width="112" height="10" rx="5" fill="#475569"/>
    <rect x="84" y="89" width="92" height="10" rx="5" fill="#334155"/>
    <text x="16" y="149" class="ui tiny">Canvas skeleton · tools disabled</text>
  </g>
  <g transform="translate(294 884)">
