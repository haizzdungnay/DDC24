  <text x="772" y="331" class="ui tiny">IN</text>
  <text x="772" y="403" class="ui tiny">MIN</text>
  <text x="772" y="427" class="ui tiny">MAX</text>
  <text x="854" y="331" class="ui tiny">OUT</text>
  <circle cx="756" cy="326" r="6" fill="#a78bfa"/>
  <circle cx="756" cy="398" r="6" fill="#f59e0b"/>
  <circle cx="756" cy="422" r="6" fill="#f59e0b"/>
  <circle cx="902" cy="326" r="6" fill="#34d399"/>
  <text x="796" y="403" class="ui tiny">0.0</text>
  <text x="796" y="427" class="ui tiny">100.0</text>

