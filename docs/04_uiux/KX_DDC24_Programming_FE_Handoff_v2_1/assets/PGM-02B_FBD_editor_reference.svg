    <text x="16" y="56" class="ui small">Canvas chỉ đọc.</text>
    <text x="16" y="78" class="ui tiny">Add · Connect · Delete disabled</text>
    <rect x="16" y="101" width="146" height="30" rx="7" class="muted"/>
    <text x="31" y="121" class="ui small">Xem quyền truy cập</text>
