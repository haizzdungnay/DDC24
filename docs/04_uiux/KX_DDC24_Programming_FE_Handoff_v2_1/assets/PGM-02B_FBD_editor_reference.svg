  <circle cx="756" cy="488" r="7" fill="#fb7185"/>
  <text x="778" y="493" class="ui small" fill="#fda4af">Type mismatch · BOOL → REAL</text>
  <rect x="306" y="548" width="700" height="70" rx="8" class="warn"/>
  <text x="322" y="573" class="ui label">Atomic gesture</text>
  <text x="430" y="573" class="ui small">Drop lên edge → ADD_NODE_AND_CONNECT · một transaction / một undo</text>
  <text x="322" y="597" class="ui tiny">Ambiguous port mở chooser · Cancel/type mismatch = zero mutation</text>

  <!-- Quick Library -->
  <rect x="1064" y="180" width="248" height="476" rx="10" class="panel"/>
  <text x="1080" y="207" class="ui h2">QUICK LIBRARY</text>
  <rect x="1078" y="220" width="220" height="32" rx="7" class="panel2"/>
  <text x="1091" y="241" class="ui small">⌕ block, timer, limit…</text>
  <text x="1080" y="277" class="ui tiny">★ FAVORITES</text>
  <rect x="1078" y="288" width="220" height="54" rx="8" class="focus"/>
  <text x="1092" y="310" class="ui label">LIMIT</text>
  <text x="1092" y="329" class="ui tiny">Math · 4 typed ports</text>
  <rect x="1078" y="350" width="220" height="54" rx="8" class="panel2"/>
  <text x="1092" y="372" class="ui label">TON</text>
  <text x="1092" y="391" class="ui tiny">Timer · stateful · READY</text>
  <rect x="1078" y="412" width="220" height="58" rx="8" class="warn"/>
  <text x="1092" y="434" class="ui label">PID</text>
  <text x="1092" y="454" class="ui tiny" fill="#fde68a">REVIEW_REQUIRED · locked</text>
