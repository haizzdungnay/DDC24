<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" fill="#cbd5e1" role="img" aria-labelledby="title desc">
  <title id="title">PGM-02 ST và FBD combined Target reference</title>
  <desc id="desc">Bố cục desktop gồm POU Explorer, hai biến thể ST và FBD, Quick Library, Inspector, workbench; bên phải là inset mobile chỉ đọc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
      .title{font-size:22px;font-weight:700;fill:#f8fafc}
      .h2{font-size:15px;font-weight:700;fill:#e2e8f0}
      .label{font-size:12px;font-weight:650;fill:#cbd5e1}
      .small{font-size:11px;fill:#94a3b8}
      .tiny{font-size:10px;fill:#94a3b8}
      .code{font-size:12px;fill:#cbd5e1}
      .panel{fill:#121c2e;stroke:#334155;stroke-width:1}
      .panel2{fill:#0e1728;stroke:#26364f;stroke-width:1}
      .divider{stroke:#334155;stroke-width:1}
      .focus{fill:#122d42;stroke:#38bdf8;stroke-width:1.5}
      .pill{fill:#1e293b;stroke:#475569}
      .safe{fill:#102a25;stroke:#34d399}
      .warn{fill:#332712;stroke:#fbbf24}
      .danger{fill:#351b24;stroke:#fb7185}
    </style>
  </defs>

