  <text x="435" y="267" class="mono code" fill="#c4b5fd">THEN</text>
  <text x="352" y="294" class="mono code">SupplyFan := TRUE;</text>
  <text x="352" y="321" class="mono code" fill="#7dd3fc">T_Start</text>
  <text x="404" y="321" class="mono code">(IN := SupplyFan, PT := T#5s);</text>
  <text x="352" y="348" class="mono code">DuctSp := LIMIT(180.0, Setpoint, 450.0);</text>
  <rect x="348" y="365" width="235" height="25" rx="4" fill="#17334d"/>
  <text x="352" y="383" class="mono code">DamperCmd := PID_LOOP(...);</text>
  <text x="336" y="410" class="mono code" fill="#c4b5fd">ELSE</text>
  <text x="352" y="437" class="mono code">SupplyFan := FALSE;</text>
  <text x="336" y="464" class="mono code" fill="#c4b5fd">END_IF;</text>

