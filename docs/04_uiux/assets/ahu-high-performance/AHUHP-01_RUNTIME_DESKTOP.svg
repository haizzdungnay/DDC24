<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AHU High Performance — Runtime desktop</title>
  <desc id="desc">Bản đặc tả trực quan desktop gồm điều hướng, trạng thái an toàn, đường gió FA RA SA EA, hai quạt, hai coil, bốn VAV, KPI, lệnh và alarm.</desc>
  <defs>
    <style>
      .bg{fill:#07111f}.nav{fill:#0b1727}.surface{fill:#102033;stroke:#29415c;stroke-width:1}.surface2{fill:#0c1a2b;stroke:#29415c}.txt{fill:#f1f5f9;font:14px Arial,sans-serif}.small{fill:#a9b8c8;font:12px Arial,sans-serif}.h1{fill:#f1f5f9;font:bold 24px Arial,sans-serif}.h2{fill:#f1f5f9;font:bold 16px Arial,sans-serif}.good{fill:#32d583}.warn{fill:#fdb022}.danger{fill:#f97066}.info{fill:#53b1fd}.line-fa{stroke:#32d583;stroke-width:10;fill:none}.line-ra{stroke:#a78bfa;stroke-width:10;fill:none}.line-sa{stroke:#53b1fd;stroke-width:10;fill:none}.line-ea{stroke:#fdb022;stroke-width:10;fill:none}.btn{fill:#1570ef}.chip{fill:#183b2d;stroke:#32d583}.mutedchip{fill:#202d3d;stroke:#66788c}
    </style>
