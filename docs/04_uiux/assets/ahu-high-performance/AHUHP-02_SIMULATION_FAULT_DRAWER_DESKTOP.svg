<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Simulation Lab — Fault injection drawer</title>
  <desc id="desc">Bản đặc tả trực quan drawer tiêm lỗi có target, magnitude, duration, preview tác động, reason, xác nhận môi trường lab và hành động hai bước.</desc>
  <defs><style>.bg{fill:#07111f}.s{fill:#102033;stroke:#29415c}.s2{fill:#0c1a2b;stroke:#29415c}.t{fill:#f1f5f9;font:14px Arial}.sm{fill:#a9b8c8;font:12px Arial}.h{fill:#f1f5f9;font:bold 24px Arial}.h2{fill:#f1f5f9;font:bold 16px Arial}.good{fill:#32d583}.warn{fill:#fdb022}.danger{fill:#f97066}.btn{fill:#d92d20}.disabled{fill:#344054}</style></defs>
  <rect class="bg" width="1440" height="900"/><rect x="0" y="0" width="900" height="900" fill="#07111f" opacity="0.34"/><rect x="0" y="0" width="900" height="74" fill="#0b1727" opacity="0.6"/><text class="h" x="32" y="45" opacity="0.6">Simulation Lab · AHU-01</text>
  <rect x="30" y="104" width="838" height="84" rx="12" class="s" opacity="0.52"/><text class="h2" x="54" y="136" opacity="0.6">Phiên SIM-20260813-001</text><circle cx="57" cy="163" r="6" class="warn"/><text class="t" x="72" y="168" opacity="0.65">PAUSED · t = 00:18:42 · profile AHUHP-NOMINAL-v1</text>
  <rect x="30" y="212" width="838" height="392" rx="12" class="s" opacity="0.4"/><text class="h2" x="54" y="246" opacity="0.6">Plant boundary và thiết bị</text><path d="M90 378H768" stroke="#53b1fd" stroke-width="12" opacity="0.5"/><circle cx="530" cy="378" r="48" fill="#173452" stroke="#53b1fd" opacity="0.5"/><rect x="280" y="328" width="92" height="100" rx="8" fill="#10324d" opacity="0.5"/><text class="t" x="298" y="382" opacity="0.6">CHW</text>
  <rect x="30" y="628" width="838" height="170" rx="12" class="s" opacity="0.4"/><text class="h2" x="54" y="663" opacity="0.6">Evidence session</text><text class="sm" x="54" y="694" opacity="0.6">Profile, seed, contract version, events và SHA-256 sẽ được xuất cùng Test Result.</text>

  <rect x="900" y="0" width="540" height="900" fill="#102033"/><rect x="900" y="0" width="540" height="76" fill="#14283d"/><text class="h" x="932" y="42">Tiêm lỗi mô phỏng</text><text class="sm" x="932" y="62">Chỉ có hiệu lực trong phiên lab hiện tại</text><text class="h2" x="1390" y="43">×</text>
  <rect x="932" y="94" width="476" height="54" rx="8" fill="#3b2a0e" stroke="#fdb022"/><circle cx="954" cy="121" r="6" class="warn"/><text class="t" x="970" y="117">Phiên đang PAUSED</text><text class="sm" x="970" y="136">Có thể tiêm lỗi an toàn trước khi Resume.</text>
  <text class="sm" x="932" y="180">LOẠI LỖI *</text><rect x="932" y="192" width="476" height="46" rx="8" class="s2"/><text class="t" x="948" y="221">Kẹt actuator (STUCK_ACTUATOR)</text><text class="t" x="1380" y="221">⌄</text>
  <text class="sm" x="932" y="270">TARGET *</text><rect x="932" y="282" width="230" height="46" rx="8" class="s2"/><text class="t" x="948" y="311">VAV_SA_DAMPER</text><text class="t" x="1135" y="311">⌄</text>
  <text class="sm" x="1178" y="270">GIÁ TRỊ KẸT *</text><rect x="1178" y="282" width="230" height="46" rx="8" class="s2"/><text class="t" x="1194" y="311">35 %</text>
  <text class="sm" x="932" y="360">THỜI LƯỢNG</text><rect x="932" y="372" width="230" height="46" rx="8" class="s2"/><text class="t" x="948" y="401">300 s</text><text class="sm" x="1178" y="389">0 = đến khi clear thủ công</text><text class="sm" x="1178" y="407">Giới hạn policy: 1…1800 s</text>
  <rect x="932" y="444" width="476" height="116" rx="8" fill="#2a1718" stroke="#f97066"/><text class="h2" x="952" y="474">Preview tác động</text><text class="t" x="952" y="501">• SA airflow có thể giảm dưới 80% mục tiêu.</text><text class="t" x="952" y="524">• Duct pressure loop tăng tốc quạt đến giới hạn.</text><text class="t" x="952" y="547">• Watchdog VAV vẫn giữ quyền đưa thiết bị về safe-state.</text>
  <text class="sm" x="932" y="592">LÝ DO / TICKET * (TỐI THIỂU 10 KÝ TỰ)</text><rect x="932" y="604" width="476" height="76" rx="8" class="s2"/><text class="t" x="948" y="630">Xác minh SAFE-REQ-AHUHP-003, case VS-AHUHP-011</text><text class="sm" x="948" y="657">Sẽ ghi vào audit event và evidence manifest.</text>
  <rect x="932" y="706" width="20" height="20" rx="3" fill="#1570ef"/><path d="M937 716l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text class="t" x="964" y="720">Tôi xác nhận đây là môi trường LAB, không phải site thật.</text>
  <rect x="932" y="748" width="20" height="20" rx="3" class="s2"/><text class="t" x="964" y="762">Tôi đã xem preview và chấp nhận tác động dự kiến.</text>
  <text class="sm" x="932" y="801">Focus: drawer title → fields → confirmations → actions. Esc chỉ đóng trước submit.</text>
  <rect x="932" y="828" width="224" height="46" rx="8" class="s2"/><text class="t" x="1014" y="857">Hủy</text><rect x="1172" y="828" width="236" height="46" rx="8" class="disabled"/><text class="t" x="1245" y="857">Tiêm lỗi</text><text class="sm" x="1180" y="820">Disabled: thiếu xác nhận tác động</text>
  <rect x="900" y="888" width="540" height="12" fill="#3b2a0e"/><text x="1017" y="898" fill="#ffd998" style="font:9px Arial">DỮ LIỆU MINH HỌA — KHÔNG PHẢI BẰNG CHỨNG RUNTIME</text>
</svg>
