<svg xmlns="http://www.w3.org/2000/svg" width="800" height="820" viewBox="0 0 800 820" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>MBR-FRM-01 Khối "Khung truyền gần nhất" — mobile 390, hai trạng thái</title>
  <desc>Hai artboard mobile của FrameMonitor: bảng cuộn ngang trong khung riêng, và trạng thái không đọc được. Màu lấy từ token LIGHT trong apps/web-ui/src/shared/theme/tokens.ts. Dữ liệu trong hình là MINH HOẠ, không phải dữ liệu runtime.</desc>

  <rect width="800" height="820" fill="#C8CCD0"/>

  <text x="24" y="22" font-size="12" font-weight="700" fill="#4A4F55">Artboard 1 — mobile 390 · có giao dịch (bảng cuộn ngang)</text>
  <text x="424" y="22" font-size="12" font-weight="700" fill="#4A4F55">Artboard 2 — mobile 390 · không đọc được (503)</text>

  <!-- ============ MOBILE 1 ============ -->
  <g transform="translate(24,36)">
    <rect x="0" y="0" width="390" height="740" rx="8" fill="#D8DBDE" stroke="#636970"/>

    <text x="16" y="28" font-size="13" font-weight="700" fill="#1C1F23">Khung truyền gần nhất</text>
    <text x="16" y="46" font-size="10" fill="#4A4F55">Ghi lại giao dịch mà chu kỳ quét bình</text>
    <text x="16" y="60" font-size="10" fill="#4A4F55">thường đã thực hiện — màn hình này</text>
    <text x="16" y="74" font-size="10" fill="#4A4F55">không tự phát gì ra bus.</text>

    <!-- Hai nút xuống hàng riêng, đủ 44px chiều cao chạm -->
    <rect x="16" y="86" width="170" height="40" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="72" y="111" font-size="12" fill="#1C1F23">Tải lại</text>
    <rect x="196" y="86" width="178" height="40" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="222" y="111" font-size="12" fill="#1C1F23">Theo dõi liên tục</text>

    <rect x="16" y="138" width="358" height="56" rx="6" fill="#E5E6E8" stroke="#636970"/>
    <text x="28" y="156" font-size="9" fill="#4A4F55">Vòng nhớ nằm trong tiến trình iobus: mất khi</text>
    <text x="28" y="170" font-size="9" fill="#4A4F55">dịch vụ khởi động lại, và không có byte thô —</text>
    <text x="28" y="184" font-size="9" fill="#4A4F55">soi từng byte thì phải dùng máy phân tích bus.</text>

    <!-- Khung cuộn ngang: bảng giữ min-width 720, KHÔNG xuống dòng -->
    <rect x="16" y="206" width="358" height="418" rx="6" fill="#D8DBDE" stroke="#636970"/>
    <rect x="16" y="206" width="358" height="28" rx="6" fill="#C2C6CA"/>
    <g font-size="9" fill="#4A4F55" letter-spacing="0.3">
      <text x="26" y="224">THỜI ĐIỂM</text>
      <text x="110" y="224">BUS</text>
      <text x="150" y="224">SLAVE</text>
      <text x="205" y="224">FC</text>
      <text x="240" y="224">ĐỊA CHỈ</text>
      <text x="305" y="224">SỐ LG…</text>
    </g>
    <line x1="16" y1="234" x2="374" y2="234" stroke="#636970"/>

    <g font-size="10" font-family="monospace" fill="#1C1F23">
      <text x="26" y="254">13:21:47</text><text x="110" y="254">1</text><text x="150" y="254">7</text><text x="205" y="254">3</text><text x="240" y="254">100</text><text x="305" y="254">2</text>
      <line x1="16" y1="264" x2="374" y2="264" stroke="#636970"/>
      <text x="26" y="284">13:21:47</text><text x="110" y="284">1</text><text x="150" y="284">4</text><text x="205" y="284">4</text><text x="240" y="284">20</text><text x="305" y="284">1</text>
      <line x1="16" y1="294" x2="374" y2="294" stroke="#636970"/>
      <text x="26" y="314">13:21:46</text><text x="110" y="314">1</text><text x="150" y="314">9</text><text x="205" y="314">3</text><text x="240" y="314">0</text><text x="305" y="314">4</text>
      <line x1="16" y1="324" x2="374" y2="324" stroke="#636970"/>
      <text x="26" y="344">13:21:46</text><text x="110" y="344">1</text><text x="150" y="344">9</text><text x="205" y="344">3</text><text x="240" y="344">0</text><text x="305" y="344">4</text>
      <line x1="16" y1="354" x2="374" y2="354" stroke="#636970"/>
      <text x="26" y="374">13:21:45</text><text x="110" y="374">2</text><text x="150" y="374">3</text><text x="205" y="374">3</text><text x="240" y="374">40</text><text x="305" y="374">6</text>
    </g>

    <!-- Chỉ báo cuộn -->
    <rect x="16" y="596" width="358" height="28" rx="6" fill="#C2C6CA"/>
    <rect x="24" y="606" width="150" height="8" rx="4" fill="#636970"/>
    <text x="190" y="614" font-size="9" fill="#4A4F55">← cuộn ngang để xem KẾT QUẢ · THỜI LƯỢNG · LẦN PHÁT</text>

    <text x="16" y="654" font-size="9" fill="#4A4F55">Bảng KHÔNG được rút gọn cột ở mobile. Bỏ cột</text>
    <text x="16" y="668" font-size="9" fill="#4A4F55">LẦN PHÁT sẽ khiến ba dòng TIMEOUT liên tiếp</text>
    <text x="16" y="682" font-size="9" fill="#4A4F55">đọc thành ba lần mất kết nối, trong khi thật ra</text>
    <text x="16" y="696" font-size="9" fill="#4A4F55">là một chu kỳ đọc đã phát lại ba lượt.</text>
  </g>

  <!-- ============ MOBILE 2 — 503 ============ -->
  <g transform="translate(424,36)">
    <rect x="0" y="0" width="390" height="740" rx="8" fill="#D8DBDE" stroke="#636970"/>

    <text x="16" y="28" font-size="13" font-weight="700" fill="#1C1F23">Khung truyền gần nhất</text>
    <text x="16" y="46" font-size="10" fill="#4A4F55">Ghi lại giao dịch mà chu kỳ quét bình</text>
    <text x="16" y="60" font-size="10" fill="#4A4F55">thường đã thực hiện — màn hình này</text>
    <text x="16" y="74" font-size="10" fill="#4A4F55">không tự phát gì ra bus.</text>

    <rect x="16" y="86" width="170" height="40" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="72" y="111" font-size="12" fill="#1C1F23">Tải lại</text>
    <rect x="196" y="86" width="178" height="40" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="222" y="111" font-size="12" fill="#1C1F23">Theo dõi liên tục</text>

    <rect x="16" y="138" width="358" height="92" rx="6" fill="#EEE9DB" stroke="#826500" stroke-width="2"/>
    <text x="28" y="160" font-size="11" font-weight="700" fill="#634D00">503 iobus không trả được</text>
    <text x="28" y="176" font-size="11" font-weight="700" fill="#634D00">khung: op không được hỗ trợ</text>
    <text x="28" y="192" font-size="11" font-weight="700" fill="#634D00">(unsupported)</text>
    <text x="28" y="214" font-size="9" fill="#4A4F55">Nguyên văn lý do được giữ lại.</text>

    <text x="16" y="264" font-size="11" font-weight="700" fill="#1C1F23">Không có bảng, không có dòng</text>
    <text x="16" y="280" font-size="11" font-weight="700" fill="#1C1F23">"chưa có giao dịch nào".</text>
    <text x="16" y="306" font-size="9" fill="#4A4F55">Ở khổ mobile chỉ có một khối hiển thị mỗi lần,</text>
    <text x="16" y="320" font-size="9" fill="#4A4F55">nên nhầm "không đọc được" thành "bus im lặng"</text>
    <text x="16" y="334" font-size="9" fill="#4A4F55">còn dễ xảy ra hơn desktop — hai trạng thái vì</text>
    <text x="16" y="348" font-size="9" fill="#4A4F55">thế không bao giờ được hiển thị cùng lúc.</text>
  </g>
</svg>
