    <rect x="24" y="212" width="636" height="58" rx="6" fill="#E0E6EC" stroke="#26527C"/>
    <text x="40" y="232" font-size="10.5" font-weight="700" fill="#26527C">Huỷ ở đây có nghĩa gì</text>
    <text x="40" y="248" font-size="10.5" fill="#4A4F55">Huỷ DỪNG các điểm CHƯA gửi. Điểm đã gửi vẫn đang bị ép và phải nhả riêng —</text>
    <text x="40" y="262" font-size="10.5" fill="#4A4F55">hộp thoại kết quả nói rõ điều đó và đưa thẳng danh sách cần nhả, không im lặng.</text>

