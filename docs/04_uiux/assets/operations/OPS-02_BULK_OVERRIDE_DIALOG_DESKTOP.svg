    <text x="414" y="130" font-size="11.5" fill="#634D00">thời hạn, kể cả khi bạn đóng trình duyệt. Không có bộ chọn mức ưu tiên: mọi lệnh từ web là mức 2.</text>

    <!-- bảng hậu quả -->
    <text x="356" y="170" font-size="11" font-weight="700" fill="#1C1F23">Từng điểm sẽ đổi như sau — kiểm lại trước khi xác nhận:</text>
