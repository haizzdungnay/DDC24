<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>OPS-02 Hộp thoại ép tay hàng loạt trên Monitor — desktop 1440, ba trạng thái</title>
  <desc>Ba artboard đặc tả BulkOverrideDialog: xác nhận trước khi gửi, đang gửi tuần tự, và kết quả hỗn hợp có điểm hỏng. Màu lấy từ token LIGHT trong apps/web-ui/src/shared/theme/tokens.ts. Dữ liệu là MINH HOẠ, không phải dữ liệu runtime.</desc>

  <rect width="1440" height="1240" fill="#C8CCD0"/>

