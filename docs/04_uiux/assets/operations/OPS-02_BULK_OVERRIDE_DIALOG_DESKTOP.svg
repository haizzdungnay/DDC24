  <!-- Bảng ánh xạ -->
  <text x="24" y="1046" font-size="12" font-weight="700" fill="#4A4F55">Ánh xạ vùng → field → API → state → action → RBAC (DOC_GOVERNANCE §2.2)</text>
  <g transform="translate(24,1058)">
    <rect x="0" y="0" width="1392" height="164" rx="8" fill="#D8DBDE" stroke="#636970"/>
    <g font-size="10" fill="#4A4F55"><text x="16" y="24">VÙNG</text><text x="200" y="24">FIELD</text><text x="400" y="24">API</text><text x="700" y="24">LỖI</text><text x="960" y="24">RBAC</text><text x="1090" y="24">TEST KHOÁ</text></g>
    <line x1="16" y1="32" x2="1376" y2="32" stroke="#636970"/>
    <g font-size="10.5" fill="#1C1F23">
      <text x="16" y="54">Ô chọn từng hàng</text><text x="200" y="54">kind ∈ {DO,AO} · writable</text><text x="400" y="54">GET /points</text><text x="700" y="54">—</text><text x="960" y="54">operator</text><text x="1090" y="54">UI không ép được ⇒ ô vô hiệu</text>
      <text x="16" y="78">Bảng hậu quả</text><text x="200" y="78">value hiện tại → value mới</text><text x="400" y="78">GET /points</text><text x="700" y="78">value undefined ⇒ “—”</text><text x="960" y="78">operator</text><text x="1090" y="78">không điền sẵn giá trị đoán</text>
      <text x="16" y="102">Thời hạn dùng chung</text><text x="200" y="102">ttlS (giây)</text><text x="400" y="102">PUT /points/{id} {value,ttlS}</text><text x="700" y="102">≤ 0 ⇒ chặn tại client</text><text x="960" y="102">operator</text><text x="1090" y="102">Core cưỡng chế TTL, không phải tab</text>
      <text x="16" y="126">Gửi tuần tự</text><text x="200" y="126">một request mỗi điểm</text><text x="400" y="126">PUT /points/{id} (n lần)</text><text x="700" y="126">lỗi từng điểm hiện riêng</text><text x="960" y="126">operator</text><text x="1090" y="126">1 điểm hỏng ⇒ n−1 điểm vẫn ép</text>
      <text x="16" y="150">Vết kiểm toán</text><text x="200" y="150">audit.PointForce mỗi lệnh</text><text x="400" y="150">backend tự ghi</text><text x="700" y="150">—</text><text x="960" y="150">operator</text><text x="1090" y="150">n lệnh ⇒ n vết, không phải 1</text>
    </g>
  </g>
</svg>
