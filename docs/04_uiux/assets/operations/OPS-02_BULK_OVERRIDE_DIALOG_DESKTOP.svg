    <line x1="372" y1="208" x2="1068" y2="208" stroke="#636970"/>
    <g font-size="11" fill="#1C1F23">
      <text x="372" y="228" font-family="monospace" font-weight="700">DO-01</text><text x="470" y="228">Bơm nước lạnh 1</text><text x="700" y="228" font-family="monospace">OFF</text><text x="800" y="228" font-weight="700" fill="#26527C">→</text><text x="840" y="228" font-family="monospace" font-weight="700">ON</text><text x="980" y="228" font-size="10">bơm chạy</text>
      <text x="372" y="256" font-family="monospace" font-weight="700">DO-02</text><text x="470" y="256">Quạt cấp AHU-1</text><text x="700" y="256" font-family="monospace">OFF</text><text x="800" y="256" font-weight="700" fill="#26527C">→</text><text x="840" y="256" font-family="monospace" font-weight="700">ON</text><text x="980" y="256" font-size="10">quạt chạy</text>
      <text x="372" y="284" font-family="monospace" font-weight="700">AO-01</text><text x="470" y="284">Van nước lạnh AHU-1</text><text x="700" y="284" font-family="monospace">0.0 %</text><text x="800" y="284" font-weight="700" fill="#26527C">→</text><text x="840" y="284" font-family="monospace" font-weight="700">100.0 %</text><text x="980" y="284" font-size="10">van mở hoàn toàn</text>
    </g>
    <text x="372" y="308" font-size="10" font-style="italic" fill="#4A4F55">Điểm không có số đo hiện tại hiện “—” ở cột HIỆN TẠI; không điền sẵn giá trị đoán vào ô “SẼ THÀNH”.</text>

    <!-- nhập liệu -->
    <text x="356" y="346" font-size="11" font-weight="700" fill="#1C1F23">Giá trị mới cho nhóm nhị phân (DO-01, DO-02)</text>
    <rect x="356" y="354" width="340" height="34" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <text x="372" y="376" font-size="12" font-family="monospace" fill="#1C1F23">ON</text>
    <text x="676" y="376" font-size="11" fill="#4A4F55">▾</text>

    <text x="728" y="346" font-size="11" font-weight="700" fill="#1C1F23">Giá trị mới cho nhóm analog (AO-01)</text>
