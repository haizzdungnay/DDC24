    <rect x="902" y="530" width="182" height="36" rx="6" fill="#C2C6CA" stroke="#636970" stroke-dasharray="4 3"/>
    <text x="918" y="553" font-size="12" font-weight="700" fill="#4A4F55">Áp dụng cho 3 điểm</text>
    <text x="356" y="553" font-size="10" fill="#4A4F55">Nút Áp dụng ĐANG BỊ VÔ HIỆU vì chưa tick ô xác nhận — trạng thái vô hiệu có viền đứt + chữ mờ, không chỉ đổi màu.</text>
