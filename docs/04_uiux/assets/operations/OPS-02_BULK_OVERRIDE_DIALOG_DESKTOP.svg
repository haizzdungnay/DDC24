    <rect x="372" y="484" width="15" height="15" rx="3" fill="#D8DBDE" stroke="#26527C" stroke-width="2"/>
    <text x="400" y="497" font-size="11.5" fill="#1C1F23">Tôi đã đọc bảng hậu quả phía trên và chịu trách nhiệm cho 3 lệnh này.</text>
    <text x="884" y="497" font-size="10" font-style="italic" fill="#4A4F55">Bắt buộc tick để bật nút Áp dụng</text>

