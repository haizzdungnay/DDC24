    <text x="1092" y="86" font-size="11" fill="#26527C">Bỏ chọn tất cả</text>
    <rect x="1238" y="70" width="164" height="24" rx="5" fill="#F7E0E1" stroke="#CC1F28" stroke-width="2"/>
    <text x="1252" y="86" font-size="11" font-weight="700" fill="#A01017">Ép tay 3 điểm…</text>

    <g font-size="10" fill="#4A4F55">
