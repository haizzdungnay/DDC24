    <text x="744" y="376" font-size="12" font-family="monospace" fill="#1C1F23">100.0</text>
    <text x="1050" y="376" font-size="11" fill="#4A4F55">%</text>

    <text x="356" y="414" font-size="11" font-weight="700" fill="#1C1F23">Thời hạn dùng chung (phút) — do bộ điều khiển cưỡng chế</text>
    <rect x="356" y="422" width="340" height="34" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <text x="372" y="444" font-size="12" font-family="monospace" fill="#1C1F23">10</text>
    <text x="712" y="444" font-size="10.5" fill="#4A4F55">Một thời hạn cho cả nhóm — đó là lý do tồn tại của hộp thoại này.</text>

