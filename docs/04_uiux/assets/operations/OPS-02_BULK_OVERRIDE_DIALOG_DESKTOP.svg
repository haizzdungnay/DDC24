      <text x="300" y="158" font-family="monospace" font-weight="700">DO-01</text><text x="404" y="158">Bơm nước lạnh 1</text><text x="700" y="158" font-family="monospace">OFF</text><text x="820" y="158">Bình thường</text><text x="1010" y="158" font-family="monospace" fill="#4A4F55">—</text>
      <rect x="252" y="176" width="14" height="14" rx="3" fill="#26527C"/><path d="M255 183 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
      <text x="300" y="188" font-family="monospace" font-weight="700">DO-02</text><text x="404" y="188">Quạt cấp AHU-1</text><text x="700" y="188" font-family="monospace">OFF</text><text x="820" y="188">Bình thường</text><text x="1010" y="188" font-family="monospace" fill="#4A4F55">—</text>
      <rect x="252" y="206" width="14" height="14" rx="3" fill="#26527C"/><path d="M255 213 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
      <text x="300" y="218" font-family="monospace" font-weight="700">AO-01</text><text x="404" y="218">Van nước lạnh AHU-1</text><text x="700" y="218" font-family="monospace">0.0 %</text><text x="820" y="218">Bình thường</text><text x="1010" y="218" font-family="monospace" fill="#4A4F55">—</text>
