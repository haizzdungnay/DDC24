      <circle cx="36" cy="118" r="9" fill="none" stroke="#165B2E" stroke-width="2"/><path d="M31 118 l4 4 l7 -8" fill="none" stroke="#165B2E" stroke-width="2"/>
      <text x="56" y="122" font-family="monospace" font-weight="700" fill="#1C1F23">DO-02</text><text x="150" y="122" fill="#1C1F23">→ ON</text><text x="260" y="122" font-weight="700" fill="#165B2E">ĐÃ ÉP</text><text x="360" y="122" fill="#4A4F55" font-size="10.5">còn 09:57</text>
