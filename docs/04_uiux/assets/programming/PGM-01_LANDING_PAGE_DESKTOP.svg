<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">PGM-01 - Landing page Programming trên desktop</title>
  <desc id="desc">Bản đặc tả trực quan 1440 x 900, phân biệt bản đang sửa r17 và bản đang vận hành r15, hiển thị trạng thái Core, việc cần chú ý và hoạt động kỹ thuật.</desc>
