<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">PGM-01 - Landing page Programming trên mobile</title>
  <desc id="desc">Bản đặc tả trực quan 390 x 844, nội dung xếp một cột, giữ rõ bản đang sửa, bản đang vận hành và vấn đề cần chú ý.</desc>
  <style>
