    <line x1="844" y1="300" x2="1404" y2="300" stroke="#636970"/>
    <text x="844" y="324" font-size="12" font-weight="700" fill="#1C1F23">Ảnh hưởng tới đầu ra</text>
    <text x="844" y="348" font-size="11" fill="#1C1F23">4 đầu ra do Program điều khiển sẽ đổi giá trị đề xuất.</text>
    <text x="844" y="368" font-size="11" fill="#1C1F23">Giá trị cũ được giữ tới khi chu kỳ đầu chạy xong.</text>

    <!-- Impact -->
    <rect x="252" y="412" width="1168" height="316" rx="8" fill="#D8DBDE" stroke="#636970"/>
    <text x="268" y="436" font-size="13" font-weight="700" fill="#1C1F23">Ảnh hưởng cần biết trước khi xác nhận</text>

    <rect x="268" y="452" width="368" height="120" rx="6" fill="#EEE9DB" stroke="#826500"/>
    <text x="284" y="474" font-size="12" font-weight="700" fill="#826500">Trạng thái lưu sẽ khởi tạo lại</text>
    <text x="284" y="496" font-size="11" fill="#1C1F23">Trạng thái điều khiển đã lưu không còn</text>
    <text x="284" y="512" font-size="11" fill="#1C1F23">tương thích. 2 giá trị RETAIN bị ảnh hưởng</text>
    <text x="284" y="528" font-size="11" fill="#1C1F23">sẽ được khởi tạo lại.</text>
    <text x="284" y="552" font-size="11" fill="#26527C">Xem danh sách biến →</text>

    <rect x="652" y="452" width="368" height="120" rx="6" fill="#E9E3F1" stroke="#693797"/>
    <text x="668" y="474" font-size="12" font-weight="700" fill="#693797">1 override thủ công đang giữ đầu ra</text>
    <text x="668" y="496" font-size="11" fill="#1C1F23">AHU01_SAV · mức 2 · do vanhanh@plant</text>
    <text x="668" y="512" font-size="11" fill="#1C1F23">giá trị 65 % · còn 42 phút</text>
    <text x="668" y="536" font-size="11" fill="#1C1F23">Program sẽ không thắng ở đầu ra này.</text>
    <text x="668" y="558" font-size="11" fill="#26527C">Mở danh sách override →</text>

    <rect x="1036" y="452" width="368" height="120" rx="6" fill="#E5E6E8" stroke="#636970"/>
    <text x="1052" y="474" font-size="12" font-weight="700" fill="#1C1F23">Chuyển quyền điều khiển</text>
    <text x="1052" y="496" font-size="11" fill="#1C1F23">GRAPH_ONLY → PROGRAM_ONLY</text>
    <text x="1052" y="512" font-size="11" fill="#1C1F23">Đã sao lưu cấu hình graph hiện tại.</text>
    <text x="1052" y="536" font-size="11" fill="#1C1F23">Quay lui sẽ khôi phục bản sao lưu này.</text>
    <text x="1052" y="558" font-size="11" fill="#26527C">Xem bản sao lưu →</text>

    <text x="268" y="606" font-size="12" font-weight="700" fill="#1C1F23">Đầu ra bị ảnh hưởng</text>
    <line x1="268" y1="616" x2="1404" y2="616" stroke="#636970"/>
    <g font-size="11" fill="#4A4F55">
      <text x="268" y="636">Điểm</text>
      <text x="500" y="636">Giá trị hiện tại</text>
      <text x="700" y="636">Đề xuất mới</text>
      <text x="900" y="636">Bên đang giữ</text>
      <text x="1150" y="636">Mức ưu tiên</text>
    </g>
    <g font-size="11" fill="#1C1F23">
      <text x="268" y="660">AHU01_SAT_CMD</text><text x="500" y="660">18,0 °C</text><text x="700" y="660">17,5 °C</text><text x="900" y="660">Program</text><text x="1150" y="660">5</text>
      <text x="268" y="684">AHU01_SAV</text><text x="500" y="684">65 %</text><text x="700" y="684">48 %</text><text x="900" y="684" fill="#693797">Override thủ công</text><text x="1150" y="684">2</text>
      <text x="268" y="708">CHW_PUMP_01</text><text x="500" y="708">Bật</text><text x="700" y="708">Bật</text><text x="900" y="708">Program</text><text x="1150" y="708">5</text>
    </g>

    <!-- Footer bar -->
    <rect x="252" y="744" width="1168" height="72" rx="8" fill="#D8DBDE" stroke="#636970"/>
    <text x="272" y="774" font-size="12" fill="#1C1F23">Cần xác nhận 3 mục có ảnh hưởng thật: trạng thái lưu, override thủ công, chuyển quyền điều khiển.</text>
    <text x="272" y="796" font-size="11" fill="#4A4F55">Mục nào không có ảnh hưởng thì không hiện ô xác nhận.</text>
    <rect x="1148" y="762" width="112" height="36" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="1172" y="785" font-size="12" fill="#1C1F23">Hủy</text>
    <rect x="1276" y="762" width="128" height="36" rx="6" fill="#26527C"/>
    <text x="1290" y="785" font-size="12" font-weight="700" fill="#FFFFFF">Xác nhận…</text>

    <text x="252" y="864" font-size="10" fill="#4A4F55">Đặc tả thiết kế — dữ liệu minh họa, không phải dữ liệu runtime.</text>
  </g>

  <!-- ============ ARTBOARD 2 ============ -->
  <text x="24" y="984" font-size="12" font-weight="700" fill="#4A4F55">Artboard 2 — Modal xác nhận mạnh, có xác thực lại (1440 × 560)</text>
  <g transform="translate(0,996)">
    <rect x="0" y="0" width="1440" height="540" fill="#C8CCD0" stroke="#636970"/>
    <rect x="0" y="0" width="1440" height="540" fill="#1C1F23" fill-opacity="0.45"/>

    <rect x="400" y="40" width="640" height="460" rx="10" fill="#D8DBDE" stroke="#4C5056" stroke-width="2"/>
    <text x="428" y="76" font-size="16" font-weight="700" fill="#1C1F23">Đưa r17 vào vận hành?</text>
    <text x="428" y="100" font-size="12" fill="#4A4F55">Thao tác này thay chương trình đang điều khiển thiết bị thật.</text>
    <line x1="428" y1="116" x2="1012" y2="116" stroke="#636970"/>

    <rect x="428" y="132" width="584" height="42" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <rect x="440" y="145" width="16" height="16" rx="3" fill="#26527C"/>
    <text x="444" y="158" font-size="12" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="468" y="152" font-size="12" fill="#1C1F23">Tôi hiểu 2 giá trị RETAIN sẽ được khởi tạo lại.</text>
    <text x="468" y="168" font-size="11" fill="#4A4F55">Bộ tích phân PID của AHU-01 sẽ bắt đầu lại từ 0.</text>

    <rect x="428" y="184" width="584" height="42" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <rect x="440" y="197" width="16" height="16" rx="3" fill="#26527C"/>
    <text x="444" y="210" font-size="12" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="468" y="204" font-size="12" fill="#1C1F23">Tôi biết AHU01_SAV đang bị override thủ công.</text>
    <text x="468" y="220" font-size="11" fill="#4A4F55">Program sẽ không thắng ở đầu ra đó cho tới khi override hết hạn.</text>

    <rect x="428" y="236" width="584" height="42" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <rect x="440" y="249" width="16" height="16" rx="3" fill="#C8CCD0" stroke="#4C5056"/>
    <text x="468" y="256" font-size="12" fill="#1C1F23">Tôi xác nhận chuyển quyền điều khiển sang PROGRAM_ONLY.</text>
    <text x="468" y="272" font-size="11" fill="#CC1F28">Chưa tích — nút xác nhận còn khóa.</text>

    <text x="428" y="308" font-size="11" fill="#4A4F55">Chỉ hiện ô xác nhận cho ảnh hưởng có thật. Lần này không có thay đổi</text>
    <text x="428" y="324" font-size="11" fill="#4A4F55">ánh xạ nào cần xác nhận riêng, nên không có ô thứ tư.</text>

    <line x1="428" y1="344" x2="1012" y2="344" stroke="#636970"/>
    <text x="428" y="370" font-size="12" font-weight="700" fill="#1C1F23">Nhập lại mật khẩu để xác thực</text>
    <rect x="428" y="382" width="336" height="34" rx="6" fill="#C8CCD0" stroke="#26527C" stroke-width="2"/>
    <text x="442" y="404" font-size="12" fill="#4A4F55">••••••••</text>
    <text x="428" y="434" font-size="11" fill="#4A4F55">Nếu mất phản hồi, kết quả chuyển “Chưa xác định”. Hệ thống sẽ hỏi lại</text>
    <text x="428" y="450" font-size="11" fill="#4A4F55">trạng thái Core, không tự gửi lệnh lần hai.</text>

    <rect x="756" y="440" width="112" height="38" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="782" y="464" font-size="12" fill="#1C1F23">Hủy</text>
    <rect x="884" y="440" width="128" height="38" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="898" y="464" font-size="12" font-weight="700" fill="#4A4F55">Đưa vào vận hành</text>
    <text x="884" y="496" font-size="10" fill="#4A4F55">Khóa tới khi đủ xác nhận và mật khẩu</text>
  </g>

  <text x="24" y="1552" font-size="10" fill="#4A4F55">Đặc tả thiết kế — dữ liệu minh họa, không phải dữ liệu runtime.</text>
