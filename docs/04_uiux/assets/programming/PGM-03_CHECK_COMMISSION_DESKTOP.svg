<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1560" viewBox="0 0 1440 1560" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>PGM-03 Kiểm tra và Đưa vào vận hành — desktop 1440 x 900 kèm modal xác nhận</title>
  <desc>Hai artboard: trạng thái sẵn sàng đưa vào vận hành, và modal xác nhận mạnh theo rủi ro thực tế. Dữ liệu là minh họa, không phải dữ liệu runtime.</desc>

  <rect width="1440" height="1560" fill="#C8CCD0"/>

  <!-- ============ ARTBOARD 1 ============ -->
  <text x="24" y="24" font-size="12" font-weight="700" fill="#4A4F55">Artboard 1 — PGM-03 trạng thái READY (1440 × 900)</text>
  <g transform="translate(0,36)">
    <rect x="0" y="0" width="1440" height="900" fill="#C8CCD0" stroke="#636970"/>

    <!-- NavRail -->
    <rect x="0" y="0" width="232" height="900" fill="#D8DBDE"/>
    <line x1="232" y1="0" x2="232" y2="900" stroke="#636970"/>
    <text x="20" y="38" font-size="15" font-weight="700" fill="#1C1F23">MK-DDC-24</text>
    <text x="20" y="58" font-size="11" fill="#4A4F55">DDC-24-01 · Plant-A</text>
    <rect x="8" y="204" width="216" height="34" rx="6" fill="#E0E6EC"/>
    <rect x="8" y="204" width="3" height="34" fill="#26527C"/>
    <text x="20" y="226" font-size="13" font-weight="700" fill="#26527C">Lập trình</text>
    <g font-size="12" fill="#4A4F55">
      <text x="34" y="256">Tổng quan</text>
      <text x="34" y="284">Thiết kế</text>
