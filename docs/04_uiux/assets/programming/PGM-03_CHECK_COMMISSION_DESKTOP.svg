    <rect x="20" y="294" width="204" height="26" rx="5" fill="#C2C6CA"/>
    <text x="34" y="312" font-size="12" font-weight="700" fill="#1C1F23">Kiểm tra &amp; Vận hành</text>
    <text x="34" y="340" font-size="12" fill="#4A4F55">Runtime &amp; Bảo trì</text>

    <!-- TopBar -->
    <rect x="232" y="0" width="1208" height="64" fill="#D8DBDE"/>
    <line x1="232" y1="64" x2="1440" y2="64" stroke="#636970"/>
    <text x="252" y="30" font-size="12" fill="#4A4F55">Lập trình / Kiểm tra &amp; Đưa vào vận hành</text>
    <text x="252" y="50" font-size="17" font-weight="700" fill="#1C1F23">Kiểm tra &amp; Đưa vào vận hành</text>
