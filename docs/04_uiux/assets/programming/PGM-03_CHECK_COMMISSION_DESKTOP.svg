    <rect x="1284" y="18" width="136" height="30" rx="6" fill="#26527C"/>
    <text x="1296" y="38" font-size="12" font-weight="700" fill="#FFFFFF">Đưa vào vận hành</text>

    <!-- Context -->
    <rect x="252" y="80" width="1168" height="48" rx="8" fill="#D8DBDE" stroke="#636970"/>
    <text x="272" y="100" font-size="11" fill="#4A4F55">BẢN ỨNG VIÊN</text>
    <text x="272" y="115" font-size="13" font-weight="700" fill="#1C1F23">r17 · đã niêm phong</text>
    <text x="430" y="108" font-size="15" fill="#4A4F55">→</text>
    <text x="470" y="100" font-size="11" fill="#4A4F55">ĐANG VẬN HÀNH</text>
    <text x="470" y="115" font-size="13" font-weight="700" fill="#1C1F23">r15 · RUNNING</text>
    <line x1="680" y1="88" x2="680" y2="120" stroke="#636970"/>
    <circle cx="700" cy="104" r="5" fill="#227742"/>
    <text x="714" y="108" font-size="12" fill="#1C1F23">Core sẵn sàng</text>
    <rect x="1180" y="92" width="220" height="24" rx="12" fill="#E0ECE5"/>
    <text x="1196" y="108" font-size="12" font-weight="700" fill="#227742">✓ Sẵn sàng đưa vào vận hành</text>

    <!-- Readiness -->
    <rect x="252" y="144" width="556" height="252" rx="8" fill="#D8DBDE" stroke="#636970"/>
    <text x="268" y="168" font-size="13" font-weight="700" fill="#1C1F23">Kết quả kiểm tra</text>
    <text x="620" y="168" font-size="11" fill="#4A4F55">Hoàn tất 14:41 · 1,8 giây</text>
    <g font-size="12">
      <text x="268" y="198" fill="#227742">✓</text><text x="292" y="198" fill="#1C1F23">Cú pháp và kiểu</text>
      <text x="268" y="226" fill="#227742">✓</text><text x="292" y="226" fill="#1C1F23">Cấu trúc FBD</text>
      <text x="268" y="254" fill="#227742">✓</text><text x="292" y="254" fill="#1C1F23">Ánh xạ Điểm</text>
      <text x="268" y="282" fill="#227742">✓</text><text x="292" y="282" fill="#1C1F23">Tác vụ và thứ tự chạy</text>
      <text x="268" y="310" fill="#227742">✓</text><text x="292" y="310" fill="#1C1F23">Tương thích thiết bị đích</text>
      <text x="268" y="338" fill="#826500">!</text><text x="292" y="338" fill="#1C1F23">Trạng thái lưu (RETAIN)</text>
      <text x="560" y="338" fill="#826500" font-size="11">2 biến sẽ khởi tạo lại</text>
      <text x="700" y="338" fill="#26527C" font-size="11">Xem</text>
    </g>
    <text x="268" y="374" font-size="11" fill="#4A4F55">Kiểm tra không thay đổi chương trình đang chạy.</text>

    <!-- Changes -->
    <rect x="828" y="144" width="592" height="252" rx="8" fill="#D8DBDE" stroke="#636970"/>
    <text x="844" y="168" font-size="13" font-weight="700" fill="#1C1F23">Thay đổi so với r15</text>
    <text x="1300" y="168" font-size="11" fill="#4A4F55">Do máy chủ tính</text>
    <g font-size="12" fill="#1C1F23">
      <text x="844" y="198">Chương trình</text><text x="1100" y="198" fill="#4A4F55">2 sửa · 1 thêm</text>
      <text x="844" y="226">Ánh xạ Điểm</text><text x="1100" y="226" fill="#4A4F55">3 sửa</text>
      <text x="844" y="254">Tác vụ</text><text x="1100" y="254" fill="#4A4F55">chu kỳ 5 s → 1 s</text>
      <text x="844" y="282">Thư viện lõi</text><text x="1100" y="282" fill="#4A4F55">không đổi</text>
