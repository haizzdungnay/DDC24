<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">PGM-03 xác nhận xoá Published Signal và impact consumer</title>
  <desc id="desc">Đặc tả trực quan modal nguy hiểm, hiển thị provenance Check, consumer bị ảnh hưởng, hành động giữ hoặc xoá khỏi Draft và xác nhận không Commission.</desc>
  <rect width="1120" height="720" fill="#132238" opacity="0.34"/>
  <rect x="210" y="92" width="700" height="536" rx="12" fill="#ffffff" stroke="#b8c3d1" stroke-width="2"/>
  <text x="250" y="146" fill="#132238" font-family="sans-serif" font-size="24" font-weight="700">Xác nhận xoá Published Signal</text>
  <text x="250" y="190" fill="#27384d" font-family="sans-serif" font-size="16">Signal SUPPLY_TEMP sẽ bị xoá khỏi Draft.</text>
  <text x="250" y="220" fill="#526274" font-family="sans-serif" font-size="15">Thao tác không Commission và chỉ hoàn tất sau read-back từ máy chủ.</text>
  <rect x="250" y="252" width="620" height="56" rx="7" fill="#fff4e5" stroke="#c77816"/>
  <text x="270" y="286" fill="#824d0f" font-family="sans-serif" font-size="15" font-weight="700">Check xác nhận 2 consumer bị ảnh hưởng · AUTHORITATIVE</text>
  <rect x="250" y="330" width="620" height="150" rx="7" fill="#f7f9fb" stroke="#d5dce5"/>
  <text x="270" y="366" fill="#132238" font-family="monospace" font-size="15" font-weight="700">AHU_CONTROL · ST:42:9</text>
  <text x="270" y="392" fill="#526274" font-family="sans-serif" font-size="14">Mở đúng POU và vị trí đọc signal</text>
  <line x1="270" y1="412" x2="850" y2="412" stroke="#d5dce5"/>
  <text x="270" y="446" fill="#132238" font-family="monospace" font-size="15" font-weight="700">ZONE_DEMAND · FBD:7:4</text>
  <text x="270" y="472" fill="#526274" font-family="sans-serif" font-size="14">Nguồn: Check chk-… · Draft hash khớp</text>
  <rect x="534" y="540" width="150" height="48" rx="7" fill="#ffffff" stroke="#8492a6"/>
  <text x="567" y="570" fill="#27384d" font-family="sans-serif" font-size="15" font-weight="700">Giữ signal</text>
  <rect x="700" y="540" width="170" height="48" rx="7" fill="#b42318"/>
  <text x="728" y="570" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">Xoá khỏi Draft</text>
  <text x="210" y="670" fill="#ffffff" font-family="sans-serif" font-size="13">Dữ liệu minh hoạ · trạng thái stale/pending/unavailable thay khối consumer bằng “Impact chưa được kiểm chứng”</text>
</svg>
