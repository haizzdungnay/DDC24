<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>PGM-06 hộp thoại Đặt lại trạng thái lưu RETAIN — trạng thái đang mở, đang gửi và bị khóa</title>
  <desc>Ba artboard đặc tả RetainResetDialog: xác nhận mạnh kèm xác thực lại khi đang mở, trạng thái đang gửi không có kết quả lạc quan, và trạng thái bị khóa khi Core không đọc được. Dữ liệu là minh họa, không phải dữ liệu runtime.</desc>

  <rect width="1440" height="1120" fill="#C8CCD0"/>

  <!-- ============ ARTBOARD 1 — ĐANG MỞ ============ -->
  <text x="24" y="24" font-size="12" font-weight="700" fill="#4A4F55">Artboard 1 — RetainResetDialog trạng thái “đang mở” (1440 × 620)</text>
  <g transform="translate(0,36)">
    <rect x="0" y="0" width="1440" height="600" fill="#C8CCD0" stroke="#636970"/>

    <!-- Nền: PGM-06 tab Phiên bản & Bảo trì, vùng nguy hiểm -->
    <rect x="0" y="0" width="232" height="600" fill="#D8DBDE"/>
    <line x1="232" y1="0" x2="232" y2="600" stroke="#636970"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#1C1F23">MK-DDC-24</text>
    <text x="20" y="54" font-size="11" fill="#4A4F55">DDC-24-01 · Plant-A</text>
    <rect x="8" y="120" width="216" height="34" rx="6" fill="#E0E6EC"/>
    <rect x="8" y="120" width="3" height="34" fill="#26527C"/>
    <text x="20" y="142" font-size="13" font-weight="700" fill="#26527C">Lập trình</text>
    <g font-size="12" fill="#4A4F55">
      <text x="34" y="172">Tổng quan</text>
      <text x="34" y="200">Thiết kế</text>
      <text x="34" y="228">Kiểm tra &amp; Vận hành</text>
    </g>
    <rect x="20" y="238" width="204" height="26" rx="5" fill="#C2C6CA"/>
    <text x="34" y="256" font-size="12" font-weight="700" fill="#1C1F23">Runtime &amp; Bảo trì</text>

    <rect x="232" y="0" width="1208" height="60" fill="#D8DBDE"/>
    <line x1="232" y1="60" x2="1440" y2="60" stroke="#636970"/>
    <text x="252" y="28" font-size="12" fill="#4A4F55">Lập trình / Runtime &amp; Bảo trì</text>
    <text x="252" y="48" font-size="17" font-weight="700" fill="#1C1F23">Phiên bản &amp; Bảo trì</text>

    <!-- RuntimeTabs -->
    <g font-size="12">
      <text x="252" y="88" fill="#4A4F55">Runtime</text>
      <text x="340" y="88" fill="#4A4F55">Theo dõi</text>
      <rect x="424" y="72" width="176" height="24" rx="5" fill="#C2C6CA"/>
      <text x="438" y="88" font-weight="700" fill="#1C1F23">Phiên bản &amp; Bảo trì</text>
    </g>
    <line x1="252" y1="100" x2="1420" y2="100" stroke="#636970"/>

    <!-- DangerZone -->
    <rect x="252" y="120" width="1168" height="150" rx="8" fill="#D8DBDE" stroke="#8A5B22" stroke-width="2"/>
    <text x="272" y="146" font-size="13" font-weight="700" fill="#8A5B22">Vùng thao tác nguy hiểm</text>
    <text x="272" y="168" font-size="11" fill="#4A4F55">Ba thao tác dưới đây thay đổi hệ thống đang chạy. Chỉ quản trị viên thực hiện được; mọi thao tác đều ghi nhật ký kiểm toán.</text>
    <rect x="272" y="188" width="220" height="36" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="292" y="211" font-size="12" fill="#1C1F23">Khôi phục bản trước</text>
    <rect x="512" y="188" width="180" height="36" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="532" y="211" font-size="12" fill="#1C1F23">Nhập gói chương trình</text>
    <rect x="712" y="188" width="220" height="36" rx="6" fill="#F0E3E4" stroke="#CC1F28" stroke-width="2"/>
    <text x="732" y="211" font-size="12" font-weight="700" fill="#CC1F28">Đặt lại trạng thái lưu</text>
    <text x="272" y="248" font-size="11" fill="#4A4F55">Người xem thấy vùng này ở chế độ đọc kèm lý do, không thấy dãy nút vô hiệu hóa.</text>

    <!-- Lớp phủ -->
    <rect x="0" y="0" width="1440" height="600" fill="#1C1F23" fill-opacity="0.45"/>

    <!-- Hộp thoại -->
    <rect x="392" y="36" width="656" height="528" rx="10" fill="#D8DBDE" stroke="#4C5056" stroke-width="2"/>
    <rect x="392" y="36" width="656" height="6" rx="3" fill="#CC1F28"/>
    <text x="420" y="76" font-size="16" font-weight="700" fill="#1C1F23">Đặt lại trạng thái lưu (RETAIN)?</text>
    <text x="420" y="100" font-size="12" fill="#1C1F23">Trạng thái điều khiển đã lưu không còn tương thích. Các giá trị RETAIN bị</text>
    <text x="420" y="116" font-size="12" fill="#1C1F23">ảnh hưởng sẽ được khởi tạo lại.</text>
    <text x="420" y="136" font-size="11" fill="#4A4F55">Khóa chuỗi hiển thị: programming.retain.coldInit</text>
    <line x1="420" y1="150" x2="1020" y2="150" stroke="#636970"/>

    <!-- Danh sách biến bị ảnh hưởng -->
    <text x="420" y="176" font-size="13" font-weight="700" fill="#1C1F23">4 biến sẽ mất giá trị đang lưu</text>
    <text x="420" y="194" font-size="11" fill="#4A4F55">Danh sách do máy chủ tính; hộp thoại chỉ mở được khi đã tải xong danh sách này.</text>
    <rect x="420" y="204" width="600" height="120" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <g font-size="11">
      <text x="436" y="224" font-weight="700" fill="#4A4F55">BIẾN</text>
      <text x="700" y="224" font-weight="700" fill="#4A4F55">GIÁ TRỊ ĐANG LƯU</text>
      <text x="880" y="224" font-weight="700" fill="#4A4F55">SAU KHI ĐẶT LẠI</text>
      <line x1="436" y1="232" x2="1004" y2="232" stroke="#636970"/>
      <text x="436" y="252" fill="#1C1F23">AHU01_PID.integral</text>
      <text x="700" y="252" fill="#1C1F23">18,4</text>
      <text x="880" y="252" fill="#CC1F28">0,0 — khởi tạo lại</text>
      <text x="436" y="272" fill="#1C1F23">AHU01_PID.lastError</text>
      <text x="700" y="272" fill="#1C1F23">−1,2</text>
      <text x="880" y="272" fill="#CC1F28">0,0 — khởi tạo lại</text>
      <text x="436" y="292" fill="#1C1F23">PUMP01_RUNHOURS</text>
      <text x="700" y="292" fill="#1C1F23">2 417 h</text>
      <text x="880" y="292" fill="#CC1F28">0 h — khởi tạo lại</text>
      <text x="436" y="312" fill="#1C1F23">VAV02_HOLD.setpoint</text>
      <text x="700" y="312" fill="#1C1F23">21,5 °C</text>
      <text x="880" y="312" fill="#CC1F28">giá trị mặc định</text>
    </g>

    <!-- Xác nhận mạnh -->
    <rect x="420" y="338" width="600" height="44" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <rect x="434" y="352" width="16" height="16" rx="3" fill="#26527C"/>
    <text x="438" y="365" font-size="12" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="462" y="359" font-size="12" fill="#1C1F23">Tôi hiểu 4 giá trị RETAIN ở trên sẽ bị khởi tạo lại và không khôi phục được.</text>
    <text x="462" y="375" font-size="11" fill="#4A4F55">Bộ tích phân PID và giờ chạy tích lũy bắt đầu lại từ 0 ngay chu kỳ kế tiếp.</text>

    <!-- Xác thực lại -->
    <line x1="420" y1="396" x2="1020" y2="396" stroke="#636970"/>
    <text x="420" y="420" font-size="12" font-weight="700" fill="#1C1F23">Nhập lại mật khẩu để xác thực</text>
    <rect x="420" y="430" width="336" height="34" rx="6" fill="#C8CCD0" stroke="#26527C" stroke-width="2"/>
    <text x="434" y="452" font-size="12" fill="#4A4F55">••••••••</text>
    <text x="420" y="484" font-size="11" fill="#4A4F55">Máy chủ đặt lại tại biên an toàn của chu kỳ quét. Nếu mất phản hồi, kết quả</text>
    <text x="420" y="500" font-size="11" fill="#4A4F55">chuyển “Chưa xác định” và hệ thống hỏi lại trạng thái Core, không gửi lệnh lần hai.</text>

    <rect x="756" y="504" width="112" height="38" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="782" y="528" font-size="12" fill="#1C1F23">Hủy</text>
    <rect x="884" y="504" width="136" height="38" rx="6" fill="#CC1F28"/>
    <text x="898" y="528" font-size="12" font-weight="700" fill="#FFFFFF">Đặt lại RETAIN</text>
  </g>

  <!-- ============ ARTBOARD 2 — ĐANG GỬI ============ -->
  <text x="24" y="672" font-size="12" font-weight="700" fill="#4A4F55">Artboard 2 — trạng thái “đang gửi”: không có kết quả lạc quan (704 × 400)</text>
  <g transform="translate(0,684)">
    <rect x="0" y="0" width="704" height="400" fill="#C8CCD0" stroke="#636970"/>
    <rect x="0" y="0" width="704" height="400" fill="#1C1F23" fill-opacity="0.45"/>
    <rect x="32" y="28" width="640" height="344" rx="10" fill="#D8DBDE" stroke="#4C5056" stroke-width="2"/>
    <rect x="32" y="28" width="640" height="6" rx="3" fill="#CC1F28"/>
    <text x="60" y="68" font-size="16" font-weight="700" fill="#1C1F23">Đang đặt lại trạng thái lưu…</text>
    <text x="60" y="92" font-size="12" fill="#4A4F55">Thao tác op-4412 đã được ghi nhận. Kết quả chỉ hiện sau khi đọc ngược từ Core.</text>
    <line x1="60" y1="108" x2="644" y2="108" stroke="#636970"/>
    <g font-size="12">
      <circle cx="70" cy="136" r="6" fill="#227742"/>
      <text x="90" y="140" fill="#1C1F23">Đã ghi thao tác và nhật ký kiểm toán</text>
      <circle cx="70" cy="168" r="6" fill="#227742"/>
      <text x="90" y="172" fill="#1C1F23">Đã gửi yêu cầu tới Core</text>
      <circle cx="70" cy="200" r="6" fill="#C2C6CA" stroke="#636970"/>
      <text x="90" y="204" font-weight="700" fill="#1C1F23">Chờ biên an toàn của chu kỳ quét</text>
      <circle cx="70" cy="232" r="6" fill="#C8CCD0" stroke="#636970"/>
      <text x="90" y="236" fill="#4A4F55">Đọc ngược xác nhận bố cục RETAIN mới</text>
    </g>
    <rect x="60" y="256" width="584" height="46" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <text x="76" y="276" font-size="11" fill="#4A4F55">Không đóng bằng dấu tích khi chưa đọc ngược. Trạng thái hiển thị lấy từ</text>
    <text x="76" y="292" font-size="11" fill="#4A4F55">GET /operations/{operationId}, không suy từ mã HTTP 202.</text>
    <rect x="60" y="316" width="176" height="36" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="76" y="339" font-size="12" fill="#1C1F23">Kiểm tra lại trạng thái</text>
    <rect x="252" y="316" width="176" height="36" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="268" y="339" font-size="12" fill="#4A4F55">Đặt lại RETAIN</text>
    <text x="252" y="368" font-size="10" fill="#4A4F55">Khóa trong lúc gửi — không có nút gửi lại</text>
  </g>

  <!-- ============ ARTBOARD 3 — BỊ KHÓA ============ -->
  <text x="736" y="672" font-size="12" font-weight="700" fill="#4A4F55">Artboard 3 — bị khóa vì Core không đọc được (704 × 400)</text>
  <g transform="translate(736,684)">
    <rect x="0" y="0" width="704" height="400" fill="#C8CCD0" stroke="#636970"/>
    <rect x="32" y="28" width="640" height="344" rx="10" fill="#D8DBDE" stroke="#4C5056" stroke-width="2"/>
    <rect x="32" y="28" width="640" height="6" rx="3" fill="#8A5B22"/>
    <text x="60" y="68" font-size="16" font-weight="700" fill="#1C1F23">Chưa đặt lại RETAIN được</text>
    <text x="60" y="92" font-size="12" fill="#1C1F23">Không đọc được danh sách biến bị ảnh hưởng từ bộ điều khiển.</text>
    <line x1="60" y1="108" x2="644" y2="108" stroke="#636970"/>
    <rect x="60" y="124" width="584" height="72" rx="6" fill="#F5EFE4" stroke="#8A5B22"/>
    <text x="76" y="148" font-size="12" font-weight="700" fill="#8A5B22">⚠ Ảnh hưởng chưa tính được — thao tác bị chặn</text>
    <text x="76" y="168" font-size="11" fill="#1C1F23">Trạng thái Core: DEGRADED · dữ liệu gần nhất 47 giây trước</text>
    <text x="76" y="186" font-size="11" fill="#1C1F23">Mã lỗi: PRG-ERR-IMPACT-UNAVAILABLE-001</text>
    <text x="60" y="222" font-size="11" fill="#4A4F55">Trường thiếu, `null` hoặc không có `status` đều được xử lý như “chưa tính</text>
    <text x="60" y="238" font-size="11" fill="#4A4F55">được”. Thà chặn nhầm còn hơn đặt lại trạng thái điều khiển mà không biết</text>
    <text x="60" y="254" font-size="11" fill="#4A4F55">mất những giá trị nào — đây là quy tắc fail-closed của IFSPEC §6.1.</text>
    <rect x="60" y="274" width="584" height="40" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <text x="76" y="299" font-size="11" fill="#4A4F55">Ô xác nhận và ô mật khẩu không hiển thị khi thao tác bị chặn.</text>
    <rect x="60" y="330" width="176" height="36" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="76" y="353" font-size="12" fill="#1C1F23">Kiểm tra lại trạng thái</text>
    <rect x="252" y="330" width="176" height="36" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="268" y="353" font-size="12" fill="#4A4F55">Đặt lại RETAIN</text>
    <text x="252" y="382" font-size="10" fill="#4A4F55">Khóa tới khi đọc được ảnh hưởng</text>
  </g>

  <text x="24" y="1112" font-size="10" fill="#4A4F55">Đặc tả thiết kế — dữ liệu minh họa, không phải dữ liệu runtime.</text>
</svg>
