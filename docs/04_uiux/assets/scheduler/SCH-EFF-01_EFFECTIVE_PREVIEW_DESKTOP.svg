<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>SCH-EFF-01 Tab "Hiệu lực thực tế" của trình soạn lịch — desktop 1440, ba trạng thái</title>
  <desc>Ba artboard đặc tả EffectiveTab: có xung đột lịch, không lịch nào ghi lên điểm, và thiếu engine mkddc-schedule-sim. Màu lấy từ token LIGHT trong apps/web-ui/src/shared/theme/tokens.ts. Dữ liệu trong hình là MINH HOẠ, không phải dữ liệu runtime.</desc>

  <rect width="1440" height="1020" fill="#C8CCD0"/>

  <!-- ============ ARTBOARD 1 — CÓ XUNG ĐỘT ============ -->
  <text x="24" y="22" font-size="12" font-weight="700" fill="#4A4F55">Artboard 1 — nhiều lịch cùng ghi một điểm (T57-3.5 + T57-3.6 trên CÙNG một phản hồi)</text>

  <g transform="translate(24,36)">
    <rect x="0" y="0" width="1392" height="472" rx="8" fill="#D8DBDE" stroke="#636970"/>

    <!-- Hàng tab của trình soạn lịch -->
    <g font-size="12">
      <rect x="20" y="16" width="120" height="32" rx="6" fill="#C2C6CA" stroke="#636970"/>
      <text x="46" y="37" fill="#1C1F23">Tuần</text>
      <rect x="148" y="16" width="120" height="32" rx="6" fill="#C2C6CA" stroke="#636970"/>
      <text x="168" y="37" fill="#1C1F23">Ngoại lệ</text>
      <rect x="276" y="16" width="150" height="32" rx="6" fill="#26527C" stroke="#26527C"/>
      <text x="292" y="37" font-weight="700" fill="#FFFFFF">Hiệu lực thực tế</text>
    </g>
    <line x1="20" y1="60" x2="1372" y2="60" stroke="#636970"/>

    <!-- Bộ chọn điểm + hướng thời gian -->
    <text x="20" y="92" font-size="11" fill="#4A4F55">Điểm</text>
    <rect x="60" y="76" width="180" height="34" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <text x="74" y="98" font-size="12" font-family="monospace" fill="#1C1F23">AO-01</text>
    <path d="M218 90 l6 7 l6 -7" fill="none" stroke="#4A4F55" stroke-width="2"/>
    <rect x="252" y="76" width="130" height="34" rx="6" fill="#26527C" stroke="#26527C"/>
    <text x="278" y="98" font-size="12" font-weight="700" fill="#FFFFFF">24 giờ tới</text>
    <rect x="392" y="76" width="130" height="34" rx="6" fill="#C2C6CA" stroke="#636970"/>
    <text x="416" y="98" font-size="12" fill="#1C1F23">7 ngày qua</text>

    <!-- Khối xung đột: đặt TRÊN bảng, vì nó là thứ phải đọc trước -->
    <rect x="20" y="126" width="1352" height="122" rx="6" fill="#EEE9DB" stroke="#826500" stroke-width="2"/>
    <text x="36" y="150" font-size="13" font-weight="700" fill="#634D00" letter-spacing="0.4">2 THỜI ĐIỂM CÓ NHIỀU LỊCH CÙNG GHI</text>
    <g font-size="11">
      <text x="36" y="178" font-family="monospace" fill="#1C1F23">20/08/2026 06:00</text>
      <text x="200" y="178" fill="#4A4F55">SCH-001 · SCH-004 → thắng: </text>
      <text x="392" y="178" font-weight="700" fill="#1C1F23">SCH-004</text>
      <text x="470" y="178" fill="#4A4F55">(priority 8 &gt; 12 — số nhỏ thắng)</text>

      <text x="36" y="204" font-family="monospace" fill="#1C1F23">20/08/2026 18:00</text>
      <text x="200" y="204" fill="#4A4F55">SCH-001 · SCH-004 · SCH-009 → thắng: </text>
      <text x="450" y="204" font-weight="700" fill="#1C1F23">SCH-009</text>
      <text x="528" y="204" fill="#4A4F55">(ngoại lệ đè lịch tuần)</text>
    </g>
    <text x="36" y="232" font-size="10" fill="#4A4F55">Xung đột KHÔNG phải lỗi cấu hình — nó là sự thật về cách các lịch chồng nhau. Điều nguy hiểm là không biết lịch nào thắng.</text>

    <!-- Bảng đoạn hiệu lực -->
    <rect x="20" y="264" width="1352" height="164" rx="6" fill="#D8DBDE" stroke="#636970"/>
    <rect x="20" y="264" width="1352" height="30" rx="6" fill="#C2C6CA"/>
    <g font-size="10" fill="#4A4F55" letter-spacing="0.4">
      <text x="34" y="284">TỪ</text>
      <text x="230" y="284">ĐẾN</text>
      <text x="430" y="284">GIÁ TRỊ</text>
      <text x="560" y="284">LỊCH THẮNG</text>
      <text x="860" y="284">VÌ SAO</text>
    </g>
    <line x1="20" y1="294" x2="1372" y2="294" stroke="#636970"/>
    <g font-size="12">
      <text x="34" y="318" font-family="monospace" font-size="11" fill="#1C1F23">20/08/2026 00:00</text>
      <text x="230" y="318" font-family="monospace" font-size="11" fill="#1C1F23">20/08/2026 06:00</text>
      <text x="430" y="318" font-family="monospace" fill="#1C1F23">18.0</text>
      <text x="560" y="318" font-weight="700" fill="#1C1F23">Chế độ đêm</text>
      <text x="676" y="318" font-size="10" fill="#4A4F55">P12</text>
      <text x="860" y="318" font-size="10" fill="#4A4F55">weekly · SCH-001</text>
      <line x1="20" y1="328" x2="1372" y2="328" stroke="#636970"/>

      <text x="34" y="352" font-family="monospace" font-size="11" fill="#1C1F23">20/08/2026 06:00</text>
      <text x="230" y="352" font-family="monospace" font-size="11" fill="#1C1F23">20/08/2026 18:00</text>
      <text x="430" y="352" font-family="monospace" fill="#1C1F23">23.0</text>
      <text x="560" y="352" font-weight="700" fill="#1C1F23">Giờ hành chính</text>
      <text x="694" y="352" font-size="10" fill="#4A4F55">P8</text>
      <text x="860" y="352" font-size="10" fill="#4A4F55">weekly · SCH-004 thắng SCH-001</text>
      <line x1="20" y1="362" x2="1372" y2="362" stroke="#636970"/>

      <!-- Đoạn không lịch nào ghi: giá trị "—", KHÔNG phải 0 -->
      <text x="34" y="386" font-family="monospace" font-size="11" fill="#1C1F23">20/08/2026 18:00</text>
      <text x="230" y="386" font-family="monospace" font-size="11" fill="#1C1F23">20/08/2026 22:00</text>
      <text x="430" y="386" font-family="monospace" fill="#1C1F23">—</text>
      <text x="560" y="386" fill="#4A4F55">Không lịch nào</text>
      <text x="860" y="386" font-size="10" fill="#4A4F55">ngoài mọi effective period</text>
      <line x1="20" y1="396" x2="1372" y2="396" stroke="#636970"/>

      <text x="34" y="420" font-family="monospace" font-size="11" fill="#1C1F23">20/08/2026 22:00</text>
      <text x="230" y="420" font-family="monospace" font-size="11" fill="#1C1F23">21/08/2026 00:00</text>
      <text x="430" y="420" font-family="monospace" fill="#1C1F23">18.0</text>
      <text x="560" y="420" font-weight="700" fill="#1C1F23">Chế độ đêm</text>
      <text x="676" y="420" font-size="10" fill="#4A4F55">P12</text>
      <text x="860" y="420" font-size="10" fill="#4A4F55">weekly · SCH-001</text>
    </g>

    <text x="20" y="454" font-size="10" fill="#4A4F55">Tính bằng mkddc-schedule-sim --point — cùng engine mà bộ điều khiển dùng khi chạy thật.</text>
  </g>

  <!-- ============ ARTBOARD 2 — KHÔNG LỊCH NÀO GHI ============ -->
  <text x="24" y="540" font-size="12" font-weight="700" fill="#4A4F55">Artboard 2 — không lịch nào ghi lên điểm trong khoảng đã chọn (trạng thái RỖNG, hợp lệ)</text>

  <g transform="translate(24,554)">
    <rect x="0" y="0" width="1392" height="176" rx="8" fill="#D8DBDE" stroke="#636970"/>
    <text x="20" y="92" font-size="11" fill="#4A4F55">Điểm</text>
    <rect x="60" y="76" width="180" height="34" rx="6" fill="#C8CCD0" stroke="#636970"/>
    <text x="74" y="98" font-size="12" font-family="monospace" fill="#1C1F23">AO-03</text>
    <rect x="252" y="76" width="130" height="34" rx="6" fill="#26527C" stroke="#26527C"/>
    <text x="278" y="98" font-size="12" font-weight="700" fill="#FFFFFF">24 giờ tới</text>
    <line x1="20" y1="60" x2="1372" y2="60" stroke="#636970"/>
    <g font-size="12">
      <rect x="276" y="16" width="150" height="32" rx="6" fill="#26527C" stroke="#26527C"/>
      <text x="292" y="37" font-weight="700" fill="#FFFFFF">Hiệu lực thực tế</text>
    </g>

    <rect x="20" y="126" width="1352" height="34" rx="6" fill="#E5E6E8" stroke="#636970"/>
    <text x="36" y="148" font-size="12" fill="#4A4F55">Không có lịch nào ghi lên điểm này trong khoảng đã chọn.</text>
  </g>

  <!-- ============ ARTBOARD 3 — THIẾU ENGINE ============ -->
  <text x="24" y="762" font-size="12" font-weight="700" fill="#4A4F55">Artboard 3 — thiếu engine trên thiết bị (503) — giao diện KHÔNG tự phân xử thay</text>

  <g transform="translate(24,776)">
    <rect x="0" y="0" width="1392" height="220" rx="8" fill="#D8DBDE" stroke="#636970"/>
    <g font-size="12">
      <rect x="276" y="16" width="150" height="32" rx="6" fill="#26527C" stroke="#26527C"/>
      <text x="292" y="37" font-weight="700" fill="#FFFFFF">Hiệu lực thực tế</text>
    </g>
    <line x1="20" y1="60" x2="1372" y2="60" stroke="#636970"/>

    <rect x="20" y="80" width="1352" height="76" rx="6" fill="#F7E0E1" stroke="#CC1F28" stroke-width="2"/>
    <circle cx="52" cy="112" r="12" fill="none" stroke="#A01017" stroke-width="2"/>
    <text x="48" y="117" font-size="14" font-weight="700" fill="#A01017">!</text>
    <text x="76" y="106" font-size="13" font-weight="700" fill="#A01017">Không tính được hiệu lực thực tế</text>
    <text x="76" y="132" font-size="11" fill="#4A4F55">503 không tìm thấy mkddc-schedule-sim — phân xử ưu tiên thuộc bộ điều khiển, giao diện không tự tính thay.</text>

    <text x="20" y="186" font-size="11" fill="#4A4F55">Một bản phân xử thứ hai viết trong giao diện sẽ đúng cho tới ngày nó lệch khỏi bộ điều khiển — và ngày đó rơi đúng vào ca trực mà các lịch chồng nhau.</text>
    <text x="20" y="206" font-size="11" fill="#4A4F55">Vì vậy trạng thái đúng ở đây là NÓI RA thiếu gì, không phải hiện một bảng "gần đúng".</text>
  </g>
</svg>
