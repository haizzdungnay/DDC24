<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Phiếu kiểm I/O và bàn giao"><title>Phiếu kiểm I/O và bàn giao</title><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#162c3d} .dim{fill:#526777}</style>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#edf2f5" stroke="#cbd6df"/>
<rect x="0" y="0" width="1440" height="66" rx="0" fill="#102d40" stroke="#cbd6df"/>
<text x="24" y="31" font-size="20" font-weight="700" style="fill:#fff">DDC24 • Không gian tích hợp BMS</text>
<text x="24" y="53" font-size="12" font-weight="400" style="fill:#bce3e8">BẢN ĐỀ XUẤT • dữ liệu minh họa • chưa triển khai</text>
<text x="1190" y="36" font-size="15" font-weight="400" style="fill:#fff">Kỹ sư • VI • Trợ giúp</text>
<rect x="0" y="66" width="208" height="834" rx="0" fill="#e3eaef" stroke="#cbd6df"/>
<text x="22" y="111" font-size="15" font-weight="400" style="fill:#162c3d">Tổng quan</text>
<text x="22" y="159" font-size="15" font-weight="400" style="fill:#162c3d">Thiết bị / hệ thống</text>
<text x="22" y="207" font-size="15" font-weight="400" style="fill:#162c3d">Cấu hình &amp; ánh xạ</text>
<text x="22" y="255" font-size="15" font-weight="700" style="fill:#162c3d">Phiếu chạy thử</text>
<text x="22" y="303" font-size="15" font-weight="400" style="fill:#162c3d">Cảnh báo &amp; xu hướng</text>
<text x="22" y="351" font-size="15" font-weight="400" style="fill:#162c3d">Chẩn đoán</text>
<text x="22" y="399" font-size="15" font-weight="400" style="fill:#162c3d">Hồ sơ bàn giao</text>
<text x="22" y="447" font-size="15" font-weight="400" style="fill:#162c3d">Hệ thống</text>
<text x="235" y="110" font-size="25" font-weight="700" style="fill:#162c3d">Phiếu chạy thử / AHU-01</text>
<text x="235" y="144" font-size="14" font-weight="400" style="fill:#162c3d">Phiên CT-001 • revision 12 • người thực hiện: kỹ sư A • minh họa</text>
<rect x="235" y="172" width="1178" height="78" rx="10" fill="#fff2dd" stroke="#cbd6df"/>
<text x="257" y="204" font-size="19" font-weight="700" style="fill:#162c3d">Lệnh ghi thành công chưa chứng minh thiết bị đã hoạt động.</text>
<text x="257" y="231" font-size="15" font-weight="400" style="fill:#162c3d">Ghi nhận riêng: gửi lệnh → Core đọc lại → phản hồi tại hiện trường → trả về tự động.</text>
<rect x="235" y="271" width="327" height="556" rx="10" fill="#fff" stroke="#cbd6df"/>
<text x="255" y="305" font-size="19" font-weight="700" style="fill:#162c3d">Danh sách kiểm 6/8</text>
<rect x="252" y="325" width="292" height="65" rx="10" fill="#f5f8fa" stroke="#cbd6df"/>
<text x="270" y="363" font-size="15" font-weight="700" style="fill:#162c3d">UI-01 • Đã đối chiếu</text>
<rect x="252" y="403" width="292" height="65" rx="10" fill="#f5f8fa" stroke="#cbd6df"/>
<text x="270" y="441" font-size="15" font-weight="700" style="fill:#162c3d">DO-01 • Đã xác nhận</text>
<rect x="252" y="481" width="292" height="65" rx="10" fill="#fff2dd" stroke="#cbd6df"/>
<text x="270" y="519" font-size="15" font-weight="700" style="fill:#162c3d">DO-02 • Chờ hiện trường</text>
<rect x="252" y="559" width="292" height="65" rx="10" fill="#f5f8fa" stroke="#cbd6df"/>
<text x="270" y="597" font-size="15" font-weight="700" style="fill:#162c3d">AO-01 • Chưa kiểm</text>
<rect x="252" y="637" width="292" height="65" rx="10" fill="#f5f8fa" stroke="#cbd6df"/>
<text x="270" y="675" font-size="15" font-weight="700" style="fill:#162c3d">UI-12 • Lỗi phản hồi</text>
<rect x="584" y="271" width="829" height="556" rx="10" fill="#fff" stroke="#cbd6df"/>
<text x="607" y="306" font-size="22" font-weight="700" style="fill:#162c3d">DO-02 — Khởi động quạt cấp</text>
<text x="607" y="339" font-size="15" font-weight="400" style="fill:#162c3d">Controller DDC-01 • thời hạn 5 phút • phải cô lập tải trước</text>
<text x="607" y="389" font-size="17" font-weight="700" style="fill:#162c3d">1. Lệnh: ON  /  Core đọc lại: ON</text>
<text x="607" y="420" font-size="14" font-weight="400" style="fill:#162c3d">Thời hạn Core báo: 04:58 • commandId: minh họa</text>
<text x="607" y="468" font-size="17" font-weight="700" style="fill:#162c3d">2. Hiện trường: CHƯA XÁC NHẬN</text>
<rect x="607" y="490" width="243" height="44" rx="7" fill="#fff" stroke="#cbd6df"/>
<text x="619" y="518" font-size="14" font-weight="700" style="fill:#162c3d">Đã thấy quạt chạy</text>
<rect x="869" y="490" width="230" height="44" rx="7" fill="#fff" stroke="#cbd6df"/>
<text x="881" y="518" font-size="14" font-weight="700" style="fill:#162c3d">Không đạt</text>
<rect x="1118" y="490" width="270" height="44" rx="7" fill="#fff" stroke="#cbd6df"/>
<text x="1130" y="518" font-size="14" font-weight="700" style="fill:#162c3d">Bỏ qua + lý do</text>
<text x="607" y="570" font-size="17" font-weight="700" style="fill:#162c3d">3. Nhả lệnh và đọc lại quyền điều khiển</text>
<rect x="607" y="592" width="305" height="44" rx="7" fill="#fff" stroke="#cbd6df"/>
<text x="619" y="620" font-size="14" font-weight="700" style="fill:#162c3d">Xem trước trả về tự động</text>
<text x="607" y="662" font-size="14" font-weight="400" style="fill:#162c3d">Ghi chú / phép đo / ảnh: gắn với đúng điểm và phiên</text>
<rect x="607" y="725" width="225" height="44" rx="7" fill="#fff" stroke="#cbd6df"/>
<text x="619" y="753" font-size="14" font-weight="700" style="fill:#162c3d">Lưu kết quả</text>
<rect x="1075" y="725" width="305" height="44" rx="7" fill="#005f68" stroke="#cbd6df"/>
<text x="1087" y="753" font-size="14" font-weight="700" style="fill:#fff">Xem hồ sơ bàn giao</text>
</svg>
