<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040" role="img" aria-label="Phiếu kiểm I/O và bàn giao"><title>Phiếu kiểm I/O và bàn giao</title><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#162c3d} .dim{fill:#526777}</style>
<rect x="0" y="0" width="390" height="1040" rx="0" fill="#edf2f5" stroke="#cbd6df"/>
<rect x="0" y="0" width="390" height="64" rx="0" fill="#102d40" stroke="#cbd6df"/>
<text x="18" y="27" font-size="16" font-weight="700" style="fill:#fff">DDC24  /  Tích hợp BMS</text>
<text x="18" y="49" font-size="12" font-weight="400" style="fill:#bce3e8">BẢN ĐỀ XUẤT • dữ liệu minh họa</text>
<text x="18" y="96" font-size="21" font-weight="700" style="fill:#162c3d">Phiếu chạy thử / AHU-01</text>
<text x="18" y="123" font-size="14" font-weight="400" style="fill:#162c3d">DDC-01 • CT-001 • kiểm 6/8</text>
