<text x="32" y="200" font-size="17" font-weight="400" style="fill:#162c3d">thiết bị đã chạy.</text>
<rect x="16" y="278" width="358" height="246" rx="10" fill="#fff" stroke="#cbd6df"/>
<text x="32" y="312" font-size="20" font-weight="700" style="fill:#162c3d">DO-02 / Quạt cấp</text>
<text x="32" y="343" font-size="15" font-weight="400" style="fill:#162c3d">Lệnh ON • Core đọc lại ON</text>
<text x="32" y="371" font-size="15" font-weight="400" style="fill:#162c3d">Core báo tự nhả còn 04:58</text>
