<text x="32" y="578" font-size="18" font-weight="700" style="fill:#162c3d">Bước 3: Nhả lệnh</text>
<text x="32" y="608" font-size="14" font-weight="400" style="fill:#162c3d">Đọc lại quyền điều khiển; không coi</text>
<text x="32" y="629" font-size="14" font-weight="400" style="fill:#162c3d">hết TTL trên web là đã nhả.</text>
<rect x="32" y="636" width="324" height="44" rx="7" fill="#fff" stroke="#cbd6df"/>
<text x="44" y="664" font-size="14" font-weight="700" style="fill:#162c3d">Xem trước trả về tự động</text>
