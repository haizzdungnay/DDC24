<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">FBD EDIT mobile read-only target</title>
  <desc id="desc">Illustrative mobile read-only FBD surface. Content is design illustration, not runtime evidence.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d9e6e3" stroke-width="1"/></pattern>
    <style>
      .page{fill:#101619}.panel{fill:#1b272c;stroke:#4c666b;stroke-width:2}.canvas{fill:#f8fbfa;stroke:#4c666b;stroke-width:2}.label{fill:#dce9e7;font:600 24px sans-serif}.small{fill:#a9bcbd;font:18px sans-serif}.accent{fill:#63e2c3;font:700 28px sans-serif}.node{fill:#eef7ff;stroke:#4d9cf6;stroke-width:3}.nodeText{fill:#1457a8;font:600 20px sans-serif}.wire{fill:none;stroke:#637983;stroke-width:4;stroke-linejoin:round}.ro{fill:#27343a;stroke:#687d82;stroke-width:2}.warn{fill:#2b2419;stroke:#b78b4c;stroke-width:2}
    </style>
  </defs>
  <rect class="page" width="900" height="1500"/>
  <text class="accent" x="28" y="48">FBD EDIT · Mobile READ ONLY</text>
  <text class="small" x="28" y="80">Illustrative target; no runtime data is embedded.</text>
  <rect class="warn" x="28" y="108" width="844" height="92" rx="8"/>
  <text class="small" x="48" y="145">Chế độ chỉ đọc dưới 768 px</text>
  <text class="small" x="48" y="174">Có thể xem/chọn; không kéo, nối, xóa hoặc lưu.</text>

  <rect class="panel" x="28" y="224" width="844" height="88" rx="8"/>
  <text class="label" x="48" y="260">FBD · AHU_Main</text>
  <text class="small" x="48" y="290">Network: ENABLE_LOGIC · Theme: Theo giao diện web</text>

  <rect class="canvas" x="28" y="336" width="844" height="450" rx="8"/>
  <rect x="30" y="338" width="840" height="446" fill="url(#grid)"/>
  <text class="small" x="48" y="370">Pan bằng hai ngón · zoom bằng pinch · chạm để chọn</text>
  <rect class="node" x="86" y="446" width="210" height="86" rx="8"/>
  <text class="nodeText" x="104" y="482">INPUT</text>
  <text class="small" x="104" y="512">AI_Temp_SAT · REAL</text>
  <rect class="node" x="366" y="526" width="210" height="104" rx="8"/>
  <text class="nodeText" x="384" y="566">LIMIT</text>
  <text class="small" x="384" y="598">IN · OUT · REAL</text>
  <path class="wire" d="M296 489 H340 Q354 489 354 506 V578 Q354 594 366 594"/>

  <rect class="panel" x="28" y="810" width="844" height="110" rx="8"/>
  <text class="label" x="48" y="850">Toolbar</text>
  <text class="small" x="48" y="882">Zoom · Fit · Network view · Theme · Mở dock</text>
  <text class="small" x="48" y="908">Mutation controls ẩn/disabled theo policy.</text>

  <rect class="panel" x="28" y="944" width="844" height="200" rx="8"/>
  <text class="label" x="48" y="984">Dải thông tin</text>
  <text class="small" x="48" y="1022">Problems · Watch · Search · Cross Reference · Mini Map</text>
  <text class="small" x="48" y="1054">Nguồn thiếu: “Chưa có dữ liệu” / “Không khả dụng”.</text>
  <text class="small" x="48" y="1086">Không biến unknown/offline thành 0.</text>
  <text class="small" x="48" y="1118">Chạm một mục để chọn hoặc mở drawer.</text>

  <rect class="ro" x="28" y="1170" width="844" height="250" rx="8"/>
  <text class="label" x="48" y="1210">Drawer Inspector (read-only)</text>
  <text class="small" x="48" y="1252">Block: LIMIT · Type: FUNCTION</text>
  <text class="small" x="48" y="1286">I/O: IN REAL → OUT REAL</text>
  <text class="small" x="48" y="1320">Parameters: không có</text>
  <text class="small" x="48" y="1354">Runtime value: — (không có nguồn ở EDIT)</text>
  <text class="small" x="48" y="1388">Escape đóng drawer và trả focus về nút mở.</text>
</svg>
