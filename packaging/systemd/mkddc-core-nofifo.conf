# Drop-in: tắt SCHED_FIFO cho lab board (Orange Pi kernel không hỗ trợ RT priority cao)
# Đặt tại: /etc/systemd/system/mkddc-core.service.d/nofifo.conf
# Khi dùng kernel RT thật: xóa drop-in này
[Service]
CPUSchedulingPolicy=other
CPUSchedulingPriority=0
LimitRTPRIO=0
AmbientCapabilities=
CapabilityBoundingSet=~CAP_SYS_NICE
