# Ethernet interface exposed to the local commissioning authority.
# Wi-Fi, loopback and other interfaces remain outside the HMI/Web transaction scope.
#
# Tên này khác nhau theo bo: Orange Pi 5B = `end1`, Foxlinx SOM-DDC-24 (OK1126B)
# = `eth0`. Đặt đúng tên của bo ở đây. Nếu tên khai báo không tồn tại trong kernel,
# mkddc-netcfg tự chuyển sang interface Ethernet CÓ DÂY đầu tiên đang hiện diện và
# ghi cảnh báo `netcfg.start interface_not_found=... resolved=...` vào journal —
# cơ chế cứu hộ, không phải chỗ để dựa dẫm.
NETCFG_INTERFACE=eth0
