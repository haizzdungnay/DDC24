# ADR-061 4.11 (G2 tạm, chờ PREEMPT_RT): cài vào
# /etc/systemd/system/irqbalance.service.d/mkddc-rt.conf
#
# irqbalance không được đặt IRQ lên CPU3 — CPU dành riêng cho vòng quét 10 ms của
# mkddc-core. Đo trên Foxlinx 2026-09-26: IRQ eMMC `dw-mci` từng bắn 69 triệu
# ngắt lên CPU3; dời hết IRQ dời được khỏi CPU3 hạ jitter tối đa của tick 10 ms
# từ 470 xuống 173 µs. irqbalance 1.9 bỏ qua `IRQBALANCE_BANNED_CPUS`, chỉ đọc
# `IRQBALANCE_BANNED_CPULIST`.
[Service]
Environment=IRQBALANCE_BANNED_CPULIST=3
