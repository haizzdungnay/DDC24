# Drop-in override cho mkddc-iobus khi dùng fake MCU (lab only)
# Đặt tại: /etc/systemd/system/mkddc-iobus.service.d/nomcu.conf
# Khi có MCU thật: xóa drop-in này + disable mkddc-pty + mkddc-fakemcu
[Unit]
After=mkddc-fakemcu.service
Requires=mkddc-fakemcu.service

[Service]
ExecStart=
ExecStart=/usr/sbin/mkddc-iobus --uart /tmp/mkddc-iop-a
