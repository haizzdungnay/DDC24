# ADR-061 4.11 (G2 tạm, chờ PREEMPT_RT): cài vào
# /etc/systemd/system.conf.d/mkddc-rt.conf
#
# PID 1 và MỌI tiến trình systemd sinh ra mặc định chạy trên CPU0–2; chỉ
# mkddc-core (unit tự khai `CPUAffinity=3`) được chạy trên CPU3. Đo trên
# Foxlinx 2026-09-26 (kernel 6.1 `PREEMPT_VOLUNTARY`): chỉ ghim các service
# mkddc thì systemd/journald/sshd/kworker không ghim vẫn chạy trên CPU3, và
# một lần `systemctl restart mkddc-web-pi` làm vòng quét 10 ms thức dậy trễ
# 2,3–3,8 ms (có lần 12 ms kèm lỡ một base step lúc khởi động). Ghim toàn bộ
# user-space sang CPU0–2 và workqueue unbound sang 0–2 (unit core) thì cùng
# thao tác chỉ còn 117–119 µs; cửa sổ 300 s: tối đa 104–131 µs, 0,04 % lần
# vượt 100 µs.
#
# Có hiệu lực từ lần boot kế tiếp (hoặc `systemctl daemon-reexec`); tiến trình
# đang chạy giữ affinity cũ.
[Manager]
CPUAffinity=0-2
